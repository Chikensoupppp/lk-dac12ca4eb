name: iOS TestFlight
# Branch push (this file changed): archive and export a signed IPA only. Nothing is uploaded.
# Tag push named testflight-*: also uploads the build to App Store Connect / TestFlight.
# Only the repository owner's explicit go-ahead should create such a tag.
on:
  push:
    branches: ['ios/**']
    paths: ['.github/workflows/ios-testflight.yml', 'apps/ios/project.testflight.yml', 'scripts/check-asc-key.sh']
    tags: ['testflight-*']
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      EXPORT_DESTINATION: ${{ startsWith(github.ref, 'refs/tags/testflight-') && 'upload' || 'export' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 or newer (Apple requires the iOS 26 SDK for uploads)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Generate release project
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate --spec project.testflight.yml
      - name: Write API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Check API key (no secret values printed)
        run: bash scripts/check-asc-key.sh "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Archive
        shell: bash
        run: |
          set -o pipefail
          cd apps/ios
          # Unsigned archive: the team has no registered device, so Xcode cannot make a development
          # profile. Distribution signing happens in the export step below.
          xcodebuild archive -project LockIn.xcodeproj -scheme LockIn -configuration Release             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LockIn.xcarchive"             CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO             CURRENT_PROJECT_VERSION="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"
      - name: Export (and upload on testflight-* tags)
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$EXPORT_DESTINATION</string>
            <key>teamID</key><string>D6TH2NSZLT</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          echo "Export destination: $EXPORT_DESTINATION"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LockIn.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
