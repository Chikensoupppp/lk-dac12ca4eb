name: Plus subscription text
# Fills in the Plus subscription names and notes (scripts/asc-plus-fix.py).
# Run by pushing an `asc-plusfix-N` tag.
on:
  push:
    tags: ['asc-plusfix-*']
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyjwt cryptography requests
      - name: Set subscription text
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python scripts/asc-plus-fix.py
