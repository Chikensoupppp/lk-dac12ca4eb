name: iOS native CI
on:
  push:
    paths: ['apps/ios/**', '.github/workflows/ios-native-ci.yml']
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios-native-ci.yml']
  workflow_dispatch:
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: xcodebuild -version && swift --version && xcrun simctl list devices available
      - name: Generate project
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate
          xcodebuild -list -project LockIn.xcodeproj
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          cd apps/ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone") and x["isAvailable"]))')
          xcodebuild test -project LockIn.xcodeproj -scheme LockIn -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/LockInDerived" -resultBundlePath "$RUNNER_TEMP/LockIn.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Export test screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/LockIn.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/LockIn.xcresult" --output-path "$RUNNER_TEMP/test-attachments"
          fi
      - name: Test compact-device controls and active timer
        shell: bash
        run: |
          set -o pipefail
          cd apps/ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"] == "iPhone SE (3rd generation)" and x["isAvailable"]))')
          xcodebuild test -project LockIn.xcodeproj -scheme LockIn -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:LockInUITests/FocusUITests/testLargeTextControlsAreReachable -only-testing:LockInUITests/FocusUITests/testStartAndEnd -only-testing:LockInUITests/FocusUITests/testNaturalCompletion -derivedDataPath "$RUNNER_TEMP/LockInDerived" -resultBundlePath "$RUNNER_TEMP/Compact.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/compact-test.log"
      - name: Export compact-device test screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/Compact.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Compact.xcresult" --output-path "$RUNNER_TEMP/compact-attachments"
          fi
      - name: Test large-device clock states
        shell: bash
        run: |
          set -o pipefail
          cd apps/ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"] == "iPhone 16 Pro Max" and x["isAvailable"]))')
          xcodebuild test -project LockIn.xcodeproj -scheme LockIn -destination "platform=iOS Simulator,id=$DEVICE_ID" -only-testing:LockInUITests/FocusUITests/testLargeTextControlsAreReachable -only-testing:LockInUITests/FocusUITests/testStartAndEnd -only-testing:LockInUITests/FocusUITests/testNaturalCompletion -derivedDataPath "$RUNNER_TEMP/LockInDerived" -resultBundlePath "$RUNNER_TEMP/Large.xcresult" CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/large-test.log"
      - name: Export large-device test screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/Large.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Large.xcresult" --output-path "$RUNNER_TEMP/large-attachments"
          fi
      - name: Capture simulator screens
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/screenshots"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" > "$RUNNER_TEMP/selected-devices.txt" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          devices=[x for group in data["devices"].values() for x in group if x["isAvailable"] and x["name"].startswith("iPhone")]
          for names in [("iPhone SE (3rd generation)", "iPhone 16e", "iPhone 16"), ("iPhone 16", "iPhone 15"), ("iPhone 16 Pro Max", "iPhone 15 Pro Max")]:
              device=next((x for name in names for x in devices if x["name"] == name), None)
              if device:
                  print(device["udid"], device["name"].replace(" ", "-"))
          PY
          while read -r id name; do
            xcrun simctl boot "$id" || true
            xcrun simctl bootstatus "$id" -b
            xcrun simctl install "$id" "$RUNNER_TEMP/LockInDerived/Build/Products/Debug-iphonesimulator/LockIn.app"
            xcrun simctl status_bar "$id" override --time 9:41 --batteryState charged --batteryLevel 100
            xcrun simctl launch "$id" com.brandon132199.lockin -ui-testing-calm-background
            sleep 5
            xcrun simctl io "$id" screenshot "$RUNNER_TEMP/screenshots/$name-idle.png"
            xcrun simctl shutdown "$id"
          done < "$RUNNER_TEMP/selected-devices.txt"
      - name: Upload build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-results
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/LockIn.xcresult
            ${{ runner.temp }}/LockInDerived/Build/Products/Debug-iphonesimulator/LockIn.app
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/test-attachments
            ${{ runner.temp }}/compact-test.log
            ${{ runner.temp }}/Compact.xcresult
            ${{ runner.temp }}/compact-attachments
            ${{ runner.temp }}/large-test.log
            ${{ runner.temp }}/Large.xcresult
            ${{ runner.temp }}/large-attachments
            ${{ runner.temp }}/selected-devices.txt
          if-no-files-found: warn
      - name: Upload visual captures separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-visuals
          path: |
            ${{ runner.temp }}/test-attachments/*.png
            ${{ runner.temp }}/test-attachments/manifest.json
            ${{ runner.temp }}/compact-attachments/*.png
            ${{ runner.temp }}/compact-attachments/manifest.json
            ${{ runner.temp }}/large-attachments/*.png
            ${{ runner.temp }}/large-attachments/manifest.json
            ${{ runner.temp }}/screenshots
          if-no-files-found: warn
