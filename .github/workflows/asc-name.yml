name: App Store name
# Sets the App Store name from scripts/asc-set-name.py. Run by pushing an `asc-name-N` tag.
on:
  push:
    tags: ['asc-name-*']
jobs:
  name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyjwt cryptography requests
      - name: Set name
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python scripts/asc-set-name.py
