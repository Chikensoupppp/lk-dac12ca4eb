name: LockIn
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    sources: [LockIn, Shared, ReportShared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockIn.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandon132199.lockin]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - target: LockInMonitor
      - target: LockInWidget
      - target: LockInReport
      - target: LockInShield
      - target: LockInShieldAction
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin
        # RevenueCat's PUBLIC Apple SDK key (starts with appl_). Public keys are made to ship
        # inside apps. Empty = RevenueCat stays off and plain StoreKit still works.
        REVENUECAT_API_KEY: appl_isEkAeKkQaltkFfNOQNsiZPrjEg
        INFOPLIST_FILE: AppInfo/LockIn-Extra.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwipeLater
        INFOPLIST_KEY_NSCameraUsageDescription: SwipeLater uses the camera once, to scan the QR code that pairs your PC.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: SwipeLater reads your calendar on this iPhone to find free times for your lock-ins, and adds them to it only if you turn that on. Nothing leaves your iPhone.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: SwipeLater talks to your PC and to your Key Holder's phone nearby, so a session can start on both or a friend can let you out.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Portrait only: the slides and the focus screen are laid out for an upright phone.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  LockInMonitor:
    type: app-extension
    platform: iOS
    sources: [LockInMonitor, Shared]
    entitlements:
      path: Config/LockInMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInMonitor-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.monitor
        GENERATE_INFOPLIST_FILE: NO
  # Draws the user's real Screen Time on the onboarding reveal slide. Apple sandboxes it: it can
  # read usage but cannot send anything back to the app.
  LockInReport:
    type: extensionkit-extension
    platform: iOS
    sources: [LockInReport, ReportShared, BrainArt/Assets.xcassets]
    entitlements:
      path: Config/LockInReport.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: Config/LockInReport-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.report
        GENERATE_INFOPLIST_FILE: NO
  # SwipeLater's own block screen (cream paper, the brain, "Instagram can wait."), shown instead of
  # iOS's grey one when a blocked app is opened. Reads the session's end from the app group.
  LockInShield:
    type: app-extension
    platform: iOS
    sources: [LockInShield, Shared, BrainArt/Assets.xcassets]
    entitlements:
      path: Config/LockInShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInShield-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInShield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.shield
        GENERATE_INFOPLIST_FILE: NO
  # The block screen's buttons: "Back to focus" closes the app, "Swipe it later" also leaves a
  # reminder for the session's end.
  LockInShieldAction:
    type: app-extension
    platform: iOS
    sources: [LockInShieldAction, Shared]
    entitlements:
      path: Config/LockInShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInShieldAction-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Shield Actions
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.shieldaction
        GENERATE_INFOPLIST_FILE: NO
  # The home screen brain widget. Reads the day's level from the shared app group (BrainLevel).
  LockInWidget:
    type: app-extension
    platform: iOS
    sources: [LockInWidget, Shared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockInWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInWidget-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Brain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.widget
        GENERATE_INFOPLIST_FILE: NO
  LockInTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LockInTests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.tests
        GENERATE_INFOPLIST_FILE: YES
  LockInUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LockInUITests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
        LockInTests: [test]
        LockInUITests: [test]
    test:
      targets: [LockInTests, LockInUITests]
