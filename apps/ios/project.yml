name: LockIn
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  LockIn:
    type: application
    platform: iOS
    sources: [LockIn]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.focus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  LockInTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LockInTests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.focus.tests
        GENERATE_INFOPLIST_FILE: YES
  LockInUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LockInUITests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lockin.focus.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
        LockInTests: [test]
        LockInUITests: [test]
    test:
      targets: [LockInTests, LockInUITests]
