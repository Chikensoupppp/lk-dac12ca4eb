name: LockIn
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    sources: [LockIn, Shared, ReportShared, BrainArt]
    entitlements:
      path: Config/LockIn.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    dependencies:
      - target: LockInMonitor
      - target: LockInWidget
      - target: LockInReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lock In
        INFOPLIST_KEY_NSCameraUsageDescription: Lock In uses the camera once, to scan the QR code that pairs your PC.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Lock In talks to your PC on your Wi-Fi so a focus session can start on both.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LockInMonitor:
    type: app-extension
    platform: iOS
    sources: [LockInMonitor, Shared]
    entitlements:
      path: Config/LockInMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInMonitor-Info.plist
      properties:
        CFBundleDisplayName: Lock In Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.monitor
        GENERATE_INFOPLIST_FILE: NO
  # Draws the user's real Screen Time on the onboarding reveal slide. Apple sandboxes it: it can
  # read usage but cannot send anything back to the app.
  LockInReport:
    type: app-extension
    platform: iOS
    sources: [LockInReport, ReportShared]
    entitlements:
      path: Config/LockInReport.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: Config/LockInReport-Info.plist
      properties:
        CFBundleDisplayName: Lock In Report
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.report
        GENERATE_INFOPLIST_FILE: NO
  # The home screen brain widget. Reads the day's level from the shared app group (BrainLevel).
  LockInWidget:
    type: app-extension
    platform: iOS
    sources: [LockInWidget, Shared, BrainArt]
    entitlements:
      path: Config/LockInWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInWidget-Info.plist
      properties:
        CFBundleDisplayName: Lock In Brain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.widget
        GENERATE_INFOPLIST_FILE: NO
  LockInTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LockInTests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.tests
        GENERATE_INFOPLIST_FILE: YES
  LockInUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LockInUITests]
    dependencies:
      - target: LockIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
        LockInTests: [test]
        LockInUITests: [test]
    test:
      targets: [LockInTests, LockInUITests]
