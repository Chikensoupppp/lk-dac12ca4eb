name: LockIn
# Release spec for TestFlight. No Family Controls entitlement and no Device Activity
# extension: only the development entitlement is available until Apple approves
# distribution. Screen Time controls report "unavailable" in this build.
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    sources: [LockIn, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Lock In
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
