name: LockIn
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
# Release spec for TestFlight. Apple approved Family Controls (Distribution) for both
# bundle IDs, so this build carries the entitlement and the Device Activity extension.
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    # LockInReport draws the real Screen Time hours on the reveal slide (ScreenTimeReport.isAvailable
    # checks that it is in the build).
    sources: [LockIn, Shared, ReportShared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockIn.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandon132199.lockin]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: production
    dependencies:
      - target: LockInMonitor
      - target: LockInReport
      - target: LockInWidget
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin
        # RevenueCat's public Apple SDK key (made to ship in apps). Same as project.yml.
        REVENUECAT_API_KEY: appl_isEkAeKkQaltkFfNOQNsiZPrjEg
        INFOPLIST_FILE: AppInfo/LockIn-Extra.plist
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: SwipeLater
        INFOPLIST_KEY_NSCameraUsageDescription: SwipeLater uses the camera once, to scan the QR code that pairs your PC.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: SwipeLater talks to your PC and to your Key Holder's phone nearby, so a session can start on both or a friend can let you out.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LockInMonitor:
    type: app-extension
    platform: iOS
    sources: [LockInMonitor, Shared]
    entitlements:
      path: Config/LockInMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInMonitor-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.monitor
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # The home screen brain widget. Reads the day's level from the shared app group (BrainLevel).
  # Draws the user's real Screen Time on the onboarding reveal slide. Apple sandboxes it: it can
  # read usage but cannot send anything back to the app.
  LockInReport:
    type: extensionkit-extension
    platform: iOS
    sources: [LockInReport, ReportShared, BrainArt/Assets.xcassets]
    entitlements:
      path: Config/LockInReport.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: Config/LockInReport-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.report
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  LockInWidget:
    type: app-extension
    platform: iOS
    sources: [LockInWidget, Shared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockInWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInWidget-Info.plist
      properties:
        CFBundleDisplayName: SwipeLater Brain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.widget
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
