name: LockIn
# Release spec for TestFlight. Apple approved Family Controls (Distribution) for both
# bundle IDs, so this build carries the entitlement and the Device Activity extension.
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LockIn:
    type: application
    platform: iOS
    # The LockInReport extension (real hours on the reveal slide) is not in this build yet: its
    # bundle ID needs Family Controls (Distribution) approval first. Without it the app skips the
    # reveal and uses the user's guess (see ScreenTimeReport.isAvailable).
    sources: [LockIn, Shared, ReportShared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockIn.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.brandon132199.lockin]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: production
    dependencies:
      - target: LockInMonitor
      - target: LockInWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin
        INFOPLIST_FILE: AppInfo/LockIn-Extra.plist
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Lock In
        INFOPLIST_KEY_NSCameraUsageDescription: Lock In uses the camera once, to scan the QR code that pairs your PC.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Lock In talks to your PC and to your Key Holder's phone nearby, so a session can start on both or a friend can let you out.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  LockInMonitor:
    type: app-extension
    platform: iOS
    sources: [LockInMonitor, Shared]
    entitlements:
      path: Config/LockInMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInMonitor-Info.plist
      properties:
        CFBundleDisplayName: Lock In Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LockInMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.monitor
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  # The home screen brain widget. Reads the day's level from the shared app group (BrainLevel).
  LockInWidget:
    type: app-extension
    platform: iOS
    sources: [LockInWidget, Shared, BrainArt, LiveShared]
    entitlements:
      path: Config/LockInWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brandon132199.lockin]
    info:
      path: Config/LockInWidget-Info.plist
      properties:
        CFBundleDisplayName: Lock In Brain
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandon132199.lockin.widget
        DEVELOPMENT_TEAM: D6TH2NSZLT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
schemes:
  LockIn:
    build:
      targets:
        LockIn: all
