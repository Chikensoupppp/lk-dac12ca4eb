<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Schedule v2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* v2, nicer. 1 the plan receipt: the swap is a red pen strike and a blue sticker, and the time
     sits on a stub you can tear ("Can't do 4:00?"). 2 your calendar as five evening strips, busy
     time hatched like riso, the free slot a blue pill with the brain on it. 3 no calendar: one big
     time with - / +, day stamps, and two choices side by side (the self-locking one is Plus). */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --red:#D25A44; --soft:#45473F; --sheet:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, sans-serif; }
  .row { display: flex; gap: 22px; padding: 22px; width: max-content; }
  .lab { font: 700 13px/1 "IBM Plex Mono", monospace; color: #3b3b3b; margin: 0 0 8px 6px; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 71px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 87px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  .tag { position: absolute; left: 24px; top: 138px; display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  h1 { position: absolute; left: 24px; right: 24px; top: 158px; font: 400 48px/.95 Anton, sans-serif; color: var(--ink); text-transform: uppercase; }
  h1 em { font-style: normal; color: var(--blue); }
  .sub { position: absolute; left: 24px; right: 24px; font: 600 14px/1.35 "IBM Plex Mono", monospace; color: var(--ink); }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 86px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page); display: grid; place-items: center; font: 800 19px/1 Inter; letter-spacing: 2px; }
  .sec { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 15px/1 Inter; color: rgba(27,27,27,.7); }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
  .hand { font: 400 21px/1.08 "Caveat Brush", cursive; color: var(--ink); }

  /* 1 receipt with a tear-off stub */
  .rc { position: absolute; left: 30px; right: 30px; top: 264px; filter: drop-shadow(0 12px 14px rgba(0,0,0,.14)); }
  .rc .paper { background: #fff; padding: 20px 20px 18px; font: 600 14px/1 "IBM Plex Mono", monospace; color: var(--ink);
               -webkit-mask: radial-gradient(circle 7px at 50% 0, transparent 6.5px, #000 7px) 0 0 / 18px 100% repeat-x; }
  .rc .h { text-align: center; font-weight: 800; letter-spacing: 2px; margin-bottom: 14px; }
  .swap { position: relative; height: 70px; margin-bottom: 6px; }
  .swap .old { position: absolute; left: 0; top: 6px; font: 700 16px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.6); }
  .swap .old svg { position: absolute; left: -4px; top: -2px; }
  .swap .new { position: absolute; right: 2px; top: 22px; padding: 8px 12px; background: var(--blue); color: #fff; border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 3px 0 var(--ink);
               font: 400 22px/1 Anton, sans-serif; letter-spacing: .5px; transform: rotate(-3deg); }
  .swap .arr { position: absolute; left: 70px; top: 22px; }
  .rc .r { display: flex; justify-content: space-between; padding: 6px 0; } .rc .r b { font-weight: 800; }
  .rc .win { display: flex; justify-content: space-between; align-items: baseline; padding-top: 10px; border-top: 1.5px dashed rgba(27,27,27,.25); margin-top: 8px; }
  .rc .win b { font: 400 32px/1 Anton, sans-serif; color: var(--blue); }
  .stub { margin-top: 0; background: var(--sheet); border-top: 2px dashed rgba(27,27,27,.35); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
          -webkit-mask: radial-gradient(circle 7px at 50% 100%, transparent 6.5px, #000 7px) 0 0 / 18px 100% repeat-x; transform-origin: 0 0; transform: rotate(1.5deg) translate(3px, 2px); }
  .stub .t small { display: block; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--soft); }
  .stub .t b { display: block; font: 400 28px/1 Anton, sans-serif; margin-top: 4px; }
  .stub .cant { padding: 9px 12px; border: 2px solid var(--ink); border-radius: 999px; background: #fff; font: 800 13px/1 Inter; box-shadow: 0 3px 0 var(--ink); white-space: nowrap; }
  .scis { position: absolute; left: 8px; top: 372px; font: 18px/1 Inter; transform: rotate(-90deg); color: var(--soft); }

  /* 2 calendar strips */
  .cal { position: absolute; left: 24px; right: 24px; top: 300px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink); padding: 14px 14px 10px; }
  .strip { display: flex; align-items: center; gap: 10px; height: 38px; }
  .strip small { width: 26px; font: 700 11px/1 "IBM Plex Mono", monospace; color: var(--soft); }
  .line { position: relative; flex: 1; height: 26px; border-radius: 13px; background: #fff; border: 1.5px solid rgba(27,27,27,.14); overflow: hidden; }
  .busy { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, rgba(27,27,27,.22) 0 2px, transparent 2px 6px); border-left: 1.5px solid rgba(27,27,27,.25); border-right: 1.5px solid rgba(27,27,27,.25); }
  .free { position: absolute; top: 2px; bottom: 2px; border-radius: 11px; background: var(--blue); border: 2px solid var(--ink); }
  .ticks { display: flex; justify-content: space-between; margin: 6px 0 0 36px; font: 600 9.5px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.5); }
  .now { position: absolute; top: 290px; bottom: 0; width: 2px; background: var(--sun); }
  .pin { position: absolute; width: 58px; }
  .foot2 { position: absolute; left: 24px; right: 24px; top: 610px; display: flex; gap: 12px; align-items: flex-start; }
  .foot2 .k { display: flex; gap: 14px; font: 600 11px/1 "IBM Plex Mono", monospace; color: var(--soft); margin-top: 2px; }
  .k i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }

  .sugg { position: absolute; left: 24px; right: 24px; top: 296px; display: flex; gap: 9px; }
  .sg { flex: 1; padding: 11px 10px; background: #fff; border: 2px solid rgba(27,27,27,.16); border-radius: 14px; }
  .sg b { display: block; font: 400 22px/1 Anton, sans-serif; color: var(--ink); }
  .sg span { display: block; font: 600 11px/1.2 "IBM Plex Mono", monospace; color: var(--soft); margin-top: 5px; }
  .sg.on { background: var(--blue); border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .sg.on b, .sg.on span { color: #fff; }
  /* 3 pick */
  .big { position: absolute; left: 24px; right: 24px; top: 272px; height: 112px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 22px; box-shadow: 0 5px 0 var(--ink);
         display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
  .big .pm { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 800 26px/1 Inter; background: #fff; }
  .big b { font: 400 64px/1 Anton, sans-serif; color: var(--ink); }
  .big b span { font-size: 26px; margin-left: 4px; }
  .days { position: absolute; left: 24px; right: 24px; top: 406px; display: flex; justify-content: space-between; }
  .days span { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; border: 2px solid var(--ink); font: 700 13px/1 "IBM Plex Mono", monospace; background: #fff; }
  .days span.on { background: var(--blue); color: #fff; transform: rotate(-6deg); box-shadow: 0 3px 0 var(--ink); }
  .q { position: absolute; left: 24px; top: 474px; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--soft); }
  .two { position: absolute; left: 24px; right: 24px; top: 494px; display: flex; gap: 12px; }
  .ch { position: relative; flex: 1; height: 148px; border-radius: 18px; border: 2px solid rgba(27,27,27,.18); background: #fff; padding: 14px; }
  .ch.on { border-color: var(--ink); box-shadow: 0 5px 0 var(--ink); background: var(--blue); color: #fff; }
  .ch .ic { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; background: var(--sun); }
  .ch.on .ic { background: #fff; }
  .ch b { display: block; font: 800 17px/1.1 Inter; margin-top: 14px; }
  .ch span { display: block; font: 500 12.5px/1.25 Inter; margin-top: 4px; opacity: .8; }
  .plus { position: absolute; right: 10px; top: -11px; padding: 4px 8px; background: var(--sun); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const BRAIN = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";
const chrome = (step, tag, title, btn, sec) => `<div class="bars">${Array.from({ length: 14 }, (_, i) => `<i class="${i < step ? "on" : ""}"></i>`).join("")}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="tag"><i></i>${tag}</div><h1>${title}</h1><div class="btn">${btn}</div>${sec ? `<div class="sec">${sec}</div>` : ""}<div class="home"></div>`;
// Evenings 3 PM to 11 PM. Busy as [start, end] hours.
const busy = [[[15, 16.5], [19, 20]], [[15, 17]], [[15, 16], [16.5, 17.3]], [[15, 16.5], [19.5, 21]], [[15, 15.5], [20, 23]]];
const x = h => (h - 15) / 8 * 100;
const lock = c => `<svg width="18" height="18" viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="2" fill="${c}"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="${c}" stroke-width="2" fill="none"/></svg>`;
const bell = `<svg width="18" height="18" viewBox="0 0 14 14"><path d="M7 2a3.4 3.4 0 0 0-3.4 3.4v2.4L2.4 10h9.2l-1.2-2.2V5.4A3.4 3.4 0 0 0 7 2z" fill="#1B1B1B"/><circle cx="7" cy="11.6" r="1.3" fill="#1B1B1B"/></svg>`;
const phones = [
  ["1  YOUR PLAN", chrome(12, "YOUR PLAN", "Your lock-in<br>plan.", "THIS IS MY PLAN", "Make it easier") + `
    <div class="sub" style="top:268px">Made from your answers.</div>
    <div class="rc" style="top:304px"><div class="paper"><div class="h">PLAN FOR: YOU</div>
      <div class="swap"><div class="old">VIDEO + SOCIAL<svg width="150" height="20" viewBox="0 0 150 20"><path d="M2 10 C 40 6, 90 11, 146 6" stroke="#D25A44" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></div>
        <svg class="arr" width="80" height="40" viewBox="0 0 80 40"><path d="M6 6 C 20 30, 44 34, 70 26" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round"/><path d="M60 19 L72 26 L61 33" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="new">STUDYING</div></div>
      <div class="r"><span>LOCK-INS</span><b>2 × 25 MIN</b></div>
      <div class="win"><span>YOU WIN BACK</span><b>50 MIN / DAY</b></div></div>
      <div class="stub"><div class="t"><small>WEEKDAYS AT</small><b>4:00 PM</b></div><div class="cant">Can’t do 4:00?</div></div></div>`],
  ["2  FROM YOUR CALENDAR", chrome(13, "WHEN IT FITS", "When will you<br>be free?", "LOCK IN AT 5:30", "Pick another time") + `
    <div class="sub" style="top:262px">Times your calendar is clear. Tap one.</div>
    <div class="sugg">
      <div class="sg on"><b>5:30 PM</b><span>Free Mon–Fri</span></div>
      <div class="sg"><b>8:00 PM</b><span>Free 4 days</span></div>
      <div class="sg"><b>9:30 PM</b><span>Free 3 days</span></div></div>
    <div class="cal" style="top:384px">${["MON", "TUE", "WED", "THU", "FRI"].map((d, i) => `<div class="strip"><small>${d}</small><div class="line">
      ${busy[i].map(([a, b]) => `<i class="busy" style="left:${x(a)}%;width:${x(b) - x(a)}%"></i>`).join("")}
      <i class="free" style="left:${x(17.5)}%;width:${x(18.5) - x(17.5)}%"></i></div></div>`).join("")}
      <div class="ticks"><span>3PM</span><span>5PM</span><span>7PM</span><span>9PM</span><span>11PM</span></div></div>
    <div class="foot2" style="top:670px"><div class="k"><span><i style="background:repeating-linear-gradient(-45deg,rgba(27,27,27,.3) 0 2px,transparent 2px 5px);border:1.5px solid rgba(27,27,27,.3)"></i>BUSY</span><span><i style="background:#3255A4;border:1.5px solid #1B1B1B"></i>YOUR LOCK-IN</span></div></div>`],
  ["3  NO CALENDAR: PICK", chrome(13, "WHEN IT FITS", "When works<br>for you?", "SET 5:30 PM", "") + `
    <div class="big"><div class="pm">−</div><b>5:30<span>PM</span></b><div class="pm">+</div></div>
    <div class="days">${["M", "T", "W", "T", "F", "S", "S"].map((d, i) => `<span class="${i < 5 ? "on" : ""}">${d}</span>`).join("")}</div>
    <div class="q">AND THEN?</div>
    <div class="two">
      <div class="ch"><div class="ic">${bell}</div><b>Remind me</b><span>A nudge at 5:30. You start it.</span></div>
      <div class="ch on"><span class="plus">PLUS</span><div class="ic">${lock("#1B1B1B")}</div><b>Lock by itself</b><span>Your apps lock at 5:30, every week.</span></div>
    </div>`],
];
const row = document.getElementById("row");
phones.forEach(([l, h]) => { const w = document.createElement("div"); w.innerHTML = `<div class="lab">${l}</div><div class="phone">${h}</div>`; row.appendChild(w); });
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.ready = true; });
window.render = () => {};
</script>
</body>
</html>
