<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock In Plus slide colors and wording</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "SF Pro Rounded", "Nunito", system-ui, sans-serif; background: #d9d9de; padding: 22px; }
  h2 { font: 800 22px system-ui; color: #1c1d21; margin-bottom: 4px; }
  .sub { font: 600 15px system-ui; color: #555a63; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 306px); gap: 18px 16px; }
  .cell h4 { font: 800 14px system-ui; color: #2a2d33; margin: 0 0 6px 6px; }
  .wrap { zoom: .78; width: 393px; height: 852px; }
  .phone { width: 393px; height: 852px; border-radius: 52px; overflow: hidden; position: relative; color: var(--tx); background: var(--bg); }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); opacity: var(--bo); }
  .vig { position: absolute; inset: 0; background: var(--vig); }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .sb { position: absolute; top: 18px; left: 34px; font-weight: 600; font-size: 16px; }
  .skip { position: absolute; top: 66px; right: 24px; font-weight: 600; font-size: 15px; color: var(--soft); }
  .chipw { position: absolute; top: 118px; width: 100%; text-align: center; }
  .chip { display: inline-block; padding: 4px 12px; border-radius: 11px; font: 800 11px system-ui; letter-spacing: 2px; color: var(--chipt); background: var(--grad); }
  .title { position: absolute; left: 24px; right: 24px; top: 154px; text-align: center; font-weight: 800; font-size: 34px; letter-spacing: -.5px; line-height: 1.08; }
  .line { position: absolute; left: 36px; right: 36px; top: 244px; text-align: center; font-weight: 500; font-size: 17px; color: var(--soft2); line-height: 1.3; }
  .card { position: absolute; left: 24px; right: 24px; top: 300px; background: var(--card); border-radius: 22px; padding: 6px 16px; box-shadow: var(--cardsh); }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--hair); font-weight: 700; font-size: 17px; }
  .row:first-child { border-top: 0; }
  .ic { width: 36px; height: 36px; border-radius: 11px; background: var(--grad); flex: none; display: grid; place-items: center; color: var(--chipt); font-weight: 800; font-size: 15px; }
  .row small { display: block; font-weight: 500; font-size: 13px; color: var(--soft); margin-top: 2px; }
  .tl { position: absolute; left: 24px; right: 24px; bottom: 190px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--soft); }
  .tl div { text-align: center; flex: 1; } .tl b { display: block; color: var(--tx); font-size: 13px; }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 116px; height: 60px; border-radius: 22px; display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: 2px; background: var(--btn); color: var(--btnt); box-shadow: var(--btnsh); }
  .price { position: absolute; left: 24px; right: 24px; bottom: 72px; text-align: center; font-size: 12px; line-height: 1.25; color: var(--soft); font-weight: 600; }
  .link { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; font-weight: 600; font-size: 15px; color: var(--soft2); }

  .ice { --bg: linear-gradient(180deg,#121417,#0A0B0D 60%,#08090A); --tx:#F3F5F8; --soft:#8E97A3; --soft2:#A5ADB8; --card:#0B0C0E; --cardsh: inset 0 0 0 1px rgba(255,255,255,.07); --hair:#1B1F24; --grad: linear-gradient(180deg,#B5DCFC,#4C8EE0); --chipt:#0E1218; --btn: linear-gradient(180deg,#F4F6F9,#D5DBE2); --btnt:#0E1218; --btnsh: 0 8px 12px rgba(0,0,0,.6); --bo:.8; --vig: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .vio { --bg: linear-gradient(180deg,#0F0D18,#09080F 60%,#07060B); --tx:#F4F2FB; --soft:#9B95B3; --soft2:#B1ABC8; --card:#0C0A14; --cardsh: inset 0 0 0 1px rgba(170,140,255,.14); --hair:#1D1930; --grad: linear-gradient(180deg,#CDBBFF,#7A5CF0); --chipt:#120C2A; --btn: linear-gradient(180deg,#CDBBFF,#8E72F5); --btnt:#120C2A; --btnsh: 0 10px 24px rgba(120,90,240,.45); --bo:.85; --vig: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); }
  .emr { --bg: linear-gradient(180deg,#0B1412,#070C0B 60%,#060908); --tx:#EFF8F5; --soft:#86A39B; --soft2:#9DBAB2; --card:#08100E; --cardsh: inset 0 0 0 1px rgba(110,230,190,.14); --hair:#142420; --grad: linear-gradient(180deg,#A8F5D6,#2BB98A); --chipt:#06231A; --btn: linear-gradient(180deg,#A8F5D6,#35C493); --btnt:#06231A; --btnsh: 0 10px 24px rgba(40,190,140,.4); --bo:.8; --vig: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); }
  .gld { --bg: linear-gradient(180deg,#14120D,#0B0A07 60%,#080705); --tx:#F8F4EA; --soft:#A39A84; --soft2:#BDB39B; --card:#0D0B08; --cardsh: inset 0 0 0 1px rgba(240,200,120,.16); --hair:#241F14; --grad: linear-gradient(180deg,#F6DCA0,#D4A24A); --chipt:#2A1E08; --btn: linear-gradient(180deg,#F6DCA0,#D9A94F); --btnt:#2A1E08; --btnsh: 0 10px 24px rgba(210,160,70,.4); --bo:.75; --vig: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.5) 100%); }
  .plt { --bg: linear-gradient(180deg,#F3F6FA,#E3E9F0); --tx:#18222E; --soft:#5E6D7E; --soft2:#46566A; --card:#FFFFFF; --cardsh: 0 10px 24px rgba(30,50,80,.12), inset 0 0 0 1px #DDE5EC; --hair:#E6ECF2; --grad: linear-gradient(180deg,#7CC4F8,#3F7FE0); --chipt:#FFFFFF; --btn: linear-gradient(180deg,#2B3340,#151A22); --btnt:#EAF2FF; --btnsh: 0 10px 20px rgba(20,30,50,.35); --bo:.55; --vig: none; }
  .spl { --bg: linear-gradient(180deg,#0F1115,#08090B 55%,#0A0712); --tx:#F3F5F8; --soft:#8E97A3; --soft2:#A5ADB8; --card:#0B0C0E; --cardsh: inset 0 0 0 1px rgba(255,255,255,.07); --hair:#1B1F24; --grad: linear-gradient(135deg,#9FD0FF,#9B7BFF 60%,#F0C27A); --chipt:#0E1218; --btn: linear-gradient(135deg,#B8DBFF,#A98BFF 65%,#F2CB8A); --btnt:#0E1218; --btnsh: 0 10px 24px rgba(140,120,255,.4); --bo:.8; --vig: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
</style>
</head>
<body>
<h2>Plus slide: six color ideas, six ways to say it</h2>
<div class="sub">Same four benefits. Different color, headline and button words. Price is a placeholder.</div>
<div class="grid" id="g"></div>
<script>
const rows = [['PC workspaces', 'Opens your work in one tap', 'W'], ['Lock PC if you quit early', 'A real cost for leaving', 'L'], ['Lock screen countdown', 'See time left without opening', 'C'], ['History and weekly report', 'Your real minutes and streak', 'H']];
const blobs = {
  ice: ['#3A7BD8', '#6A4FD6', '#229BA6'], vio: ['#6A4FD6', '#A04FD0', '#3A5BD8'], emr: ['#1F9E78', '#2BB1B8', '#3A7BD8'],
  gld: ['#B8842C', '#8A4A2A', '#6A5A2A'], plt: ['#9CC8F5', '#C9B8F5', '#A8E6D8'], spl: ['#3A7BD8', '#8A5FE0', '#D9A85A']
};
function cell(k, name, headline, line, btn, small) {
  const b = blobs[k];
  return `<div class="cell"><h4>${name}</h4><div class="wrap"><div class="phone ${k}">
  <div class="blob" style="width:340px;height:340px;left:-80px;top:80px;background:${b[0]}"></div>
  <div class="blob" style="width:320px;height:320px;right:-110px;top:330px;background:${b[1]}"></div>
  <div class="blob" style="width:360px;height:300px;left:10px;bottom:-80px;background:${b[2]}"></div><div class="vig"></div>
  <div class="island"></div><div class="sb">9:41</div><div class="skip">Skip</div>
  <div class="chipw"><span class="chip">LOCK IN PLUS</span></div>
  <div class="title">${headline}</div><div class="line">${line}</div>
  <div class="card">${rows.map(r => `<div class="row"><div class="ic">${r[2]}</div><div>${r[0]}<small>${r[1]}</small></div></div>`).join('')}</div>
  <div class="tl"><div><b>Today</b>Free</div><div><b>Day 5</b>Reminder</div><div><b>Day 7</b>First charge</div></div>
  <div class="btn">${btn}</div><div class="price">${small}</div><div class="link">Not now</div></div></div></div>`;
}
const small = '7 days free, then $XX.XX a year. Cancel any time in iOS Settings.';
document.getElementById('g').innerHTML = [
  cell('ice', 'A. Ice (matches the app)', 'Go further<br>with Plus.', 'Free stays free. Plus adds your PC.', 'START 7 DAYS FREE', small),
  cell('vio', 'B. Violet glow', 'Your PC, ready<br>when you are.', 'Open your work in one tap.', 'TRY PLUS FREE', small),
  cell('emr', 'C. Emerald', 'Make quitting<br>cost something.', 'Lock your PC if you quit early.', 'CONTINUE', small),
  cell('gld', 'D. Gold on black', 'Focus on<br>two screens.', 'Phone and PC, locked in together.', 'START 7 DAYS FREE', small),
  cell('plt', 'E. Platinum (light page)', 'Plus is for<br>your whole desk.', 'Everything free, plus the PC.', 'TRY PLUS FREE', small),
  cell('spl', 'F. Blue to violet to gold', 'Do more of<br>your best work.', 'See your real minutes. Lock your PC.', 'CONTINUE', small),
].join('');
</script>
</body>
</html>
