<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock In welcome slides matte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "SF Pro Rounded", "Nunito", system-ui, sans-serif; background: #d9d9de; padding: 22px; }
  h2 { font: 800 22px system-ui; color: #1c1d21; margin-bottom: 4px; }
  .sub { font: 600 15px system-ui; color: #555a63; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(3, 306px); gap: 18px 16px; }
  .cell h4 { font: 800 14px system-ui; color: #2a2d33; margin: 0 0 6px 6px; }
  .wrap { zoom: .78; width: 393px; height: 852px; }
  .phone { width: 393px; height: 852px; border-radius: 52px; overflow: hidden; position: relative; background: linear-gradient(180deg,#121417,#0A0B0D 60%,#08090A); color: #F3F5F8; }
  .blob { position: absolute; border-radius: 50%; filter: blur(55px); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .island { position: absolute; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 20px; background: #000; }
  .sb { position: absolute; top: 18px; left: 34px; font-weight: 600; font-size: 16px; }
  .skip { position: absolute; top: 66px; right: 24px; font-weight: 600; font-size: 15px; color: #8E97A3; }
  .vis { position: absolute; left: 0; right: 0; top: 130px; height: 330px; display: grid; place-items: center; }
  .title { position: absolute; left: 24px; right: 24px; top: 490px; text-align: center; font-weight: 800; font-size: 34px; letter-spacing: -.5px; }
  .line { position: absolute; left: 36px; right: 36px; top: 540px; text-align: center; font-weight: 500; font-size: 17px; color: #A5ADB8; line-height: 1.3; }
  .fact { position: absolute; left: 24px; right: 24px; top: 610px; background: #0B0C0E; border-radius: 18px; padding: 14px 16px; text-align: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .fact b { color: #8CC4FF; font-weight: 700; }
  .fact p { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .fact small { display: block; margin-top: 6px; font-size: 12px; color: #8E97A3; }
  .dots { position: absolute; left: 0; right: 0; bottom: 118px; display: flex; justify-content: center; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 4px; background: #2B2F35; }
  .dots i.on { width: 22px; background: #6AAEF0; }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 34px; height: 60px; border-radius: 22px; display: grid; place-items: center; font-weight: 800; font-size: 16px; letter-spacing: 2px; background: linear-gradient(180deg,#F4F6F9,#D5DBE2); color: #0E1218; box-shadow: 0 8px 12px rgba(0,0,0,.6); }
  .link { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-weight: 600; font-size: 15px; color: #C3CAD3; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 10px; font: 800 10px system-ui; letter-spacing: 1.5px; color: #0E1218; background: linear-gradient(180deg,#B5DCFC,#6AAEF0); }
  /* visuals */
  .ring { width: 250px; height: 250px; position: relative; }
  .ring .bz { position: absolute; inset: 4px; border-radius: 50%; background: conic-gradient(from 210deg,#2B2F35,#101215,#23272C,#0D0F11,#2A2E34,#2B2F35); box-shadow: 0 20px 24px rgba(0,0,0,.7); }
  .ring .fc { position: absolute; inset: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 25%,#1D2025,#121417 55%,#0C0D0F); }
  .ring svg { position: absolute; inset: 0; }
  .ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; font-size: 52px; }
  .tile { position: absolute; width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(180deg,#2E3238,#1F2227); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 6px 10px rgba(0,0,0,.6); display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #C3CAD3; }
  .tile i { position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%; background: #6AAEF0; box-shadow: 0 0 8px #6AAEF0; }
  .disc { width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle at 35% 25%,#23272C,#101215); box-shadow: 0 18px 24px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08); display: grid; place-items: center; }
  .card { width: 300px; background: #0B0C0E; border-radius: 22px; padding: 10px 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 14px 24px rgba(0,0,0,.6); }
  .card .hd { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 10px; font: 800 11px system-ui; letter-spacing: 2px; color: #8E97A3; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid #1B1F24; font-weight: 700; font-size: 17px; }
  .row .ic { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(180deg,#B5DCFC,#4C8EE0); flex: none; display: grid; place-items: center; color: #0E1218; font-weight: 800; font-size: 15px; }
  .row .ic.d { background: linear-gradient(180deg,#2E3238,#1F2227); color: #8E97A3; }
  .row small { display: block; font-weight: 500; font-size: 13px; color: #8E97A3; margin-top: 2px; }
  .row .ck { margin-left: auto; color: #6AAEF0; font-weight: 800; }
  .cmp { width: 330px; background: #0B0C0E; border-radius: 22px; padding: 8px 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 14px 24px rgba(0,0,0,.6); }
  .cmp .h, .cmp .r { display: grid; grid-template-columns: 1fr 56px 56px; align-items: center; padding: 11px 0; font-weight: 600; font-size: 15px; }
  .cmp .h { font: 800 11px system-ui; letter-spacing: 2px; color: #8E97A3; text-align: center; }
  .cmp .h span:first-child { text-align: left; }
  .cmp .r { border-top: 1px solid #1B1F24; }
  .cmp .r span:not(:first-child) { text-align: center; color: #6AAEF0; font-weight: 800; }
  .cmp .r span.no { color: #3a3f47; }
  .cmp .r.plus span:first-child { color: #fff; }
</style>
</head>
<body>
<h2>Welcome slides, matte black</h2>
<div class="sub">Free app stays open. Slides 1-3 show the app. Slide 4 shows what Plus adds.</div>
<div class="grid" id="g"></div>
<script>
const dots = n => n > 3 ? '' : `<div class="dots">${[0,1,2,3,4].map(i => `<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
const bg = `<div class="blob" style="width:340px;height:340px;left:-80px;top:70px;background:#3A7BD8;opacity:.8"></div>
<div class="blob" style="width:320px;height:320px;right:-110px;top:300px;background:#6A4FD6;opacity:.8"></div>
<div class="blob" style="width:360px;height:300px;left:10px;bottom:-80px;background:#229BA6;opacity:.8"></div><div class="vig"></div>
<div class="island"></div><div class="sb">9:41</div>`;
function phone(inner) { return `<div class="wrap"><div class="phone">${bg}${inner}</div></div>`; }
function cell(t, inner) { return `<div class="cell"><h4>${t}</h4>${phone(inner)}</div>`; }
const fact = (a, b, c, d) => `<div class="fact"><p>${a}<b>${b}</b>${c}</p><small>${d}</small></div>`;

const ringVis = `<div class="ring"><div class="bz"></div><div class="fc"></div>
 <svg viewBox="0 0 250 250"><circle cx="125" cy="125" r="108" fill="none" stroke="#050607" stroke-width="13"/><circle cx="125" cy="125" r="108" fill="none" stroke="#1B1F24" stroke-width="9"/>
 <g transform="rotate(-90 125 125)"><circle cx="125" cy="125" r="108" fill="none" stroke="#6AAEF0" stroke-width="9" stroke-linecap="round" stroke-dasharray="340 679" stroke-dashoffset="-339" /></g></svg><div class="t">45:00</div></div>`;
const shieldVis = `<div style="position:relative;width:300px;height:300px;display:grid;place-items:center">
 <div class="disc"><svg width="70" height="80" viewBox="0 0 70 80"><defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B5DCFC"/><stop offset="1" stop-color="#4C8EE0"/></linearGradient></defs><path d="M35 4 L64 15 V38 C64 56 52 70 35 76 C18 70 6 56 6 38 V15 Z" fill="none" stroke="url(#s)" stroke-width="6" stroke-linejoin="round"/><path d="M35 4 V76 C18 70 6 56 6 38 V15 Z" fill="url(#s)" opacity=".85"/></svg></div>
 <div class="tile" style="left:16px;top:30px">M<i></i></div><div class="tile" style="right:16px;top:60px">R<i></i></div><div class="tile" style="left:36px;bottom:30px">X<i></i></div><div class="tile" style="right:36px;bottom:20px">T<i></i></div></div>`;
const pcVis = `<div class="card"><div class="hd"><span>WORKSPACE</span><span class="chip">PLUS</span></div>
 <div class="row"><div class="ic">N</div>Notes<span class="ck">&#10003;</span></div><div class="row"><div class="ic">P</div>Project<span class="ck">&#10003;</span></div><div class="row"><div class="ic d">M</div>Music<span class="ck" style="color:#3a3f47">&#9675;</span></div></div>`;
const plusRows = [['PC workspaces', 'Opens your work in one tap', 'W'], ['Lock PC if you quit early', 'A real cost for leaving', 'L'], ['Lock screen countdown', 'See time left without opening', 'C'], ['History and weekly report', 'Your real minutes and streak', 'H']];
const plusVis = `<div class="card" style="width:340px"><div class="hd"><span>LOCK IN</span><span class="chip">PLUS</span></div>${plusRows.map(r => `<div class="row"><div class="ic">${r[2]}</div><div>${r[0]}<small>${r[1]}</small></div></div>`).join('')}</div>`;
const cmpRows = [['Phone lock', 1, 1], ['Shield apps', 1, 1], ['Honest receipt', 1, 1], ['PC workspaces', 0, 1], ['Lock PC if you quit', 0, 1], ['Lock screen countdown', 0, 1], ['History and report', 0, 1]];
const cmpVis = `<div class="cmp"><div class="h"><span></span><span>FREE</span><span>PLUS</span></div>${cmpRows.map(r => `<div class="r ${r[1] ? '' : 'plus'}"><span>${r[0]}</span><span class="${r[1] ? '' : 'no'}">${r[1] ? '&#10003;' : '&ndash;'}</span><span>&#10003;</span></div>`).join('')}</div>`;
const lockVis = `<div style="position:relative"><div class="disc" style="width:190px;height:190px"><svg width="80" height="90" viewBox="0 0 80 90"><defs><linearGradient id="s2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B5DCFC"/><stop offset="1" stop-color="#4C8EE0"/></linearGradient></defs><rect x="10" y="40" width="60" height="44" rx="10" fill="url(#s2)"/><path d="M22 40 V28 a18 18 0 0 1 36 0 V40" fill="none" stroke="url(#s2)" stroke-width="7"/></svg></div></div>`;

const slide = (n, vis, title, line, extra, btn, skip = true) => `${skip ? '<div class="skip">Skip</div>' : ''}<div class="vis">${vis}</div><div class="title">${title}</div><div class="line">${line}</div>${extra || ''}${dots(n)}${btn}`;
const next = '<div class="btn">NEXT</div>';
document.getElementById('g').innerHTML = [
  cell('1. Lock in', slide(0, ringVis, 'Lock in.', 'Your phone and your PC focus together.', fact('', '46.9%', ' of the time, minds wander.', 'Harvard, 2,250 adults, 2010 &middot; Source &rsaquo;'), next)),
  cell('2. Shield your apps', slide(1, shieldVis, 'Shield your apps.', 'See what is really on. We never fake it.', fact('Even a notification you ignore ', 'can hurt focus', '.', 'Stothart et al., 2015'), next)),
  cell('3. Your PC gets ready (Plus chip)', slide(2, pcVis, 'Your PC gets ready.', 'One tap opens your work.', fact('Getting back after an interruption often takes ', '20+ minutes', '.', 'UC Irvine workplace study &middot; Source &rsaquo;'), next)),
  cell('4. Go further with Plus (recommended)', slide(3, plusVis, 'Go further with Plus.', 'Free stays free. Plus adds your PC.', '', next)),
  cell('4 alt. Free and Plus side by side', slide(3, cmpVis, 'Free or Plus.', 'Start free. Add Plus any time.', '', next)),
  cell('5. Allow Screen Time', slide(4, lockVis, 'Allow Screen Time.', 'So Lock In can shield your apps.', '', '<div class="btn" style="bottom:92px">ALLOW SCREEN TIME</div><div class="link" style="bottom:48px">Not now</div>', false)),
].join('');
</script>
</body>
</html>
