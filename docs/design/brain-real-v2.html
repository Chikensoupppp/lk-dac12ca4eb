<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brain, more real</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/* A real brain's parts, kept cute. Studied: Twemoji and Microsoft Fluent brain emoji (side-view
   silhouette, long side groove, forked folds, cerebellum under the back, soft 3D shine).
   Same face, colors and sticker edge as the current Lock In brain. */
body{margin:0;background:#E7E8E3;font-family:Nunito,sans-serif;color:#1B1B1B;padding:30px;width:max-content}
h1{font:400 40px Anton,sans-serif;text-transform:uppercase;margin:0 0 18px}
.row{display:flex;gap:22px}
.card{background:#F3F4F0;border-radius:18px;padding:16px 16px 18px;position:relative;width:360px}
.card.pick{box-shadow:0 0 0 4px #3255A4}
.tag{position:absolute;right:14px;top:14px;background:#3255A4;color:#fff;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.1em;padding:4px 8px;border-radius:8px}
h2{font:400 26px Anton,sans-serif;text-transform:uppercase;margin:6px 0 0}
p{font:700 14px/1.3 Nunito;color:#575A55;margin:4px 0 0}
svg{display:block;width:360px;height:300px}
.moods{display:flex;gap:10px;margin-top:22px;background:#F3F4F0;border-radius:18px;padding:14px 16px;width:max-content}
.moods svg{width:170px;height:142px}
.moods div{font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;color:#575A55;text-align:center}
</style></head><body>
<h1>Real brain parts, still cute</h1>
<div class="row" id="row"></div>
<div class="moods" id="moods"></div>
<script>
const INK = '#40162A', CREAM = '#F2ECE1';
let uid = 0;
// Lobes as overlapping puffs: drawn outline-first, then fills, so the union gets one clean outline.
const LOBES = [
  [92, 128, 60, 56], [138, 84, 56, 50], [194, 82, 56, 50], [238, 118, 46, 48],
  [148, 168, 66, 44], [96, 168, 42, 34], [210, 160, 52, 38],
];
const puff = (l, extra = 0) => `<ellipse cx="${l[0]}" cy="${l[1]}" rx="${l[2] + extra}" ry="${l[3] + extra}"/>`;

function groove(d, deep, lite, w = 6.5) {
  return `<path d="${d}" stroke="${deep}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
         `<path d="${d}" transform="translate(-1.5,-2.4)" stroke="${lite}" stroke-width="${w * .35}" fill="none" stroke-linecap="round" opacity=".85"/>`;
}
// Folds: one long side groove (the Sylvian fissure), one top-to-side groove, and short forked ones.
const FOLDS = [
  'M50 140 C 84 122, 124 126, 156 118 C 184 111, 212 116, 240 130',               // side groove
  'M168 38 C 162 58, 172 76, 164 96 C 158 108, 160 114, 158 118',                 // central groove
  'M80 74 C 90 86, 84 98, 94 108 C 98 112, 104 112, 110 106',                     // front folds
  'M88 92 C 80 96, 72 94, 66 100',
  'M118 52 C 112 66, 122 78, 114 92 C 112 98, 116 104, 124 104',
  'M117 72 C 126 70, 132 64, 140 66',
  'M210 44 C 204 58, 214 70, 206 84 C 202 92, 206 98, 214 100',
  'M209 64 C 218 64, 226 58, 234 62',
  'M246 86 C 252 96, 248 108, 258 116',
  'M186 92 C 190 102, 186 108, 194 114',
  'M106 160 C 124 150, 144 156, 160 150 C 172 146, 182 150, 194 146',             // temporal fold
  'M150 153 C 156 160, 154 166, 162 170',
];
function brain({ glossy = true, cere = true, flat = false, eyes = 'open', w = 360, h = 300 } = {}) {
  const id = uid++;
  const BODY = flat ? '#F7A7BC' : '#FF8DAA', DEEP = flat ? '#E05A82' : '#D9507C', LITE = '#FFC6D5';
  let s = `<svg viewBox="0 0 300 250" width="${w}" height="${h}"><defs>
    <radialGradient id="b${id}" gradientUnits="userSpaceOnUse" cx="110" cy="70" r="230"><stop offset="0" stop-color="#FFB3C9"/><stop offset=".55" stop-color="${BODY}"/><stop offset="1" stop-color="#E8678F"/></radialGradient>
    <radialGradient id="cb${id}" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#F98AA8"/><stop offset="1" stop-color="#D45A80"/></radialGradient>
    <clipPath id="c${id}">${LOBES.map(l => puff(l)).join('')}</clipPath></defs>`;
  // sparkles
  const sp = (x, y, k) => `<path d="M${x} ${y - k} L${x + k * .28} ${y - k * .28} L${x + k} ${y} L${x + k * .28} ${y + k * .28} L${x} ${y + k} L${x - k * .28} ${y + k * .28} L${x - k} ${y} L${x - k * .28} ${y - k * .28} Z" fill="#FFC440"/>`;
  s += sp(30, 40, 11) + sp(276, 52, 8) + sp(274, 220, 6);
  // cerebellum: the ribbed bump under the back, behind the rest
  if (cere) {
    s += `<ellipse cx="228" cy="196" rx="44" ry="30" fill="${CREAM}" stroke="${CREAM}" stroke-width="22"/>`;
    s += `<ellipse cx="228" cy="196" rx="44" ry="30" fill="${flat ? '#E888A2' : `url(#cb${id})`}" stroke="${INK}" stroke-width="6.5"/>`;
    s += [0, 1, 2, 3].map(i => `<path d="M${200 + i * 3} ${184 + i * 8} q14 ${4 - i} 28 0 t28 ${-1 - i}" stroke="#B8456B" stroke-width="3.6" fill="none" stroke-linecap="round"/>`).join('');
  }
  // sticker edge, outline, fill (union of lobes)
  s += `<g fill="${CREAM}">${LOBES.map(l => puff(l, 11)).join('')}</g>`;
  s += `<g fill="${INK}">${LOBES.map(l => puff(l, 3.3)).join('')}</g>`;
  s += `<g fill="${flat ? BODY : `url(#b${id})`}">${LOBES.map(l => puff(l)).join('')}</g>`;
  s += `<g clip-path="url(#c${id})">`;
  if (!flat) s += `<ellipse cx="150" cy="232" rx="170" ry="40" fill="#C9466F" opacity=".22"/>`; // soft underside shade
  s += FOLDS.map(d => groove(d, DEEP, LITE)).join('');
  if (glossy && !flat) s += `<path d="M64 98 C 80 66, 112 44, 150 40" stroke="#fff" stroke-width="10" stroke-linecap="round" fill="none" opacity=".7"/><circle cx="56" cy="116" r="5.5" fill="#fff" opacity=".7"/><path d="M196 46 C 214 48, 232 58, 242 72" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".45"/>`;
  s += `</g>`;
  // face on the lower front, under the side groove
  const fx = 128, fy = 182;
  if (eyes === 'star') {
    const st = (x, y) => { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 6 : 14; d += `${i ? 'L' : 'M'}${x + Math.cos(a) * r} ${y + Math.sin(a) * r} `; } return `<path d="${d}Z" fill="#FFC440" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`; };
    s += st(fx - 24, fy - 6) + st(fx + 24, fy - 6);
  } else if (eyes === 'keen') {
    s += `<path d="M${fx - 36} ${fy - 30} L${fx - 14} ${fy - 24} M${fx + 14} ${fy - 24} L${fx + 36} ${fy - 30}" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>`;
  }
  if (eyes !== 'star') {
    s += `<ellipse cx="${fx - 24}" cy="${fy - 6}" rx="12" ry="14" fill="${INK}"/><ellipse cx="${fx + 24}" cy="${fy - 6}" rx="12" ry="14" fill="${INK}"/>
      <circle cx="${fx - 28}" cy="${fy - 11}" r="4.6" fill="#fff"/><circle cx="${fx + 20}" cy="${fy - 11}" r="4.6" fill="#fff"/>
      <circle cx="${fx - 20}" cy="${fy - 1}" r="2.2" fill="#fff"/><circle cx="${fx + 28}" cy="${fy - 1}" r="2.2" fill="#fff"/>`;
  }
  s += `<ellipse cx="${fx - 46}" cy="${fy + 12}" rx="13" ry="7" fill="#FF6E8E" opacity=".75"/><ellipse cx="${fx + 46}" cy="${fy + 12}" rx="13" ry="7" fill="#FF6E8E" opacity=".75"/>`;
  s += eyes === 'star'
    ? `<path d="M${fx - 13} ${fy + 8} L${fx + 13} ${fy + 8} C ${fx + 12} ${fy + 26}, ${fx - 12} ${fy + 26}, ${fx - 13} ${fy + 8} Z" fill="${INK}"/><ellipse cx="${fx + 1}" cy="${fy + 19}" rx="6" ry="3.2" fill="#FF7F98"/>`
    : `<path d="M${fx - 9} ${fy + 9} Q${fx} ${fy + 19} ${fx + 9} ${fy + 9} Z" fill="${INK}"/>`;
  return s + `</svg>`;
}
const cards = [
  ['Flat sticker', 'Real brain shape and parts, flat colors like an emoji. Simple, clear on tiny widgets.', { flat: true, glossy: false }],
  ['Glossy', 'Same parts with soft 3D light and a wet shine. Squishy and premium.', {}, true],
  ['Glossy, no back bump', 'Cleaner outline. Loses the cerebellum, the most "real brain" detail.', { cere: false }],
];
document.getElementById('row').innerHTML = cards.map(([h, p, o, pick]) =>
  `<div class="card ${pick ? 'pick' : ''}">${pick ? '<div class="tag">MY PICK</div>' : ''}${brain(o)}<h2>${h}</h2><p>${p}</p></div>`).join('');
document.getElementById('moods').innerHTML = [['open', 'TALKING'], ['keen', 'KEEN'], ['star', 'CHEERING']]
  .map(([e, n]) => `<div>${brain({ eyes: e, w: 170, h: 142 })}${n}</div>`).join('') +
  `<div style="align-self:center;text-align:left;max-width:200px;font:700 14px/1.3 Nunito;letter-spacing:0;color:#575A55">The pick, in the coach poses from the walkthrough.</div>`;
</script>
</body></html>
