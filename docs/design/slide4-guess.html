<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 4 loading v3</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* Slide 4 while Apple's report loads: not blank. The guess tab from slide 2 is taped up, the brain
     checks it with a magnifying glass, and the week's bars rise one day at a time with a "?" on top.
     When the report is ready it covers this with the real number. Deterministic render(t). */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --red:#D25A44; --soft:#45473F; --sheet:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, sans-serif; }
  .row { display: flex; gap: 22px; padding: 22px; width: max-content; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 71px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 87px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  .tag { position: absolute; left: 24px; top: 138px; display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  h1 { position: absolute; left: 24px; right: 24px; top: 158px; font: 400 52px/.95 Anton, sans-serif; color: var(--ink); text-transform: uppercase; }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 86px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page); display: grid; place-items: center; font: 800 19px/1 Inter; letter-spacing: 2px; opacity: .35; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }

  .tab { position: absolute; left: 30px; top: 282px; width: 178px; height: 140px; background: var(--blue); border: 2px solid var(--ink); border-radius: 6px 6px 14px 14px; box-shadow: 0 6px 0 var(--ink);
         color: #fff; transform: rotate(-5deg); padding: 16px 14px; }
  .tab small { font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; opacity: .85; }
  .tab b { display: block; font: 400 40px/1 Anton, sans-serif; margin-top: 10px; }
  .tab span { display: block; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.2px; margin-top: 8px; opacity: .85; }
  .tab::before { content: ""; position: absolute; left: 0; right: 0; top: -2px; height: 10px; background: radial-gradient(circle 5px at 50% 0, var(--page) 4.5px, transparent 5px) 0 0 / 14px 10px repeat-x; }
  .tape { position: absolute; left: 70px; top: 270px; width: 80px; height: 24px; background: rgba(255,181,17,.75); transform: rotate(-12deg); }
  .brain { position: absolute; left: 218px; top: 290px; width: 120px; }
  .glass { position: absolute; left: 196px; top: 326px; width: 74px; height: 74px; }
  .stamp { position: absolute; left: 214px; top: 412px; padding: 6px 10px; border: 3px solid var(--red); border-radius: 8px; color: var(--red); font: 400 20px/1 Anton, sans-serif; letter-spacing: 1px; background: rgba(231,232,227,.9); transform: rotate(8deg); }

  .week { position: absolute; left: 24px; right: 24px; top: 462px; height: 188px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 20px; box-shadow: 0 5px 0 var(--ink); padding: 14px 16px 10px; }
  .week .hd { display: flex; justify-content: space-between; font: 700 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: 1.3px; color: var(--soft); }
  .week .hd em { font-style: normal; color: var(--blue); }
  .cols { display: flex; gap: 10px; align-items: flex-end; height: 112px; margin-top: 12px; border-bottom: 2px solid var(--ink); }
  .col { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .col i { width: 100%; border-radius: 6px 6px 0 0; background: repeating-linear-gradient(-45deg, rgba(50,85,164,.85) 0 4px, rgba(50,85,164,.65) 4px 8px); border: 2px solid var(--ink); border-bottom: 0; transform-origin: 50% 100%; }
  .col b { font: 400 16px/1 Anton, sans-serif; color: var(--blue); margin-bottom: 4px; }
  .days { display: flex; gap: 10px; margin-top: 6px; } .days span { flex: 1; text-align: center; font: 700 10.5px/1 "IBM Plex Mono", monospace; color: var(--soft); }
  .line { position: absolute; left: 24px; right: 24px; top: 668px; font: 400 20px/1.1 "Caveat Brush", cursive; color: var(--ink); text-align: center; }
</style>
</head>
<body>
<div class="row"><div class="phone" id="ph">
  <div class="bars">${""}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="tag"><i></i>YOUR REAL SCREEN TIME</div>
  <h1>Let’s check<br>your guess.</h1>
  <div class="tab"><small>YOU GUESSED</small><b>5–6 HRS</b><span>A DAY</span></div><i class="tape"></i>
  <img class="brain" src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" alt="">
  <svg class="glass" viewBox="0 0 74 74"><circle cx="30" cy="30" r="22" fill="rgba(255,255,255,.35)" stroke="#1B1B1B" stroke-width="6"/><path d="M47 47 L68 68" stroke="#1B1B1B" stroke-width="9" stroke-linecap="round"/></svg>
  <div class="stamp">CHECKING…</div>
  <div class="week"><div class="hd"><span>YOUR WEEK</span><em id="reading">READING MONDAY</em></div>
    <div class="cols" id="cols"></div><div class="days">${""}</div></div>
  <div class="line">Close? Way off? Let’s see…</div>
  <div class="btn">NEXT</div><div class="home"></div>
</div></div>
<script>
const ph = document.getElementById("ph");
ph.querySelector(".bars").innerHTML = Array.from({ length: 13 }, (_, i) => `<i class="${i < 4 ? "on" : ""}"></i>`).join("");
const L = ["M", "T", "W", "T", "F", "S", "S"], H = [62, 48, 70, 55, 80, 92, 74];
document.getElementById("cols").innerHTML = H.map(h => `<div class="col"><b>?</b><i style="height:${h}%"></i></div>`).join("");
ph.querySelector(".days").innerHTML = L.map(d => `<span>${d}</span>`).join("");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), ease = x => 1 - Math.pow(1 - x, 3);
const N = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"];
window.renderAt = t => {
  ph.querySelectorAll(".col").forEach((c, i) => { const k = clamp((t - .3 - i * .32) / .4);
    c.querySelector("i").style.transform = `scaleY(${ease(k)})`; c.querySelector("b").style.opacity = k; });
  document.getElementById("reading").textContent = t > 2.7 ? "ALMOST THERE" : "READING " + N[Math.min(6, Math.floor(t / .38))];
  ph.querySelector(".glass").style.transform = `translate(${Math.sin(t * 2.4) * 16}px, ${Math.cos(t * 3.1) * 8}px)`;
  ph.querySelector(".brain").style.transform = `rotate(${Math.sin(t * 2) * 5}deg)`;
  ph.querySelector(".stamp").style.transform = `rotate(8deg) scale(${1 + .04 * Math.sin(t * 5)})`;
};
window.render = () => window.renderAt(2.2);
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.render(); window.ready = true; });
</script>
</body>
</html>
