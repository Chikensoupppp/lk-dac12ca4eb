<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Brain widget</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#0B1A16;--panel:#10241F;--grid:#16332B;--ecg:#4BFF9A;--cream:#F2ECE1;--alarm:#FF3B3B;--warn:#FFC233}
body{background:#1b1a18;font-family:Archivo,system-ui,sans-serif;padding:24px;display:flex;gap:26px;flex-wrap:wrap;width:max-content}
.lab{font:800 19px Archivo;color:#ddd;margin:0 0 8px 6px}.lab span{display:block;font-weight:500;font-size:14px;color:#999}
.phone{width:393px;height:852px;border-radius:52px;overflow:hidden;position:relative;background:linear-gradient(160deg,#3a4a6b,#1d2238 55%,#141622)}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:9}
.sb{position:absolute;top:18px;left:34px;font:600 16px system-ui;color:#fff}
.grid{position:absolute;left:27px;right:27px;top:70px;display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;row-gap:26px}
.app{width:64px;text-align:center}.app i{display:block;width:64px;height:64px;border-radius:15px;opacity:.8}.app b{display:block;height:8px;width:42px;margin:8px auto 0;border-radius:4px;background:#ffffff35}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:96px;border-radius:34px;background:#ffffff26;display:flex;justify-content:space-around;align-items:center}
.dock i{width:62px;height:62px;border-radius:15px;opacity:.85}
.w{border-radius:22px;background:var(--bg);color:var(--cream);position:relative;overflow:hidden;box-shadow:0 10px 30px -10px #0009}
.w .mono{font:800 10px 'JetBrains Mono';letter-spacing:1.5px}
.ww{grid-column:span 2}.wl{grid-column:span 4}
.small{width:150px;height:150px}.med{width:339px;height:150px}.lg{width:339px;height:354px}
.big{font:900 26px/.9 Archivo;font-stretch:62%;text-transform:uppercase}
.bars{display:flex;gap:3px}.bars i{flex:1;height:10px;border-radius:3px;background:#1E3A32}
.wname{display:block;text-align:center;font:500 11px system-ui;color:#fff;margin-top:6px}
.note{font:500 12px/1.35 Archivo;color:#bbb;width:393px;margin-top:10px}
</style></head><body>
<script>
const COL = ['#FF5FA2','#FF7AA6','#EE93A0','#CFA08C','#ADA37A','#8C9670'];
const WORD = ['FRESH','TIRED','DIZZY','FADING','BEGGING','ROTTEN'];
const BODY = 'M70 132c-34-44 10-100 62-84 18-38 84-38 100 0 50-16 90 34 66 78 34 28 16 90-34 90-12 34-66 44-94 16-34 28-96 10-96-28-40-12-44-62-4-72z';
function brainSVG(st, w) {
  const c = COL[st], ink = '#0B1A16', cream = '#F2ECE1', t = 0;
  const droop = [0, 0, 0, 6, 10, 18][st];
  let face = ''; const ex = [150, 214], ey = 150;
  if (st === 0) face += ex.map(x => `<circle cx="${x}" cy="${ey}" r="17" fill="${cream}" stroke="${ink}" stroke-width="5"/><circle cx="${x + 3}" cy="${ey + 2}" r="8" fill="${ink}"/><circle cx="${x + 6}" cy="${ey - 2}" r="3" fill="${cream}"/>`).join('');
  if (st === 1) face += ex.map((x, i) => `<circle cx="${x}" cy="${ey}" r="16" fill="${cream}" stroke="${ink}" stroke-width="5"/><circle cx="${x}" cy="${ey + 3}" r="7" fill="${ink}"/><path d="M${x - 16} ${ey - 26 + (i ? -6 : 6)} L${x + 16} ${ey - 26 + (i ? 6 : -6)}" stroke="${ink}" stroke-width="5" stroke-linecap="round"/>`).join('');
  if (st === 2) face += ex.map(x => `<circle cx="${x}" cy="${ey}" r="17" fill="${cream}" stroke="${ink}" stroke-width="5"/><path d="M${x} ${ey} m-1 0 a2 2 0 0 1 4 0 a5 5 0 0 1 -9 0 a8 8 0 0 1 15 0 a11 11 0 0 1 -20 0" fill="none" stroke="${ink}" stroke-width="3.2"/>`).join('');
  if (st === 3) face += ex.map(x => `<circle cx="${x}" cy="${ey + 4}" r="15" fill="${cream}" stroke="${ink}" stroke-width="5"/><circle cx="${x}" cy="${ey + 9}" r="6" fill="${ink}"/><path d="M${x - 17} ${ey + 2} h34" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M${x - 16} ${ey + 1} a16 16 0 0 1 32 0z" fill="${c}"/>`).join('');
  if (st === 4) face += ex.map((x, i) => `<path d="M${x - 15} ${ey + 2} q15 -14 30 0" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M${x + (i ? 8 : -8)} ${ey + 8} q${i ? 4 : -4} 26 0 38" stroke="#7FD8FF" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>`).join('');
  if (st === 5) face += ex.map(x => `<path d="M${x - 12} ${ey - 12} l24 24 M${x + 12} ${ey - 12} l-24 24" stroke="${ink}" stroke-width="7" stroke-linecap="round"/>`).join('');
  const mx = 182, my = 200;
  face += [
    `<path d="M${mx - 26} ${my - 6} q26 26 52 0" stroke="${ink}" stroke-width="6" fill="${ink}"/><path d="M${mx - 12} ${my + 5} q12 8 24 0" fill="#FF8FB8"/>`,
    `<path d="M${mx - 24} ${my} q8 -8 16 0 t16 0 t16 0" stroke="${ink}" stroke-width="6" fill="none" stroke-linecap="round"/>`,
    `<ellipse cx="${mx}" cy="${my}" rx="11" ry="14" fill="${ink}"/>`,
    `<path d="M${mx - 22} ${my + 2} h44" stroke="${ink}" stroke-width="6" stroke-linecap="round"/>`,
    `<path d="M${mx - 26} ${my + 12} q26 -26 52 0z" fill="${ink}" stroke="${ink}" stroke-width="5" stroke-linejoin="round"/>`,
    `<path d="M${mx - 24} ${my} h48" stroke="${ink}" stroke-width="6" stroke-linecap="round"/><path d="M${mx + 2} ${my} v16 a9 9 0 0 0 18 0 v-16" fill="#FF8FB8" stroke="${ink}" stroke-width="5"/>`
  ][st];
  let extra = '';
  if (st === 1) extra += `<path d="M262 96 q8 14 0 22 q-8 -8 0 -22z" fill="#7FD8FF" stroke="${ink}" stroke-width="3"/>`;
  if (st >= 2) extra += `<g transform="rotate(-24 120 90)"><rect x="92" y="78" width="60" height="22" rx="6" fill="${cream}" stroke="${ink}" stroke-width="4"/><path d="M114 82v14M122 82v14M130 82v14" stroke="${ink}" stroke-width="2.5"/></g>`;
  if (st >= 3) extra += `<path d="M232 60 l-10 22 l14 8 l-12 24" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (st >= 4) extra += `<path d="M86 196 l18 6 l-6 14 l16 10" stroke="${ink}" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="rotate(20 270 170)"><rect x="244" y="160" width="56" height="20" rx="6" fill="${cream}" stroke="${ink}" stroke-width="4"/></g>`;
  if (st === 5) extra += [0, 1, 2].map(i => `<path d="M${130 + i * 50} ${30 - i * 8} q-8 -10 0 -20 q8 -10 0 -20" stroke="#8C9670" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/>`).join('') + `<circle cx="300" cy="80" r="5" fill="${cream}"/><circle cx="70" cy="230" r="5" fill="${cream}"/>`;
  const h = w * 300 / 364;
  return `<svg viewBox="0 0 364 300" width="${w}" height="${h}" style="overflow:visible;display:block">
   <defs><pattern id="d${st}" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="2.7" fill="${c}"/></pattern></defs>
   <g transform="translate(0 ${droop}) rotate(${droop * .4} 182 150)">
    <path d="${BODY}" fill="${c}" opacity=".35" transform="translate(7 6)"/>
    <path d="${BODY}" fill="url(#d${st})"/>
    <path d="${BODY}" fill="none" stroke="${cream}" stroke-width="8" stroke-linejoin="round"/>
    <path d="M132 50c-6 26 10 42 32 48M232 50c6 26-10 42-32 48M100 176c22-10 44 0 54 16M264 168c-16-6-38 4-44 20" stroke="${cream}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>
    ${extra}${face}
    <path d="M182 268 v26" stroke="${cream}" stroke-width="12" stroke-linecap="round"/>
   </g></svg>`;
}
// tiny static heart trace for the medium widget
function ecg(st, w) {
  // The widget never flatlines: at 7h+ the beat is weak, slow and uneven, but still there.
  const mid = 16, amp = [12, 12, 11, 10, 0, 5][st], period = 40 * 72 / ([72, 98, 126, 154, 188, 38][st]);
  let d = `M0 ${mid}`;
  for (let x = 0; x <= w; x += 2) {
    let y = mid;
    if (st === 4) y = mid + Math.sin(x * .25) * 5 + Math.sin(x * .6) * 3;
    else if (amp) { const n = Math.floor(x / period), ph = (x / period) % 1, a = st === 5 ? amp * (n % 2 ? .6 : 1) : amp; if (ph > .46 && ph < .5) y = mid - a; else if (ph >= .5 && ph < .54) y = mid + a * .45; else if (ph > .64 && ph < .76) y = mid - a * .2; }
    d += ` L${x} ${y.toFixed(1)}`;
  }
  const col = st === 5 ? '#FF3B3B' : '#4BFF9A';
  return `<svg width="${w}" height="32"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" style="filter:drop-shadow(0 0 3px ${col})"/></svg>`;
}
const hrsCol = st => st >= 4 ? 'var(--alarm)' : st === 3 ? 'var(--warn)' : 'var(--ecg)';
function small(st, hrs) {
  return `<div class="w small" style="padding:12px 12px 0">
   <div class="mono" style="color:${hrsCol(st)}">TODAY &middot; ${hrs}</div>
   <div style="position:absolute;left:8px;top:22px">${ecg(st, 134)}</div>
   <div style="position:absolute;left:33px;top:50px">${brainSVG(st, 84)}</div>
   <div class="big" style="position:absolute;left:12px;bottom:10px;font-size:24px">${WORD[st]}</div></div>`;
}
function medium(st, hrs, appLine) {
  const reached = [0, 1, 2, 4, 5, 7][st];
  return `<div class="w med">
   <div style="position:absolute;left:4px;top:12px">${brainSVG(st, 150)}</div>
   <div style="position:absolute;left:160px;right:14px;top:13px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
     <div class="mono" style="color:${hrsCol(st)}">YOUR BRAIN</div>
     <div class="mono" style="color:${hrsCol(st)};font-size:12px">&#9829; ${[72, 98, 126, 154, 188, 38][st]} BPM</div></div>
    <div class="big" style="font-size:40px;margin-top:3px">${WORD[st]}</div>
    <div style="font:700 13px Archivo;font-stretch:88%;margin-top:2px;white-space:nowrap">${hrs === 'Under 1h' ? 'Under 1 hr' : hrs.replace('h+', '+ hrs')} on phone${appLine ? ` <span style="color:#FF8FB8">&middot; 1 app 2h+</span>` : ''}</div>
    <div class="bars" style="margin-top:7px">${[1,2,3,4,5,6,7].map(h => `<i style="${h <= reached ? 'background:' + (h >= 5 ? '#FF3B3B' : h >= 4 ? '#FFC233' : '#4BFF9A') : ''}"></i>`).join('')}</div>
    <div style="margin:2px 0 0 -2px">${ecg(st, 168)}</div>
   </div></div>`;
}
function large(week, today) {
  const days = ['M','T','W','T','F','S','S'];
  return `<div class="w lg" style="padding:16px">
   <div class="mono" style="color:var(--ecg)">YOUR BRAIN &middot; THIS WEEK</div>
   <div style="position:absolute;right:14px;top:8px">${ecg(today, 120)}</div>
   <div style="display:flex;align-items:flex-end;gap:10px;margin-top:6px">
    <div>${brainSVG(today, 150)}</div>
    <div style="padding-bottom:16px"><div class="big" style="font-size:40px">${WORD[today]}</div>
     <div style="font:600 13px/1.3 Archivo;opacity:.75;margin-top:6px;width:150px">3 rough days in a row. It heals on lighter days.</div></div></div>
   <div style="display:flex;justify-content:space-between;margin-top:14px">${week.map((s, i) => `<div style="text-align:center;${s < 0 ? 'opacity:.3' : ''}">${s < 0 ? '<div style="width:42px;height:35px;border:2px dashed #2A4A41;border-radius:12px"></div>' : brainSVG(s, 42)}<div class="mono" style="margin-top:6px;${i === 4 ? 'color:var(--ecg)' : 'opacity:.6'}">${days[i]}</div><div class="mono" style="margin-top:2px;font-size:9px;color:${s < 0 ? 'transparent' : hrsCol(s)}">${['2H','4H','5H','7H+','5H','',''][i] || '&nbsp;'}</div></div>`).join('')}</div>
   <div style="display:flex;gap:8px;margin-top:16px">
    <div style="flex:1;border-radius:12px;background:var(--panel);padding:9px 10px"><div class="mono" style="opacity:.55">WORST DAY</div><div class="big" style="font-size:22px;margin-top:3px;color:#FF8FB8">Thu &middot; 7H+</div></div>
    <div style="flex:1;border-radius:12px;background:var(--panel);padding:9px 10px"><div class="mono" style="opacity:.55">BEST DAY</div><div class="big" style="font-size:22px;margin-top:3px;color:var(--ecg)">Mon &middot; 2H</div></div></div>
   </div>`;
}
const tints = ['#5a6070', '#4b5262', '#606878', '#535a6a'];
const apps = n => Array.from({ length: n }, (_, i) => `<div class="app"><i style="background:${tints[i % 4]}"></i><b></b></div>`).join('');
function home(time, widgets, n = 8) {
  return `<div class="phone"><div class="island"></div><div class="sb">${time}</div>
   <div class="grid">${widgets}${apps(n)}</div>
   <div class="dock">${[0,1,2,3].map(i => `<i style="background:${tints[i]}"></i>`).join('')}</div></div>`;
}
const W = (html, cls, name) => `<div class="${cls}">${html}<span class="wname">${name}</span></div>`;
document.write([
  ['10:12 AM', 'Morning: under 1h. Fresh.', W(medium(0, 'Under 1h', ''), 'wl', 'Lock In')],
  ['1:30 PM', 'Midday: 2h+. Dizzy.', W(medium(2, '2h+', ''), 'wl', 'Lock In')],
  ['4:40 PM', 'Afternoon: 4h+, one app hit 2h. Fading.', W(medium(3, '4h+', 'One app hit 2h today'), 'wl', 'Lock In')],
  ['11:58 PM', 'Night: 7h+. Rotten.', W(medium(5, '7h+', 'One app hit 3h today'), 'wl', 'Lock In')]
].map(([time, lab, w]) => `<div><div class="lab">${time}<span>${lab}</span></div>${home(time, w, 12)}</div>`).join(''));
</script>
</body></html>
