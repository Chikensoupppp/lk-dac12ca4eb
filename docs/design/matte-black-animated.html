<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock In matte black animated</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Nunito", system-ui, sans-serif; background: #d9d9de; padding: 28px; }
  h2 { font-size: 20px; font-weight: 800; color: #222; margin-bottom: 14px; }
  .phones { display: flex; gap: 24px; }
  .col p { font-size: 14px; font-weight: 700; color: #333; margin: 0 0 8px 6px; }
  .phone { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative; display: flex; flex-direction: column; align-items: center; padding: 60px 26px 38px; color: #EEF1F5;
           background:
             radial-gradient(520px 420px at 12% 0%, rgba(130,160,200,.16), transparent 70%),
             radial-gradient(420px 360px at 100% 100%, rgba(90,120,170,.10), transparent 70%),
             linear-gradient(180deg, #121417 0%, #0A0B0D 60%, #08090A 100%);
           box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .10; mix-blend-mode: overlay; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.45) 100%); }
  .phone > *:not(.grain):not(.vig):not(.blob):not(.dust) { position: relative; z-index: 2; }
  .grain { z-index: 1 !important; } .vig { z-index: 1; }
  .head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .title { font: 800 12px Nunito; letter-spacing: .36em; text-indent: .36em; color: #8E97A3; }
  .pill { display: flex; gap: 10px; align-items: center; font: 800 13px Nunito; padding: 8px 16px; border-radius: 22px; color: #CBD2DB;
          background: linear-gradient(180deg, #1B1E22, #141619); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), inset 0 0 0 1px rgba(255,255,255,.03), 0 4px 10px rgba(0,0,0,.5); }
  .pill i { width: 4px; height: 4px; border-radius: 50%; background: #5BA3EA; box-shadow: 0 0 6px #5BA3EA; }
  .clockwrap { margin: auto 0; position: relative; width: 310px; height: 310px; }
  .clockwrap > svg { position: absolute; inset: 0; width: 310px; height: 310px; overflow: visible; }
  .bezel { position: absolute; inset: 6px; border-radius: 50%;
           background: conic-gradient(from 210deg, #2B2F35, #101215 18%, #23272C 38%, #0D0F11 58%, #2A2E34 78%, #2B2F35);
           box-shadow: 0 26px 50px rgba(0,0,0,.7), 0 2px 0 rgba(255,255,255,.06) inset, 0 0 0 1px rgba(0,0,0,.8); }
  .bezel::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle, rgba(255,255,255,.03) 0 1px, rgba(0,0,0,.05) 1px 2px); mix-blend-mode: overlay; }
  .face { position: absolute; inset: 30px; border-radius: 50%;
          background: radial-gradient(circle at 35% 25%, #1D2025 0%, #121417 55%, #0C0D0F 100%);
          box-shadow: inset 0 10px 24px rgba(0,0,0,.7), inset 0 -2px 0 rgba(255,255,255,.05), 0 0 0 1px rgba(255,255,255,.04); }
  .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .time { font: 700 62px Nunito; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1; color: #F3F5F8; text-shadow: 0 1px 0 rgba(0,0,0,.8); }
  .cap { margin-top: 12px; font: 800 12px Nunito; letter-spacing: .22em; color: #8E97A3; }
  .lab { font: 800 11px Nunito; letter-spacing: .26em; margin-bottom: 10px; text-align: center; color: #7E8794; }
  .sel { display: flex; width: 100%; margin-bottom: 18px; padding: 6px; gap: 4px; border-radius: 20px;
         background: #0B0C0E; box-shadow: inset 0 3px 8px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.04), 0 1px 0 rgba(255,255,255,.05); }
  .sel div { flex: 1; text-align: center; padding: 12px 0; border-radius: 15px; font: 800 17px Nunito; color: #7E8794; }
  .sel div.on { color: #fff; background: linear-gradient(180deg, #2E3238, #1F2227); box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 4px 10px rgba(0,0,0,.6); }
  .btn { width: 100%; text-align: center; padding: 19px 0; border-radius: 22px; font: 800 17px Nunito; letter-spacing: .12em; color: #0E1218;
         background: linear-gradient(180deg, #F4F6F9 0%, #D5DBE2 100%);
         box-shadow: inset 0 1.5px 0 #fff, inset 0 -3px 0 rgba(60,75,95,.28), 0 10px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.5); }
  .btn.quiet { color: #C3CAD3; background: linear-gradient(180deg, #1B1E22, #131518); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 1.5px #2B2F35, 0 6px 14px rgba(0,0,0,.5); }
  .btn.quiet { padding: 19px 0; }

  /* living background */
  .blob { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .55; z-index: 0; will-change: transform; }
  .b1 { width: 260px; height: 260px; left: -60px; top: 40px; background: #2C5FA8; animation: d1 14s ease-in-out infinite alternate; }
  .b2 { width: 240px; height: 240px; right: -70px; top: 360px; background: #4B3FA0; animation: d2 17s ease-in-out infinite alternate; }
  .b3 { width: 280px; height: 280px; left: 30px; bottom: -110px; background: #1F7C86; animation: d3 20s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(120px, 150px) scale(1.25); } }
  @keyframes d2 { to { transform: translate(-130px, -120px) scale(.85); } }
  @keyframes d3 { to { transform: translate(140px, -90px) scale(1.2); } }
  .dust { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #9CC8F5; opacity: 0; z-index: 0; animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 85% { opacity: .35; } 100% { transform: translateY(-420px); opacity: 0; } }
  .ripple { position: absolute; inset: 6px; border-radius: 50%; border: 1px solid rgba(110,170,240,.45); animation: ripple 9s ease-out infinite; }
  @keyframes ripple { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(2.4); opacity: 0; } }
  .glint { position: absolute; inset: 6px; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0 78%, rgba(190,220,255,.55) 90%, transparent 100%);
           -webkit-mask: radial-gradient(circle closest-side, transparent 0 84%, #000 85% 99%, transparent 100%); mask: radial-gradient(circle closest-side, transparent 0 84%, #000 85% 99%, transparent 100%);
           animation: spin 9s linear infinite; mix-blend-mode: screen; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip { animation: tip 2.4s ease-in-out infinite; transform-origin: center; }
  @keyframes tip { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .engr { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font: 800 8px Nunito; letter-spacing: .5em; text-indent: .5em; color: #4A525D; }
  .num { font: 800 9px Nunito; fill: #6D7785; }
  @media (prefers-reduced-motion: reduce) { .blob, .dust, .ripple, .glint, .tip { animation: none; } }
</style>
</head>
<body>
<h2>Matte black: more detail and a living background</h2>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B5DCFC"/><stop offset=".55" stop-color="#6AAEF0"/><stop offset="1" stop-color="#4C8EE0"/></linearGradient>
  <filter id="glowf" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
</defs></svg>
<div class="phones" id="ph"></div>
<script>
function ticks(r, n, base) {
  let out = '';
  for (let i = 0; i < n; i++) {
    const a = i / n * 2 * Math.PI, major = i % 5 === 0;
    const r1 = r, r2 = r - (major ? 9 : 5);
    const x1 = 155 + Math.cos(a) * r1, y1 = 155 + Math.sin(a) * r1, x2 = 155 + Math.cos(a) * r2, y2 = 155 + Math.sin(a) * r2;
    out += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${major ? '#5D6674' : '#323841'}" stroke-width="${major ? 1.6 : 1}"/>`;
  }
  return out;
}
function arc(frac) {
  const r = 134, c = 2 * Math.PI * r;
  const endA = frac * 2 * Math.PI - Math.PI / 2;
  const ex = 155 + Math.cos(endA) * r, ey = 155 + Math.sin(endA) * r;
  return `<g transform="rotate(-90 155 155)"><circle cx="155" cy="155" r="${r}" fill="none" stroke="#050607" stroke-width="16"/>
    <circle cx="155" cy="155" r="${r}" fill="none" stroke="#1B1F24" stroke-width="12"/>
    <circle cx="155" cy="155" r="${r}" fill="none" stroke="#5BA3EA" stroke-opacity=".55" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*frac} ${c}" filter="url(#glowf)"/>
    <circle cx="155" cy="155" r="${r}" fill="none" stroke="url(#ice)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c*frac} ${c}"/></g>
    <circle class="tip" cx="${ex}" cy="${ey}" r="3" fill="#EAF5FF"/>`;
}
function dust() {
  let o = '';
  for (let i = 0; i < 16; i++) {
    const x = Math.round(10 + Math.random() * 370), y = Math.round(500 + Math.random() * 330), d = (9 + Math.random() * 10).toFixed(1), de = (-Math.random() * 14).toFixed(1);
    o += `<i class="dust" style="left:${x}px;top:${y}px;animation-duration:${d}s;animation-delay:${de}s"></i>`;
  }
  return o;
}
function phone(running) {
  const frac = running ? 0.64 : 1;
  return `<div class="col"><p>${running ? 'Running' : 'Ready'}</p>
  <div class="phone">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>${dust()}<svg class="grain" width="390" height="844"><rect width="390" height="844" filter="url(#noise)"/></svg><div class="vig"></div>
    <div class="head"><div class="title">LOCK IN</div>${running ? '' : '<div class="pill"><i></i>52 / 90 min<span style="color:#5D6674">|</span>6 days</div>'}</div>
    <div class="clockwrap"><div class="ripple"></div><div class="ripple" style="animation-delay:3s"></div><div class="ripple" style="animation-delay:6s"></div><div class="bezel"></div><div class="glint"></div><div class="face"></div>
      <svg viewBox="0 0 310 310"><g>${ticks(112, 60)}</g>${arc(frac)}</svg>
      <div class="readout"><div class="time">${running ? '28:51' : '45:00'}</div><div class="cap">${running ? 'ENDS 3:42 PM' : 'READY'}</div></div></div>
    ${running ? '<div style="height:96px"></div>' : '<div style="width:100%"><div class="lab">MINUTES</div><div class="sel"><div>15</div><div>25</div><div class="on">45</div><div>60</div><div>90</div></div></div>'}
    <div class="btn ${running ? 'quiet' : ''}">${running ? 'END SESSION' : 'LOCK IN'}</div>
  </div></div>`;
}
document.getElementById('ph').innerHTML = phone(false) + phone(true);
</script>
</body>
</html>
