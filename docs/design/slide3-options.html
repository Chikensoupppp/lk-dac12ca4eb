<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 3 options</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* Slide 3 ("Allow Screen Time") options. One object per option holds the hidden number.
     A envelope, B Apple-popup preview (Opal-style), C scratch card, D developing polaroid.
     Deterministic render(t). */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --red:#D25A44; --soft:#45473F; --sheet:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, system-ui, sans-serif; }
  .row { display: flex; gap: 22px; padding: 22px; width: max-content; }
  .lab { font: 700 13px/1 "IBM Plex Mono", monospace; color: #3b3b3b; margin: 0 0 8px 6px; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 71px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 87px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  .tag { position: absolute; left: 24px; top: 138px; display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  h1 { position: absolute; left: 24px; right: 24px; top: 158px; font: 400 46px/.96 Anton, Impact, sans-serif; color: var(--ink); text-transform: uppercase; }
  .line { position: absolute; left: 24px; right: 24px; font: 600 14px/1.35 "IBM Plex Mono", monospace; color: var(--ink); }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 86px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page); display: grid; place-items: center; font: 800 19px/1 Inter, sans-serif; letter-spacing: 2px; }
  .not { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 15px/1 Inter, sans-serif; color: rgba(27,27,27,.65); }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
  .brain { position: absolute; }
  .hand { font: 400 22px/1.05 "Caveat Brush", cursive; color: var(--ink); position: absolute; }

  /* A: envelope */
  .env { position: absolute; left: 30px; right: 30px; top: 300px; height: 250px; transform-origin: 50% 100%; }
  .env .body { position: absolute; inset: 0; background: var(--sheet); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; }
  .env .flap { position: absolute; left: 0; right: 0; top: 0; height: 130px; }
  .env .win { position: absolute; left: 26px; top: 128px; width: 190px; height: 82px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; display: grid; place-items: center; overflow: hidden; }
  .env .win b { font: 400 40px/1 Anton, sans-serif; color: var(--ink); filter: blur(5px); }
  .env .stampbox { position: absolute; right: 18px; top: 140px; width: 82px; height: 92px; background: var(--blue); border: 3px dashed #fff; outline: 2px solid var(--ink); display: grid; place-items: center; transform: rotate(4deg); }
  .env .stampbox img { width: 64px; }
  .seal { position: absolute; left: 50%; top: 58px; width: 84px; height: 84px; margin-left: -42px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
          display: grid; place-items: center; text-align: center; font: 700 9px/1.2 "IBM Plex Mono", monospace; letter-spacing: 1px; color: var(--ink); }
  .seal::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1.5px dashed var(--ink); }
  .addr { position: absolute; left: 26px; top: 222px; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--soft); }

  /* B: popup preview */
  .alert { position: absolute; left: 50px; right: 50px; top: 316px; background: #F2F2F2; border-radius: 14px; overflow: hidden; border: 2px solid var(--ink); box-shadow: 0 8px 0 var(--ink), 0 30px 40px -18px rgba(0,0,0,.4); transform-origin: 50% 50%; }
  .alert .t { padding: 18px 16px 4px; text-align: center; font: 700 16px/1.25 -apple-system, Inter, sans-serif; }
  .alert .m { padding: 0 16px 16px; text-align: center; font: 500 12.5px/1.3 -apple-system, Inter, sans-serif; color: #333; }
  .alert .b { display: flex; border-top: 1px solid #C8C8C8; }
  .alert .b div { flex: 1; text-align: center; padding: 13px 0; font: 600 16px/1 -apple-system, Inter, sans-serif; color: #0A62D8; }
  .alert .b div + div { border-left: 1px solid #C8C8C8; font-weight: 500; }
  .alert .b .go { position: relative; }
  .ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 52px; margin: -26px 0 0 -60px; border: 3px solid var(--sun); border-radius: 26px; }
  .arrow { position: absolute; }

  /* C: scratch card */
  .tick { position: absolute; left: 28px; right: 28px; top: 300px; height: 270px; background: var(--blue); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); overflow: hidden; color: #fff; transform-origin: 50% 100%; }
  .tick .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.15) 1.4px, transparent 1.5px); background-size: 9px 9px; }
  .tick .hd { position: absolute; left: 20px; top: 18px; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.8px; }
  .tick .hd2 { position: absolute; left: 20px; top: 34px; font: 400 30px/1 Anton, sans-serif; }
  .tick .perf { position: absolute; left: 0; right: 0; top: 78px; border-top: 2.5px dashed rgba(255,255,255,.55); }
  .panel { position: absolute; left: 20px; right: 20px; top: 98px; height: 120px; border-radius: 12px; overflow: hidden; background: #fff; }
  .panel .num { position: absolute; inset: 0; display: grid; place-items: center; font: 400 58px/1 Anton, sans-serif; color: var(--blue); }
  .panel canvas { position: absolute; inset: 0; }
  .tick .foot { position: absolute; left: 20px; bottom: 16px; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; opacity: .85; }
  .coin { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: var(--sun); border: 2px solid var(--ink); box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center; font: 400 26px/1 Anton, sans-serif; color: var(--ink); }

  /* D: polaroid */
  .pol { position: absolute; left: 62px; width: 270px; top: 292px; height: 318px; background: #fff; border: 2px solid var(--ink); border-radius: 6px; box-shadow: 0 6px 0 var(--ink), 0 26px 30px -16px rgba(0,0,0,.35); padding: 16px 16px 0; transform-origin: 50% 0; }
  .pol .ph { position: relative; height: 222px; background: #1B1B1B; overflow: hidden; border: 1.5px solid var(--ink); }
  .pol .ph .chart { position: absolute; left: 22px; right: 22px; bottom: 34px; height: 130px; display: flex; align-items: flex-end; gap: 9px; }
  .pol .ph .chart i { flex: 1; background: var(--blue); border-radius: 4px 4px 0 0; }
  .pol .ph .days { position: absolute; left: 22px; right: 22px; bottom: 12px; display: flex; justify-content: space-between; font: 700 10px/1 "IBM Plex Mono", monospace; color: rgba(255,255,255,.7); }
  .pol .ph .dev { position: absolute; inset: 0; background: linear-gradient(160deg, #3a3626, #1d2233); }
  .pol .cap { font: 400 27px/1 "Caveat Brush", cursive; color: var(--ink); padding: 18px 2px 0; }
  .tape { position: absolute; left: 50%; top: -14px; width: 92px; height: 28px; margin-left: -46px; background: rgba(255,181,17,.75); transform: rotate(-4deg); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const ease = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const BRAIN = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";
const chrome = (title, btn) => `<div class="bars">${Array.from({ length: 13 }, (_, i) => `<i class="${i < 3 ? "on" : ""}"></i>`).join("")}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="tag"><i></i>ALLOW SCREEN TIME</div><h1>${title}</h1>
  <div class="btn">${btn}</div><div class="not">Not now</div><div class="home"></div>`;

const OPTIONS = [
  { name: "A  SEALED ENVELOPE", html: chrome("Your real<br>number is<br>in here.", "OPEN IT") + `
    <div class="env"><div class="body"><svg class="flap" viewBox="0 0 333 130" preserveAspectRatio="none"><path d="M0 0 L166 120 L333 0" fill="#ECEDE8" stroke="#1B1B1B" stroke-width="2"/></svg>
      <div class="win"><b>?H ??M</b></div><div class="stampbox"><img src="${BRAIN}"></div><div class="addr">TO: YOU · FROM: YOUR iPHONE</div></div>
      <div class="seal">ONLY<br>YOU<br>SEE IT</div></div>
    <div class="line" style="top:600px">Opened with Screen Time.<br>It never leaves your iPhone.</div>`,
    draw(el, t) {
      const k = clamp((t - .2) / .6), env = el.querySelector(".env");
      env.style.opacity = k; env.style.transform = `translateY(${(1 - ease(k)) * 80}px) rotate(${-6 + 4 * back(k) + Math.sin(t * 2.4) * (t > 1.4 ? .8 : 0)}deg)`;
      const s = clamp((t - .9) / .3); el.querySelector(".seal").style.transform = `scale(${s > 0 ? 2 - back(s) : 0}) rotate(${-12 + 12 * ease(s)}deg)`;
      el.querySelector(".win b").style.filter = `blur(${5 + Math.sin(t * 3) * 1.2}px)`;
    } },
  { name: "B  POPUP PREVIEW", html: chrome("Your real time,<br>one tap away.", "OK, SHOW ME") + `
    <div class="alert"><div class="t">“SwipeLater” Would Like to Access Screen Time</div>
      <div class="m">Providing “SwipeLater” access to Screen Time may allow it to see your activity data, restrict content, and limit the usage of apps and websites.</div>
      <div class="b"><div class="go">Continue<i class="ring"></i></div><div>Don’t Allow</div></div></div>
    <svg class="arrow" style="left:40px;top:506px" width="120" height="110" viewBox="0 0 120 110"><path class="ap" d="M20 100 C 30 60, 50 40, 92 22" stroke="#1B1B1B" stroke-width="3.5" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/><path class="ah" d="M78 14 L95 21 L84 36" stroke="#1B1B1B" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <img class="brain" src="${BRAIN}" style="left:150px;top:548px;width:96px">
    <div class="hand" style="left:250px;top:578px;width:120px">this one!<br>then your<br>real time</div>
    <div class="line" style="top:664px;text-align:center;font-size:13px">It never leaves your iPhone.</div>`,
    draw(el, t) {
      const k = clamp((t - .2) / .5), a = el.querySelector(".alert");
      a.style.opacity = k; a.style.transform = `scale(${.86 + .14 * back(k)}) rotate(-2deg)`;
      const r = clamp((t - .9) / .4); el.querySelector(".ring").style.transform = `scale(${r > 0 ? .7 + .3 * back(r) + Math.sin(t * 4) * .03 : 0})`;
      const ar = clamp((t - 1.1) / .5); el.querySelector(".ap").style.strokeDashoffset = 1 - ease(ar); el.querySelector(".ah").style.opacity = ar > .8 ? 1 : 0;
      const b = el.querySelector(".brain"); const bk = clamp((t - .5) / .5);
      b.style.opacity = bk; b.style.transform = `translateY(${(1 - ease(bk)) * 40 + Math.sin(t * 2.2) * 3}px) rotate(${Math.sin(t * 1.6) * 4}deg)`;
      el.querySelector(".hand").style.opacity = clamp((t - 1.5) / .3);
    } },
  { name: "C  SCRATCH CARD", html: chrome("Scratch off<br>your real<br>number.", "SCRATCH IT") + `
    <div class="tick"><div class="dots"></div><div class="hd">YOUR DAILY TOTAL</div><div class="hd2">SCREEN TIME</div><div class="perf"></div>
      <div class="panel"><div class="num">?H ??M</div><canvas width="297" height="120"></canvas></div>
      <div class="foot">STAYS ON YOUR iPHONE</div></div>
    <div class="coin" style="left:288px;top:520px">?</div>
    <img class="brain" src="${BRAIN}" style="left:24px;top:598px;width:84px">
    <div class="hand" style="left:112px;top:618px">go on, scratch it</div>`,
    draw(el, t) {
      const k = clamp((t - .2) / .6), tk = el.querySelector(".tick");
      tk.style.opacity = k; tk.style.transform = `translateY(${(1 - ease(k)) * 60}px) rotate(${2 - 2 * ease(k)}deg)`;
      const c = el.querySelector("canvas"), g = c.getContext("2d");
      g.globalCompositeOperation = "source-over"; g.clearRect(0, 0, 297, 120);
      const grd = g.createLinearGradient(0, 0, 297, 120); grd.addColorStop(0, "#BFC1BA"); grd.addColorStop(.5, "#E3E4DF"); grd.addColorStop(1, "#A9ABA4");
      g.fillStyle = grd; g.fillRect(0, 0, 297, 120);
      g.fillStyle = "rgba(27,27,27,.25)"; g.font = "700 11px IBM Plex Mono"; for (let y = 22; y < 120; y += 26) for (let x = 10; x < 297; x += 70) g.fillText("SCRATCH", x + (y % 52 ? 30 : 0), y);
      g.globalCompositeOperation = "destination-out"; g.lineCap = "round"; g.lineWidth = 15;
      const p = clamp((t - 1.2) / 1.6);
      const pts = [[30, 40], [80, 70], [60, 30], [110, 80], [90, 35], [140, 65]];
      g.beginPath(); for (let i = 0; i < pts.length * p; i++) { const [x, y] = pts[i]; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
      const coin = el.querySelector(".coin"); const ci = Math.min(pts.length - 1, Math.floor(pts.length * p));
      if (p > 0) { coin.style.left = `${48 + pts[ci][0] - 10}px`; coin.style.top = `${398 + pts[ci][1] - 10}px`; }
      coin.style.transform = `rotate(${t * 40}deg) scale(${clamp((t - .6) / .3)})`;
      el.querySelector(".brain").style.transform = `translateY(${Math.sin(t * 2.2) * 3}px) rotate(${Math.sin(t * 1.5) * 4}deg)`;
    } },
  { name: "D  DEVELOPING POLAROID", html: chrome("Your week,<br>developing.", "DEVELOP IT") + `
    <div class="pol"><i class="tape"></i><div class="ph"><div class="chart">${[52, 70, 46, 88, 64, 100, 80].map(h => `<i style="height:${h}%"></i>`).join("")}</div>
      <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="dev"></div></div>
      <div class="cap">my week ... ?h a day</div></div>
    <img class="brain" src="${BRAIN}" style="left:284px;top:560px;width:90px">
    <div class="line" style="top:654px">Developed by Screen Time.<br>It never leaves your iPhone.</div>`,
    draw(el, t) {
      const k = clamp((t - .2) / .7), p = el.querySelector(".pol");
      p.style.opacity = k; p.style.transform = `translateY(${(1 - ease(k)) * -70}px) rotate(${-14 + 10 * back(k) + Math.sin(t * 1.8) * (t > 1 ? .6 : 0)}deg)`;
      const d = clamp((t - .9) / 2.2);
      el.querySelector(".dev").style.opacity = 1 - .62 * ease(d);
      el.querySelector(".chart").style.filter = `blur(${9 - 3 * d}px)`;
      el.querySelector(".brain").style.transform = `translateY(${Math.sin(t * 2.2) * 3}px) rotate(${Math.sin(t * 1.5) * 4}deg)`;
    } },
];

const row = document.getElementById("row");
const phones = OPTIONS.map(o => { const w = document.createElement("div"); w.innerHTML = `<div class="lab">${o.name}</div><div class="phone">${o.html}</div>`; row.appendChild(w); return w.querySelector(".phone"); });
window.renderAt = t => OPTIONS.forEach((o, i) => o.draw(phones[i], t));
window.render = () => window.renderAt(3.2);
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.render(); window.ready = true; });
</script>
</body>
</html>
