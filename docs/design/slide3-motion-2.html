<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 3 motion options 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #E7E8E3; --ink: #1B1B1B; --blue: #3255A4; --sun: #FFB511; --red: #D25A44; --card: #F4F4F0; --white: #FBFBF7; }
body { margin: 0; background: #cfd0cb; display: flex; gap: 40px; padding: 40px; font-family: Inter, sans-serif; color: var(--ink); }
.ph { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; background: var(--paper); box-shadow: 0 20px 40px rgba(0,0,0,.18); flex: none; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(27,27,27,.06) 1px, transparent 1.4px); background-size: 7px 7px; }
.blob { position: absolute; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(closest-side, rgba(27,27,27,.055), rgba(27,27,27,0)); }
.chrome { position: absolute; left: 24px; right: 24px; top: 70px; }
.prog { display: flex; gap: 3px; } .prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .prog i.on { background: var(--ink); }
.back { font-size: 26px; margin-top: 12px; height: 30px; }
.tag { display: flex; gap: 7px; align-items: center; font: 700 11px/1 'IBM Plex Mono', monospace; letter-spacing: 1.4px; color: var(--blue); margin-top: 8px; }
.tag b { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
h1 { margin: 10px 0 0; font: 400 48px/.95 Anton, sans-serif; text-transform: uppercase; }
.a { position: absolute; }
.btn { position: absolute; left: 24px; right: 24px; bottom: 72px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--paper); font: 800 19px/60px Inter, sans-serif; letter-spacing: 2px; text-align: center; box-shadow: 0 4px 0 var(--blue); }
.not { position: absolute; left: 0; right: 0; bottom: 32px; text-align: center; font: 600 15px Inter, sans-serif; color: rgba(27,27,27,.65); }
.bubble { position: absolute; background: #fff; border: 2px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); padding: 7px 13px 8px; font: 400 20px/1.05 'Caveat Brush', cursive; white-space: nowrap; }
.bubble span { display: inline-block; }
.brain { position: absolute; width: 108px; height: 92px; object-fit: contain; }
.alert { position: absolute; width: 272px; left: 59px; background: rgba(250,250,247,.97); border-radius: 14px; box-shadow: 0 10px 24px rgba(27,27,27,.16), 0 0 0 1px rgba(27,27,27,.08); text-align: center; overflow: hidden; }
.alert .t { padding: 12px 18px 10px; font: 600 13px/1.25 -apple-system, Inter, sans-serif; }
.alert .r { display: flex; border-top: 1px solid rgba(27,27,27,.14); font: 400 15px/1 -apple-system, Inter, sans-serif; color: #0A7AFF; }
.alert .r div { flex: 1; padding: 11px 0; } .alert .r div:first-child { border-right: 1px solid rgba(27,27,27,.14); } .alert .r div:last-child { font-weight: 600; }
.mono { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
.click { font: 400 18px/1 'Caveat Brush', cursive; color: var(--ink); }
/* G: vault */
.safe { left: 100px; top: 262px; width: 230px; height: 236px; box-sizing: border-box; background: var(--blue); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); perspective: 1400px; }
.inside { position: absolute; inset: 12px; border-radius: 10px; background: radial-gradient(circle at 50% 55%, rgba(255,181,17,.55), rgba(255,181,17,0) 62%), #12203F; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.door { position: absolute; inset: 12px; transform-origin: 0 50%; transform-style: preserve-3d; }
.door .f, .door .bk { position: absolute; inset: 0; border-radius: 10px; border: 3px solid var(--ink); box-sizing: border-box; backface-visibility: hidden; }
.door .f { background: linear-gradient(160deg, #4A72C6, #3255A4); }
.door .bk { background: #233E7C; transform: rotateY(180deg); }
.rivet { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #1B1B1B; opacity: .55; }
.dial { position: absolute; left: 26px; top: 50px; width: 104px; height: 104px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); box-sizing: border-box; }
.dial i { position: absolute; left: 48px; top: 3px; width: 2px; height: 9px; background: var(--ink); transform-origin: 1px 46px; }
.knob { position: absolute; left: 32px; top: 32px; width: 34px; height: 34px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); box-sizing: border-box; }
.handle { position: absolute; left: 144px; top: 84px; width: 40px; height: 40px; }
.handle b { position: absolute; left: 16px; top: -6px; width: 9px; height: 52px; border-radius: 5px; background: var(--ink); }
.handle u { position: absolute; left: -6px; top: 16px; width: 52px; height: 9px; border-radius: 5px; background: var(--ink); }
.handle s { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); box-sizing: border-box; }
.secret { background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; text-align: center; box-shadow: 0 0 30px rgba(255,181,17,.8); }
/* H: scratch ticket */
.ticket { left: 26px; top: 270px; width: 300px; height: 212px; box-sizing: border-box; background: var(--sun); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 6px 0 var(--ink); transform: rotate(-3deg); }
.ticket .zone { position: absolute; left: 22px; top: 62px; width: 250px; height: 120px; border-radius: 12px; background: var(--white); border: 2px solid var(--ink); box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.coin { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F4F1E6, #BDBAB0 60%, #8E8B82); border: 3px solid var(--ink); box-sizing: border-box; font: 400 20px/40px Anton, sans-serif; text-align: center; color: var(--ink); }
.crumb { width: 5px; height: 5px; border-radius: 1px; background: #9C9E98; }
/* I: scale */
.scale { left: 75px; top: 286px; width: 240px; height: 206px; box-sizing: border-box; background: var(--card); border: 3px solid var(--ink); border-radius: 36px; box-shadow: 0 6px 0 var(--ink); transform-origin: 50% 100%; }
.window { position: absolute; left: 27px; top: 16px; width: 180px; height: 96px; box-sizing: border-box; background: var(--white); border: 3px solid var(--ink); border-radius: 90px 90px 14px 14px; overflow: hidden; }
.num { position: absolute; width: 24px; margin-left: -12px; text-align: center; font: 700 12px/1 'IBM Plex Mono', monospace; }
.needle { position: absolute; left: 86px; top: 30px; width: 4px; height: 56px; border-radius: 2px; background: var(--red); transform-origin: 2px 56px; }
.pivot { position: absolute; left: 80px; top: 78px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink); }
.plate { position: absolute; left: 18px; right: 18px; top: 122px; height: 66px; border-radius: 16px; background: repeating-linear-gradient(90deg, rgba(27,27,27,.1) 0 3px, transparent 3px 12px); }
.phone { left: 137px; top: 412px; width: 116px; height: 60px; box-sizing: border-box; border-radius: 14px; background: var(--ink); padding: 6px; }
.phone div { width: 100%; height: 100%; border-radius: 9px; background: linear-gradient(135deg, #3255A4, #23407F); display: flex; align-items: center; justify-content: center; font: 700 9px/1 'IBM Plex Mono', monospace; letter-spacing: 1px; color: var(--sun); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BRAIN = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";
const T = 6;
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t;
  const dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const EO = bez(0.23, 1, 0.32, 1), EIO = bez(0.77, 0, 0.175, 1), DR = bez(0.32, 0.72, 0, 1);
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(10 * p);
const lerp = (a, b, p) => a + (b - a) * p;

function chrome(title, btn) {
  return `<div class="a" style="inset:-80px"><div class="blob" style="left:-40px;top:120px"></div><div class="blob" style="left:180px;top:420px"></div><div class="blob" style="left:40px;top:700px"></div></div><div class="dots"></div>
    <div class="chrome"><div class="prog">${Array.from({length: 13}, (_, i) => `<i class="${i < 3 ? 'on' : ''}"></i>`).join('')}</div>
    <div class="back">‹</div><div class="tag"><b></b>ALLOW SCREEN TIME</div><h1>${title}</h1></div>
    <div class="btn">${btn}</div><div class="not">Not now</div>`;
}
const miniAlert = () => `<div class="alert" style="top:598px"><div class="t">“SwipeLater” Would Like to Access Screen Time</div><div class="r"><div>Don’t Allow</div><div>Continue</div></div></div>
  <svg class="a" width="160" height="56" viewBox="0 0 160 56" style="left:185px;top:640px;overflow:visible"><path data-ring d="M18 30 C 20 10, 140 4, 150 24 C 158 44, 36 54, 14 38 C 6 31, 22 16, 46 14" fill="none" stroke="#D25A44" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/></svg>`;
const bub = (style, a, b) => `<div class="bubble" data-bub style="${style}"><span data-b1>${a}</span><span data-b2 style="position:absolute;left:13px;top:7px">${b}</span></div>`;
const SECRET = `<div class="mono" style="font-size:9.5px;letter-spacing:1.2px;color:#45473F">YOUR TIME A DAY</div><div style="font:400 44px/1 Anton,sans-serif;color:var(--blue);margin-top:4px">?H ??M</div>`;
const SCR = "M18 22 L232 28 L20 50 L234 58 L18 82 L232 90 L22 106";

const phones = [
  `<div class="ph" id="G">${chrome("Your number’s<br>in here.", "OPEN IT")}
    <div class="a safe"><div class="inside"><div class="secret" data-secret>${SECRET}</div></div>
      <div class="door" data-door><div class="f">
        ${[[10, 10], [184, 10], [10, 190], [184, 190]].map(([x, y]) => `<div class="rivet" style="left:${x}px;top:${y}px"></div>`).join('')}
        <div class="a" style="left:73px;top:38px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--sun)"></div>
        <div class="dial" data-dial>${Array.from({length: 24}, (_, i) => `<i style="transform:rotate(${i * 15}deg);height:${i % 6 ? 6 : 11}px"></i>`).join('')}<div class="knob"></div></div>
        <div class="handle" data-handle><b></b><u></u><s></s></div>
      </div><div class="bk"></div></div>
      <div class="a" style="left:-8px;top:40px;width:10px;height:30px;background:var(--ink);border-radius:3px"></div>
      <div class="a" style="left:-8px;top:160px;width:10px;height:30px;background:var(--ink);border-radius:3px"></div>
    </div>
    <div class="a" style="left:124px;top:500px;width:30px;height:10px;background:var(--ink);border-radius:0 0 4px 4px"></div>
    <div class="a" style="left:276px;top:500px;width:30px;height:10px;background:var(--ink);border-radius:0 0 4px 4px"></div>
    ${[0, 1, 2].map(i => `<div class="a click" data-click style="left:${[34, 44, 28][i]}px;top:${[300, 336, 372][i]}px">click</div>`).join('')}
    <img class="brain" data-brain src="${BRAIN}" style="left:2px;top:484px">
    ${bub("left:104px;top:518px", "Click, click…", "Only you have the key.")}
    ${miniAlert()}</div>`,
  `<div class="ph" id="H">${chrome("Scratch<br>to see.", "SCRATCH IT")}
    <div class="a ticket">
      <div class="a" style="left:0;right:0;top:14px;text-align:center;font:400 24px/1 Anton,sans-serif;letter-spacing:1px">SCREEN TIME SCRATCHER</div>
      <div class="a mono" style="left:0;right:0;top:42px;text-align:center;font-size:9.5px;letter-spacing:1.4px">1 TICKET · ONLY YOU CAN SEE IT</div>
      <div class="zone">${SECRET}</div>
      <svg class="a" width="250" height="120" style="left:22px;top:62px">
        <defs>
          <mask id="scr"><rect width="250" height="120" fill="white"/><path data-scr d="${SCR}" stroke="black" stroke-width="36" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1"/></mask>
          <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="8" height="8" fill="#B7B9B3"/><rect width="3" height="8" fill="#C9CBC5"/></pattern>
        </defs>
        <g mask="url(#scr)"><rect width="250" height="120" rx="11" fill="url(#hatch)"/><text x="125" y="68" text-anchor="middle" font-family="Anton" font-size="24" letter-spacing="2" fill="#8F918B">SCRATCH HERE</text></g>
        <g data-coat2><rect width="250" height="120" rx="11" fill="url(#hatch)"/><text x="125" y="68" text-anchor="middle" font-family="Anton" font-size="24" letter-spacing="2" fill="#8F918B">SCRATCH HERE</text></g>
        <path data-scrpath d="${SCR}" fill="none" stroke="none"/>
      </svg>
      ${Array.from({length: 8}, () => `<div class="a crumb" data-crumb></div>`).join('')}
      <div class="a coin" data-coin style="left:0;top:0">¢</div>
    </div>
    <img class="brain" data-brain src="${BRAIN}" style="left:278px;top:470px">
    ${bub("left:24px;top:512px", "Scratch, scratch…", "Real number needs your OK.")}
    ${miniAlert()}</div>`,
  `<div class="ph" id="I">${chrome("Time to<br>weigh in.", "WEIGH IN")}
    <div class="a scale" data-scale>
      <div class="window">
        ${[0, 2, 4, '?', 8, 10, 12].map((n, i) => { const a = (i * 30 - 90) * Math.PI / 180; return `<div class="num" style="left:${(87 + 60 * Math.sin(a)).toFixed(1)}px;top:${(76 - 60 * Math.cos(a)).toFixed(1)}px;${n === '?' ? 'font:400 20px/1 Anton,sans-serif;color:var(--blue);margin-top:-6px' : ''}">${n}</div>`; }).join('')}
        <div class="needle" data-needle></div><div class="pivot"></div>
      </div>
      <div class="plate"></div>
    </div>
    <div class="a phone" data-phone><div>SCREEN TIME</div></div>
    <img class="brain" data-brain src="${BRAIN}" style="left:2px;top:486px">
    ${bub("left:104px;top:520px", "Hop on…", "Heavy? Only you’ll know.")}
    ${miniAlert()}</div>`,
];
document.getElementById('stage').outerHTML = phones.join('');

const $ = (id, sel) => document.querySelector(`#${id} [${sel}]`);
const $$ = (id, sel) => [...document.querySelectorAll(`#${id} ${sel}`)];
function background(id, t) {
  const a = 2 * Math.PI * t / T;
  $$(id, '.blob').forEach((b, i) => { const r = 26 + i * 8, ph = a + i * 2.1; b.style.transform = `translate(${(r * Math.cos(ph)).toFixed(1)}px, ${(r * Math.sin(ph)).toFixed(1)}px)`; });
}
function bubble(id, t, swap, back) {
  const p = seg(t, swap, swap + 0.18) * (1 - seg(t, back, back + 0.18));
  const b1 = $(id, 'data-b1'), b2 = $(id, 'data-b2');
  b1.style.opacity = 1 - p; b1.style.filter = `blur(${(p * 2).toFixed(2)}px)`;
  b2.style.opacity = p; b2.style.filter = `blur(${((1 - p) * 2).toFixed(2)}px)`;
  $(id, 'data-bub').style.width = lerp(b1.offsetWidth, b2.offsetWidth, EIO(p)).toFixed(1) + 'px';
}
function ring(id, t, a) {
  const p = EO(seg(t, a, a + 0.5)) * (1 - seg(t, 5.5, 5.8));
  const r = $(id, 'data-ring'); r.style.strokeDashoffset = (1 - p).toFixed(3); r.style.opacity = seg(t, a, a + 0.05) * (1 - seg(t, 5.5, 5.8));
}
function brain(id, t, hopAt, tilt) {
  const hop = Math.sin(Math.PI * seg(t, hopAt, hopAt + 0.4));
  $(id, 'data-brain').style.transform = `translateY(${(-3 * Math.sin(2 * Math.PI * t / 1.5) - 16 * hop).toFixed(1)}px) rotate(${(tilt + 6 * hop).toFixed(1)}deg)`;
}

function renderG(t) {
  background('G', t);
  // Combination: right, left, right, each stop on a strong ease-in-out, then unwind as the door shuts.
  const close = EIO(seg(t, 5.2, 5.8));
  const rot = (270 * EIO(seg(t, 0.3, 0.8)) - 180 * EIO(seg(t, 0.85, 1.25)) + 90 * EIO(seg(t, 1.3, 1.6))) * (1 - close);
  $('G', 'data-dial').style.transform = `rotate(${rot.toFixed(1)}deg)`;
  $$('G', '[data-click]').forEach((c, i) => {
    const at = [0.8, 1.25, 1.6][i], p = seg(t, at, at + 0.35);
    c.style.opacity = p > 0 && p < 1 ? (1 - p).toFixed(2) : 0;
    c.style.transform = `translateY(${(-10 * EO(p)).toFixed(1)}px) rotate(-8deg)`;
  });
  $('G', 'data-handle').style.transform = `rotate(${(90 * EO(seg(t, 1.7, 1.95)) * (1 - close)).toFixed(1)}deg)`;
  const open = DR(seg(t, 2.0, 2.9)) * (1 - close);
  $('G', 'data-door').style.transform = `rotateY(${(-100 * open).toFixed(2)}deg)`;
  const s = spring(seg(t, 2.45, 3.05)) * (1 - seg(t, 5.2, 5.4));
  const sc = $('G', 'data-secret'); sc.style.opacity = Math.min(1, seg(t, 2.45, 2.6)) * (1 - seg(t, 5.2, 5.4)); sc.style.transform = `scale(${(0.9 + 0.1 * s).toFixed(3)})`;
  brain('G', t, 2.8, -4);
  bubble('G', t, 2.8, 5.5);
  ring('G', t, 3.3);
}

function renderH(t) {
  background('H', t);
  const reset = t > 5.8;
  const p = reset ? 0 : EIO(seg(t, 0.4, 2.6));
  $('H', 'data-scr').style.strokeDashoffset = (1 - p).toFixed(4);
  $('H', 'data-coat2').style.opacity = reset ? 0 : seg(t, 5.3, 5.8).toFixed(3);
  const path = $('H', 'data-scrpath'), L = path.getTotalLength();
  const pt = path.getPointAtLength(L * p);
  const inS = seg(t, 0.15, 0.4), outS = seg(t, 2.6, 2.9);
  const coin = $('H', 'data-coin');
  const cx = 22 + pt.x - 23 + (1 - EO(inS)) * 120 + EO(outS) * 140, cy = 62 + pt.y - 23 - (1 - EO(inS)) * 60 + EO(outS) * 40;
  coin.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) rotate(${(p * 720).toFixed(0)}deg)`;
  coin.style.opacity = (EO(inS) * (1 - outS)).toFixed(2);
  // Silver crumbs fall from the coin while it scratches.
  $$('H', '[data-crumb]').forEach((c, i) => {
    const period = 0.28, age = ((t - 0.4 + i * period / 8 * 3) % period) / period;
    const born = t - age * period;
    const bp = EIO(seg(born, 0.4, 2.6)), bpt = path.getPointAtLength(L * bp);
    const live = born > 0.45 && born < 2.55;
    c.style.opacity = live ? (1 - age).toFixed(2) : 0;
    c.style.transform = `translate(${(22 + bpt.x + (i % 2 ? 1 : -1) * 18 * age).toFixed(1)}px, ${(62 + bpt.y + 10 + 70 * age * age).toFixed(1)}px) rotate(${(age * 200).toFixed(0)}deg)`;
  });
  brain('H', t, 2.7, 6);
  bubble('H', t, 2.75, 5.5);
  ring('H', t, 3.2);
}

function renderI(t) {
  background('I', t);
  // Phone drops onto the scale and lands with a small spring; lifts off to loop.
  const drop = spring(seg(t, 0.3, 0.95)), lift = EIO(seg(t, 5.2, 5.7));
  const ph = $('I', 'data-phone');
  ph.style.transform = `translateY(${(-200 * (1 - drop) - 220 * lift).toFixed(1)}px) rotate(${(-16 * (1 - drop) - 4).toFixed(1)}deg)`;
  ph.style.opacity = (Math.min(1, seg(t, 0.3, 0.4)) * (1 - seg(t, 5.3, 5.6))).toFixed(2);
  const squash = Math.sin(Math.PI * seg(t, 0.55, 0.85));
  $('I', 'data-scale').style.transform = `scale(${(1 + 0.02 * squash).toFixed(3)}, ${(1 - 0.04 * squash).toFixed(3)})`;
  // Needle: damped swing from 0h that settles on "?".
  const q = t - 0.7;
  let ang = q <= 0 ? -90 : -90 * Math.exp(-2.1 * q) * Math.cos(7.5 * q);
  ang = lerp(ang, -90, EIO(seg(t, 5.2, 5.8)));
  $('I', 'data-needle').style.transform = `rotate(${ang.toFixed(1)}deg)`;
  brain('I', t, 2.6, -4);
  bubble('I', t, 2.6, 5.5);
  ring('I', t, 3.0);
}

window.render = t => { t = ((t % T) + T) % T; renderG(t); renderH(t); renderI(t); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!new URLSearchParams(location.search).has('still')) {
  const t0 = performance.now();
  const loop = now => { window.render(reduce ? 3.9 : (now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
document.fonts.ready.then(() => { window.render(0); window.ready = true; });
</script>
</body>
</html>
