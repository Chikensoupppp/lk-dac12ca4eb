<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waking day v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* SwipeLater slide 5 without the heartbeat. Your waking day is 16 hour tiles; the phone hours flip
     blue one by one, each stamped with an app. Then the share of the day, the brain's reaction, and
     one "you are here" finding. Deterministic: render(t).
     Borrowed: Apple Screen Time's hour-by-hour view, Opal's count-up number, a mascot that reacts
     (Duolingo), a calendar's hour grid. */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --soft:#62645E; --card:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, system-ui, sans-serif; }
  .row { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 62px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.16); }
  .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 80px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  h1 { position: absolute; left: 24px; top: 132px; font: 400 50px/.98 Anton, Impact, sans-serif; color: var(--ink); text-transform: uppercase; }
  .lede { position: absolute; left: 24px; right: 30px; top: 245px; font: 700 17px/1.3 Inter, sans-serif; font-stretch: condensed; color: rgba(27,27,27,.82); }

  .card { position: absolute; left: 20px; right: 20px; top: 314px; height: 238px; border-radius: 24px; background: var(--card);
          border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink); }
  .lbl { position: absolute; left: 18px; top: 16px; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.6px; color: var(--soft); }
  .count { position: absolute; left: 18px; top: 34px; font: 400 52px/1 Anton, Impact, sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
  .count em { font: 700 12px/1 "IBM Plex Mono", monospace; font-style: normal; letter-spacing: 1.2px; margin-left: 8px; color: var(--ink); }
  .grid { position: absolute; left: 18px; right: 18px; top: 104px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px; }
  .h { position: relative; aspect-ratio: 1; border-radius: 10px; border: 2px solid rgba(27,27,27,.16); display: grid; place-items: center; }
  .h small { font: 600 9px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.4); }
  .h .f { position: absolute; inset: -2px; border-radius: 10px; background: var(--blue); border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
          display: grid; place-items: center; }
  .h .f svg { width: 16px; height: 16px; }
  .h .f.half { clip-path: inset(0 50% 0 0); }
  .share { position: absolute; left: 18px; right: 18px; top: 198px; font: 700 15px/1.25 Inter, sans-serif; font-stretch: condensed; color: var(--ink); }
  .share b { background: var(--sun); padding: 0 4px; border-radius: 4px; box-decoration-break: clone; }

  .brain { position: absolute; width: 112px; right: 14px; top: 122px; transform-origin: 50% 100%; z-index: 3; }
  .brain img { width: 100%; display: block; }
  .bubble { position: absolute; left: 24px; right: 24px; top: 240px; padding: 9px 14px; border-radius: 18px 4px 18px 18px; background: #fff;
            font: 400 21px/1.05 "Caveat Brush", cursive; color: var(--ink); box-shadow: 0 8px 18px rgba(27,27,27,.14); transform-origin: 85% 0; z-index: 3; }
  .bubble::before { content: ""; position: absolute; right: 52px; top: -10px; border: 6px solid transparent; border-bottom: 6px solid #fff; border-width: 0 8px 11px 8px; }

  .find { position: absolute; left: 20px; right: 20px; top: 586px; padding: 12px 14px 10px; border-radius: 18px; background: #fff;
          box-shadow: 0 10px 24px rgba(27,27,27,.14); }
  .find .you { display: inline-flex; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: #fff; background: var(--blue); padding: 6px 9px; border-radius: 999px; }
  .find p { font: 700 14.5px/1.3 Inter, sans-serif; font-stretch: condensed; color: var(--ink); margin-top: 9px; }
  .find small { display: block; font: 500 10px/1.35 "IBM Plex Mono", monospace; color: var(--soft); margin-top: 7px; }

  .next { position: absolute; left: 24px; right: 24px; bottom: 40px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page);
          display: grid; place-items: center; font: 800 19px/1 Inter, sans-serif; letter-spacing: 2px; font-stretch: condensed; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const BANDS = [
  { title: "1–2 hours<br>a day.", lede: "A little more intentional time can go a long way.", hours: 1.5,
    share: "That’s about <b>1 in every 10</b> waking hours.", say: "Nice! Most of the day is still yours." },
  { title: "3–4 hours<br>a day.", lede: "What would you do with a little of that time back?", hours: 3.5,
    share: "That’s about <b>1 in every 5</b> waking hours.", say: "Hmm. Want some of it back?" },
  { title: "5–6 hours<br>a day.", lede: "That’s a lot of time. How much of it is really yours to choose?", hours: 5.5,
    share: "That’s about <b>1 in every 3</b> waking hours.", say: "A third of your day? Oof." },
  { title: "7+ hours<br>a day.", lede: "You don’t have to change everything today. Start with 25 minutes.", hours: 7.5,
    share: "That’s <b>almost half</b> of your waking hours.", say: "Half your day?! Let’s fix this." },
];
// Which hours (0 = 7 AM ... 15 = 10 PM) the phone takes, spread through the day like real use.
const ORDER = [13, 1, 9, 14, 5, 11, 15, 7, 3, 12];
const FIND = [
  { tag: "1–2H", text: "In a study of 120,000 UK teens, about 1–2 hours a day was not linked to lower well-being.", src: "Przybylski & Weinstein, Psychological Science, 2017" },
  { tag: "3H+", text: "Teens on social media more than 3 hours a day were more likely to report anxiety or depression symptoms.", src: "Riehm et al., JAMA Psychiatry, 2019" },
  { tag: "6H+", text: "In the same study, the link was stronger for teens on social media more than 6 hours a day.", src: "Riehm et al., JAMA Psychiatry, 2019" },
  { tag: "7H+", text: "Teens with 7+ hours of daily screen time were about twice as likely to have been diagnosed with anxiety or depression.", src: "Twenge & Campbell, Preventive Medicine Reports, 2018" },
];
const GLYPHS = [
  '<path d="M7 4.5v11l9-5.5z" fill="#fff"/>',
  '<path d="M4 6.5a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H9l-4 3v-3.2A3 3 0 0 1 4 10.5z" fill="#fff"/>',
  '<path d="M8 15.5a2 2 0 1 1-1.6-2V5.5l8-1.8v9.8a2 2 0 1 1-1.6-2V6.8L8 8z" fill="#fff"/>',
  '<rect x="3.5" y="5" width="13" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M4 6l6 4.5L16 6" fill="none" stroke="#fff" stroke-width="2"/>',
  '<path d="M10 16s-6-3.6-6-8a3.3 3.3 0 0 1 6-1.9A3.3 3.3 0 0 1 16 8c0 4.4-6 8-6 8z" fill="#fff"/>',
  '<rect x="3" y="6" width="14" height="10" rx="2.5" fill="#fff"/><circle cx="10" cy="11" r="2.8" fill="#3255A4"/><rect x="7" y="4" width="6" height="3" rx="1" fill="#fff"/>',
  '<path d="M5 7h10a3 3 0 0 1 3 3v1a3 3 0 0 1-5.2 2H7.2A3 3 0 0 1 2 11v-1a3 3 0 0 1 3-3z" fill="#fff"/>',
  '<path d="M4 5h2l2 8h8l2-6H7" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="16" r="1.4" fill="#fff"/><circle cx="15" cy="16" r="1.4" fill="#fff"/>',
];
const HOUR = i => { const h = 7 + i; return `${((h + 11) % 12) + 1}${h < 12 ? "a" : "p"}`; };
const ease = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

function phoneHTML(b, f) {
  return `<div class="bars">${Array.from({ length: 13 }, (_, i) => `<i class="${i < 5 ? "on" : ""}"></i>`).join("")}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1>${b.title}</h1><div class="lede">${b.lede}</div>
  <div class="card">
    <div class="lbl">YOUR WAKING DAY · 16 HOURS</div>
    <div class="count">0H 00M<em>ON YOUR PHONE</em></div>
    <div class="grid">${Array.from({ length: 16 }, (_, i) => `<div class="h"><small>${HOUR(i)}</small></div>`).join("")}</div>
    <div class="share">${b.share}</div>
  </div>
  <div class="brain"><img src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" alt=""></div>
  <div class="bubble">${b.say}</div>
  <div class="find"><span class="you">YOU ARE HERE · ${f.tag}</span><p>${f.text}</p><small>${f.src}. Links, not cause and effect. Not medical advice.</small></div>
  <div class="next">CONTINUE</div><div class="home"></div>`;
}

function setup(el, band) {
  const b = BANDS[band];
  el.innerHTML = phoneHTML(b, FIND[band]);
  const full = Math.floor(b.hours), half = b.hours % 1 > 0;
  const hs = el.querySelectorAll(".h");
  const tiles = [];
  for (let k = 0; k < full + (half ? 1 : 0); k++) {
    const h = hs[ORDER[k]];
    const f = document.createElement("div");
    f.className = "f" + (half && k === full ? " half" : "");
    f.innerHTML = `<svg viewBox="0 0 20 20">${GLYPHS[k % GLYPHS.length]}</svg>`;
    h.appendChild(f);
    tiles.push(f);
  }
  return { el, b, tiles };
}

// Timeline (seconds): tiles flip in from 0.5, one every 0.26 s; then the share line, the brain's
// line, and the finding.
function drawPhone(p, t) {
  const { el, b, tiles } = p;
  const T0 = 0.5, STEP = 0.26;
  const tEnd = T0 + STEP * tiles.length;
  let shown = 0;
  tiles.forEach((f, k) => {
    const k0 = T0 + STEP * k, x = clamp((t - k0) / 0.34);
    if (t >= k0 + 0.08) shown = k + 1;
    const s = 0.6 + 0.4 * back(x);
    const r = (k % 2 ? 6 : -5) * (1 - x) + (k % 3 - 1) * 2.5;
    f.style.opacity = x;
    f.style.transform = `translateY(${(1 - ease(x)) * -14}px) scale(${x > 0 ? s : 0.6}) rotate(${r}deg)`;
  });
  const mins = Math.min(b.hours * 60, shown * 60 - (shown > Math.floor(b.hours) ? 30 : 0));
  el.querySelector(".count").firstChild.textContent = `${Math.floor(mins / 60)}H ${String(Math.round(mins % 60)).padStart(2, "0")}M`;

  const sh = clamp((t - (tEnd + 0.15)) / 0.4);
  const share = el.querySelector(".share");
  share.style.opacity = sh; share.style.transform = `translateY(${(1 - ease(sh)) * 8}px)`;

  // The brain hops a little each time a tile lands, then reacts once at the end.
  const brain = el.querySelector(".brain");
  const since = Math.min(...tiles.map((_, k) => t - (T0 + STEP * k + 0.08)).filter(v => v >= 0), 9);
  const hop = Math.exp(-since * 8) * Math.sin(since * 22) * 0.08;
  const r0 = clamp((t - (tEnd + 0.3)) / 0.6);
  const react = Math.sin(r0 * Math.PI * 3) * (1 - r0) * 7;
  const idle = Math.sin(t * 2.2) * 2;
  brain.style.transform = `translateY(${idle}px) rotate(${react}deg) scale(${1 + hop}, ${1 - hop})`;

  const bb = clamp((t - (tEnd + 0.35)) / 0.35);
  el.querySelector(".lede").style.opacity = 1 - clamp((t - (tEnd + 0.25)) / 0.2);
  const bubble = el.querySelector(".bubble");
  bubble.style.opacity = bb; bubble.style.transform = `scale(${bb > 0 ? 0.7 + 0.3 * back(bb) : 0.7})`;

  const fd = clamp((t - (tEnd + 1.1)) / 0.45);
  const find = el.querySelector(".find");
  find.style.opacity = fd; find.style.transform = `translateY(${(1 - ease(fd)) * 36}px)`;
}

const row = document.getElementById("row");
const frames = (new URLSearchParams(location.search).get("f") || "2:1.6,2:9,3:9,0:9,1:9").split(",").map(s => s.split(":").map(Number));
const phones = frames.map(([band]) => { const d = document.createElement("div"); d.className = "phone"; row.appendChild(d); return setup(d, band); });
window.render = t => phones.forEach((p, i) => drawPhone(p, t ?? frames[i][1]));
window.renderAt = t => phones.forEach(p => drawPhone(p, t));
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.render(); window.ready = true; });
</script>
</body>
</html>
