<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Study fact</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#EDEBE6;--soft:#9A9DA3;--panel:#181A1E;--edge:#2A2D33;--ice:#9CC9F5;--sage:#8FD3B0;--warm:#F2B27A}
body{background:#cfcfd2;padding:20px;font-family:Onest,system-ui,sans-serif}
.row{display:flex;gap:20px;width:max-content}
.cap{font:700 15px Onest;color:#222;margin:0 0 6px 6px}
.phone{width:393px;height:852px;border-radius:52px;overflow:hidden;position:relative;color:var(--ink);background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%)}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000}
.sb{position:absolute;top:18px;left:34px;font-weight:600;font-size:16px}
.bars{position:absolute;left:26px;right:26px;top:56px;display:flex;gap:3px}
.bars i{flex:1;height:4px;border-radius:2px;background:var(--edge)}.bars i.on{background:var(--ink)}
.hdr{position:absolute;left:12px;right:12px;top:68px;height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;color:#B9BBC0}
.bk{width:44px;height:44px;display:grid;place-items:center}
h1{position:absolute;left:26px;right:26px;top:122px;font:800 36px/1.05 Onest;letter-spacing:-1.4px}
.col{position:absolute;left:26px;right:26px;top:236px;display:flex;flex-direction:column;gap:16px}.card{border-radius:28px;background:var(--panel);border:1.5px solid var(--edge);padding:22px 22px 18px}
.lab{font:700 12px Onest;letter-spacing:2px;color:var(--soft)}
.big{font:800 80px/0.95 Onest;letter-spacing:-3.5px;margin-top:8px}
.unit{font:800 28px Onest;letter-spacing:-1px;margin-top:2px}
.txt{font:500 18px/1.35 Onest;color:#D2D4D9;margin-top:14px}
.src{font:600 14px/1.35 Onest;color:var(--soft);margin-top:14px;padding-top:12px;border-top:1.5px solid var(--edge)}
.note{position:absolute;font-weight:700;font-size:15px;padding:6px 12px;border-radius:12px;color:#0A0B0D;transform:rotate(4deg);right:44px;top:222px;z-index:2}
.help{border-radius:22px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;font:700 17px/1.35 Onest;color:#0A0B0D;}
.help svg{flex:none}
.btn{position:absolute;left:26px;right:26px;bottom:60px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:700;font-size:17px;background:var(--ink);color:#0A0B0D}
.praise .big{font-size:150px;margin-top:0}
</style></head><body>
<div class="row" id="row"></div>
<script>
const lock='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A0B0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const back='<svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="#EDEBE6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>';
const V=[
{cap:'1 to 2 hours',title:'More of your day, on your terms.',accent:'sage',note:'nice work',lab:'YOUR ESTIMATE',big:'1–2',unit:'hours a day',txt:'Your screen time is already on the lighter side. Lock In helps you protect the moments when you want to be fully focused.',src:'',help:'Keep distractions out of the way when it matters. Pick a timer and Lock In.'},
{cap:'3 to 4 hours',title:'Fewer check-ins. More headspace.',accent:'ice',note:'real study',lab:'IN A RESEARCH STUDY',big:'124',unit:'adults',txt:'People who limited email checks to three times a day reported less daily stress than when they checked as often as they wanted.',src:'Kushlev &amp; Dunn, 2015 — Computers in Human Behavior',help:'Lock In blocks your chosen distractions while you focus on what matters.'},
{cap:'5 to 6 hours',title:'Small limits can make a difference.',accent:'warm',note:'real study',lab:'IN A RESEARCH STUDY',big:'143',unit:'students',txt:'Students who limited three social apps to 10 minutes each per day experienced greater reductions in loneliness and depression over three weeks.',src:'Hunt et al., 2018 — Journal of Social and Clinical Psychology',help:'You don’t have to change your whole day. Start with one focused session.'},
{cap:'7 hours or more',title:'Give your evenings a quieter ending.',accent:'warm',note:'real study',lab:'IN A RESEARCH STUDY',big:'844',unit:'adults',txt:'Researchers found that bedtime phone use was linked to poorer sleep and greater fatigue. The study didn’t establish cause and effect.',src:'Exelmans &amp; Van den Bulck, 2016 — Social Science &amp; Medicine',help:'Start small. Choose a time to disconnect, and let Lock In handle the distractions.'}
];
document.getElementById('row').innerHTML=V.map(v=>`<div><div class="cap">${v.cap}</div><div class="phone ${v.praise?'praise':''}"><div class="island"></div><div class="sb">9:41</div>
<div class="bars"><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="hdr"><div class="bk">${back}</div><div>2 of 9</div></div>
<h1>${v.title}</h1>
<div class="note" style="background:var(--${v.accent==='ice'?'sage':v.accent==='sage'?'warm':'sage'})">${v.note}</div>
<div class="col"><div class="card"><div class="lab">${v.lab}</div>
<div class="big" style="color:var(--${v.accent})">${v.big}</div><div class="unit">${v.unit}</div>
<div class="txt">${v.txt}</div>${v.src?`<div class="src">${v.src} <span style="font-weight:800">↗</span></div>`:''}</div>
<div class="help" style="background:var(--${v.accent})">${lock}<span>${v.help}</span></div>
</div><div class="btn">CONTINUE</div></div></div>`).join('');
</script></body></html>
