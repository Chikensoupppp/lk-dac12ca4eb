<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals wording</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@600;800&family=IBM+Plex+Mono:wght@600;700&display=block" rel="stylesheet">
<style>
  /* Slide 11 (goals), now vs new wording that mirrors slide 9 ("What pulls you in?"). Copy of the
     SwiftUI layout; Caveat Brush stands in for Marker Felt. */
  :root { --nb:#F4F5F1; --ink:#1B1B1B; --blue:#3255A4; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, sans-serif; }
  .row { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .lab { font: 700 13px/1 "IBM Plex Mono", monospace; color: #444; margin: 0 0 8px 6px; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--nb); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); padding-top: 59px; }
  .bars { display: flex; gap: 3px; padding: 12px 24px 0; } .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
  .backrow { height: 44px; padding-left: 12px; display: flex; align-items: center; }
  .c { padding: 0 24px; }
  .tag { display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); margin-bottom: 10px; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  h1 { font: 400 52px/.96 Anton, sans-serif; text-transform: uppercase; color: var(--ink); margin-bottom: 16px; }
  .sub { font: 600 14px/1.35 "IBM Plex Mono", monospace; color: var(--ink); margin-bottom: 16px; }
  .it { display: flex; align-items: center; gap: 14px; height: 49px; padding-left: 34px; border-bottom: 2px solid rgba(50,85,164,.2); position: relative; }
  .it::before { content: ""; position: absolute; left: 18px; top: 0; bottom: -2px; width: 2px; background: rgba(210,90,68,.35); }
  .box { width: 28px; height: 28px; border: 3px solid var(--ink); border-radius: 4px; position: relative; }
  .box b { position: absolute; left: 2px; top: -12px; font: 900 30px/1 Inter; color: var(--blue); }
  .it span { font: 400 30px/1 "Caveat Brush", cursive; color: var(--ink); }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 86px; height: 60px; border-radius: 30px; background: var(--ink); color: #E7E8E3; display: grid; place-items: center; font: 800 19px/1 Inter; letter-spacing: 2px; }
  .skip { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 15px/1 Inter; color: rgba(27,27,27,.65); }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const items = ["Studying", "Working out", "Creating something", "Getting more rest", "Reading", "Spending time with people"];
const on = new Set([0, 4]);
const phone = (label, title, sub) => `<div><div class="lab">${label}</div><div class="phone">
  <div class="bars">${Array.from({ length: 13 }, (_, i) => `<i class="${i < 11 ? "on" : ""}"></i>`).join("")}</div>
  <div class="backrow"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="c"><div class="tag"><i></i>WHAT YOU WANT MORE OF</div><h1>${title}</h1><div class="sub">${sub}</div>
  ${items.map((t, i) => `<div class="it"><div class="box">${on.has(i) ? "<b>✓</b>" : ""}</div><span>${t}</span></div>`).join("")}</div>
  <div class="btn">NEXT</div><div class="skip">Skip</div><div class="home"></div></div></div>`;
document.getElementById("row").innerHTML =
  phone("NOW", "What’s worth<br>your time?", "What would you like to make more room for?") +
  phone("NEW", "What do you<br>want more of?", "Tap everything you’d rather spend your time on.");
document.fonts.ready.then(() => { window.ready = true; });
window.render = () => {};
</script>
</body>
</html>
