<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar ask v2</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* v2: show, don't tell. The week as a printed planner page with real event names on it. A
     sunflower highlighter finds the free gaps, blue LOCK-IN stickers stamp into them, Wednesday's
     away game stays empty. One privacy line instead of three icon rows.
     Deterministic render(t). */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --red:#D25A44; --soft:#45473F; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, sans-serif; }
  .row { display: flex; gap: 22px; padding: 22px; width: max-content; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 71px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 87px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  .tag { position: absolute; left: 24px; top: 138px; display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  h1 { position: absolute; left: 24px; right: 24px; top: 158px; font: 400 48px/.95 Anton, sans-serif; color: var(--ink); text-transform: uppercase; }
  .btn { position: absolute; left: 24px; right: 24px; bottom: 86px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page); display: grid; place-items: center; font: 800 19px/1 Inter; letter-spacing: 2px; }
  .sec { position: absolute; left: 0; right: 0; bottom: 44px; text-align: center; font: 600 15px/1 Inter; color: rgba(27,27,27,.7); }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }

  .sheet { position: absolute; left: 20px; right: 20px; top: 268px; height: 330px; background: #FBFBF8; border: 2px solid var(--ink); border-radius: 16px;
           box-shadow: 0 6px 0 var(--ink), 0 26px 30px -18px rgba(0,0,0,.35); transform-origin: 50% 0; }
  .holes { position: absolute; left: 18px; right: 18px; top: 10px; display: flex; justify-content: space-between; }
  .holes i { width: 9px; height: 9px; border-radius: 50%; background: var(--page); border: 1.5px solid rgba(27,27,27,.4); }
  .hd { position: absolute; left: 18px; right: 18px; top: 28px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
  .hd b { font: 400 22px/1 Anton, sans-serif; }
  .hd span { font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--soft); }
  .grid { position: absolute; left: 50px; right: 14px; top: 76px; bottom: 14px; display: flex; gap: 6px; }
  .hrs { position: absolute; left: 12px; top: 96px; bottom: 14px; width: 34px; }
  .hrs span { position: absolute; left: 0; font: 600 9.5px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.5); }
  .day { position: relative; flex: 1; }
  .day small { display: block; text-align: center; font: 700 10.5px/1 "IBM Plex Mono", monospace; color: var(--soft); height: 18px; }
  .col { position: absolute; left: 0; right: 0; top: 20px; bottom: 0; border-radius: 6px; background: repeating-linear-gradient(transparent 0 27px, rgba(27,27,27,.07) 27px 28px); }
  .hl { position: absolute; left: -2px; right: -2px; border-radius: 3px; background: rgba(255,181,17,.42); transform-origin: 50% 0; }
  .ev { position: absolute; left: 1px; right: 1px; border-radius: 5px; background: #ECECE6; border-left: 3px solid rgba(27,27,27,.55); padding: 3px 4px; overflow: hidden;
        font: 700 8.5px/1.1 Inter; color: var(--ink); }
  .ev.sx { background: #F7E3DE; border-left-color: var(--red); color: var(--red); }
  .stk { position: absolute; left: -1px; right: -1px; height: 26px; border-radius: 6px; background: var(--blue); border: 2px solid var(--ink); box-shadow: 0 2px 0 var(--ink);
         display: grid; place-items: center; font: 800 7.5px/1 Inter; letter-spacing: .6px; color: #fff; }
  .plaster { position: absolute; width: 40px; height: 15px; border-radius: 8px; background: #E8B98F; border: 1.5px solid var(--ink); }
  .plaster::after { content: ""; position: absolute; left: 13px; right: 13px; top: 2px; bottom: 2px; border-radius: 3px; background: #D9A274; }
  .note { position: absolute; right: 20px; font: 400 18px/1.05 "Caveat Brush", cursive; color: var(--ink); }
  .brain { position: absolute; width: 84px; }
  .priv { position: absolute; left: 24px; right: 24px; top: 676px; display: flex; gap: 8px; align-items: center; justify-content: center; font: 600 13px/1.3 "IBM Plex Mono", monospace; color: var(--ink); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const BRAIN = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";
// 3 PM to 11 PM; each hour is 34 px of the 272 px column.
const H = 28, y = h => (h - 15) * H;
const DAYS = [
  { d: "MON", ev: [[15, 16.5, "Class"], [19, 20.5, "Practice"]], lock: 17.5 },
  { d: "TUE", ev: [[15, 17, "Work"]], lock: 17.5 },
  { d: "WED", ev: [[15, 23, "Away game", true]], lock: null },
  { d: "THU", ev: [[15, 16.5, "Class"], [19.5, 21, "Dinner"]], lock: 17.5 },
  { d: "FRI", ev: [[15, 15.5, "Class"], [20, 23, "Party"]], lock: 17 },
];
// Free gaps per day (computed from the events above, kept literal for clarity).
const FREE = [[[16.5, 19], [20.5, 23]], [[17, 23]], [], [[16.5, 19.5], [21, 23]], [[15.5, 20]]];
const ease = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

const el = document.createElement("div"); el.className = "phone";
el.innerHTML = `<div class="bars">${Array.from({ length: 14 }, (_, i) => `<i class="${i < 13 ? "on" : ""}"></i>`).join("")}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="tag"><i></i>WHEN IT FITS</div><h1>Let’s find your<br>free time.</h1>
  <div class="sheet"><div class="holes">${"<i></i>".repeat(9)}</div>
    <div class="hd"><b>THIS WEEK</b><span>EVENINGS</span></div>
    <div class="hrs">${[4, 6, 8, 10].map(h => `<span style="top:${y(h + 12) - 4}px">${h}PM</span>`).join("")}</div>
    <div class="grid">${DAYS.map((d, i) => `<div class="day"><small>${d.d}</small><div class="col">
      ${FREE[i].map(([a, b]) => `<i class="hl" style="top:${y(a)}px;height:${y(b) - y(a)}px"></i>`).join("")}
      ${d.ev.map(([a, b, n, sx]) => `<div class="ev ${sx ? "sx" : ""}" style="top:${y(a)}px;height:${y(b) - y(a) - 2}px">${n}</div>`).join("")}
      ${d.lock ? `<div class="stk" style="top:${y(d.lock)}px">LOCK-IN</div>` : ""}</div></div>`).join("")}</div></div>
  <div class="note" style="left:94px;top:618px">Away game Wednesday? That day's off.</div>
  <img class="brain" src="${BRAIN}" style="left:22px;top:604px;width:64px">
  <div class="priv"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="8" rx="2" fill="#1B1B1B"/><path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="#1B1B1B" stroke-width="2" fill="none"/></svg>Read on this iPhone. Nothing leaves it.</div>
  <div class="btn">USE MY CALENDAR</div><div class="sec">I’ll pick a time</div><div class="home"></div>`;
document.getElementById("row").appendChild(el);

window.renderAt = t => {
  const k = clamp((t - .1) / .6), sh = el.querySelector(".sheet");
  sh.style.opacity = k; sh.style.transform = `translateY(${(1 - ease(k)) * 40}px) rotate(${-4 + 3 * back(k)}deg)`;
  el.querySelectorAll(".ev").forEach((e, i) => { const q = clamp((t - (.5 + i * .05)) / .3); e.style.opacity = q; });
  el.querySelectorAll(".hl").forEach((h, i) => { const q = clamp((t - (1.1 + i * .07)) / .35); h.style.transform = `scaleY(${ease(q)})`; });
  el.querySelectorAll(".stk").forEach((s, i) => { const q = clamp((t - (1.9 + i * .14)) / .3);
    s.style.opacity = q > 0 ? 1 : 0; s.style.transform = `scale(${q > 0 ? 1.6 - .6 * back(q) : 1.6}) rotate(${(i % 2 ? 4 : -4) * (1 - q)}deg)`; });
  el.querySelector(".note").style.opacity = clamp((t - 2.9) / .3);
  const b = el.querySelector(".brain"), bk = clamp((t - .4) / .5);
  b.style.opacity = bk; b.style.transform = `translateY(${(1 - ease(bk)) * 30 + Math.sin(t * 2.2) * 3}px) rotate(${Math.sin(t * 1.6) * 4}deg)`;
};
window.render = () => window.renderAt(4);
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.render(); window.ready = true; });
</script>
</body>
</html>
