<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide words</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The top of each intro slide with its new words (2026-11-20): progress bars, the part label,
   the headline and the one short line. Anton stands in for Apple's compressed black. */
:root { --paper: #E7E8E3; --ink: #1B1B1B; --blue: #3255A4; --orange: #E85A1E; }
body { margin: 0; background: #cfd0cb; padding: 28px; font-family: 'IBM Plex Mono', monospace; color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(4, 342px); gap: 22px; }
.s { background: var(--paper); border-radius: 26px; padding: 18px 22px 22px; box-sizing: border-box; min-height: 250px; box-shadow: 0 10px 22px rgba(0,0,0,.14); }
.bars { display: flex; gap: 3px; } .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .bars i.on { background: var(--ink); }
.tag { display: flex; gap: 7px; align-items: center; margin-top: 22px; font: 700 11px/1 'IBM Plex Mono'; letter-spacing: 1.4px; text-transform: uppercase; color: var(--blue); }
.tag b { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.t { font: 400 46px/.98 Anton, sans-serif; text-transform: uppercase; margin-top: 10px; white-space: pre-line; }
.l { font: 500 13px/1.35 'IBM Plex Mono'; margin-top: 12px; }
.n { float: right; font: 700 10px/1 'IBM Plex Mono'; color: rgba(27,27,27,.4); margin-top: 22px; }
.btn { margin-top: 14px; display: inline-block; padding: 8px 16px; border-radius: 20px; background: var(--ink); color: var(--paper); font: 700 11px/1 'IBM Plex Mono'; letter-spacing: 1.4px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
const S = [
  ["Your phone time", "Where does\nthe time go?", "Let’s find out.", "LET’S FIND OUT"],
  ["Your phone time", "How many hours\na day?", "Guess first. iPhone will ask to share your real number next.", "SEE MY ACTUAL TIME"],
  ["Your phone time", "Let’s check\nyour guess.", "(loading bar, then your real number)", "", "o"],
  ["Your phone time", "9H 33M\na day.", "(your real hours and what they add up to)", "CONTINUE"],
  ["How it works", "Your apps\nwait.", "While you focus, apps and pings wait.", "NEXT"],
  ["How it works", "Watch your\nweek fill up.", "Every session you finish adds a day.", "NEXT"],
  ["Make it yours", "What pulls\nyou in?", "Tap what keeps you scrolling. It shapes your plan.", "NEXT"],
  ["Make it yours", "Which apps\nto block?", "They only lock during a session.", "CHOOSE APPS"],
  ["Make it yours", "What do you\nwant more of?", "Your plan makes room for these.", "NEXT"],
  ["Your plan", "Your lock-in\nplan.", "When and how long you’ll lock in. Change it anytime.", "THIS IS MY PLAN"],
  ["Optional", "Lock in\nfor real.", "(SwipeLater Plus · Not now is one tap)", "TRY 7 DAYS FREE"],
  ["Start", "One slide.\nYou’re in.", "Slide the brain to start your first session.", "SLIDE TO LOCK IN"],
];
const g = document.getElementById('g');
S.forEach(([tag, t, l, btn, o], i) => {
  const bars = Array.from({length: 12}, (_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('');
  g.insertAdjacentHTML('beforeend', `<div class="s"><div class="bars">${bars}</div><span class="n">${i + 1}</span>
    <div class="tag" style="${o ? 'color:var(--orange)' : ''}"><b></b>${tag}</div><div class="t">${t}</div>
    <div class="l">${l}</div>${btn ? `<div class="btn">${btn}</div>` : ''}</div>`);
});
document.fonts.ready.then(() => { window.ready = true; });
window.render = () => {};
</script>
</body>
</html>
