<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nicer app picker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
  * { box-sizing:border-box; margin:0; user-select:none; }
  :root { --ink:#EDEBE6; --soft:#8D9096; --panel:#1A1C20; --edge:#2B2E34; --ice:#9CC9F5; --sage:#8FD3B0; }
  body { background:#cfcfd2; display:grid; place-items:center; min-height:100vh; font-family:Onest,system-ui,sans-serif; }
  .phone { width:393px; height:852px; border-radius:52px; overflow:hidden; position:relative; color:var(--ink); background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%); }
  .island { position:absolute; top:11px; left:50%; width:120px; height:34px; margin-left:-60px; border-radius:20px; background:#000; z-index:9; }
  .sb { position:absolute; top:18px; left:34px; font-weight:600; font-size:16px; z-index:9; }
  .bars { position:absolute; left:26px; right:26px; top:54px; display:flex; gap:3px; }
  .bars i { flex:1; height:4px; border-radius:2px; background:var(--edge); } .bars i.on { background:var(--ink); }
  .scr { position:absolute; inset:0; padding:100px 26px 0; }
  h1 { font-weight:500; font-size:46px; line-height:1.02; letter-spacing:-1.2px; margin-top:30px; }
  .lead { font-size:19px; line-height:1.35; margin-top:14px; max-width:320px; }
  .btn { position:absolute; left:26px; right:26px; bottom:60px; height:58px; border-radius:14px; display:flex; gap:10px; align-items:center; justify-content:center; font-weight:650; font-size:17px; background:var(--ink); color:#0A0B0D; transition:transform .12s; }
  .btn.press { transform:scale(.97); }
  .stage { position:absolute; left:0; top:300px; width:393px; height:360px; }
  .slot { position:absolute; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:18px; border:2px dashed #4a4f57; display:grid; place-items:center; color:#6b7078; font-size:26px; transition:all .3s; }
  .slot.empty { animation:breathe 1.8s infinite; }
  @keyframes breathe { 0%,100% { border-color:#4a4f57; transform:scale(1) } 50% { border-color:var(--ice); transform:scale(1.06) } }
  .slot .appic { position:absolute; inset:-2px; border-radius:18px; transform:scale(0); }
  .slot.fill { border:0; background:#262A30; animation:none; }
  .slot.fill .appic { animation:pop .5s var(--d,0s) both; }
  @keyframes pop { 0% { transform:scale(0) } 60% { transform:scale(1.2) } 100% { transform:scale(1) } }
  .ring { transform-origin:50% 50%; }
  .ring-fill { stroke-dasharray:706; stroke-dashoffset:706; transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.2,1); }
  .stage.done .ring-fill { stroke-dashoffset:0; }
  .shackle { transform-box:fill-box; transform-origin:100% 100%; transform:translateY(-10px) rotate(-18deg); transition:transform .5s cubic-bezier(.3,1.6,.5,1) 1.1s; }
  .stage.done .shackle { transform:none; }
  .lockbody { transition:fill .4s 1.2s; }
  .stage.done .lockbody { fill:#8FD3B0; }
  .count { position:absolute; left:0; right:0; top:690px; text-align:center; opacity:0; transform:translateY(10px); transition:all .5s 1.5s; }
  .count.show { opacity:1; transform:none; }
  .count b { font-size:22px; font-weight:600; color:var(--sage); }
  .tap { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; border:3px solid #fff; background:#ffffff33; z-index:50; pointer-events:none; opacity:0; transform:scale(1.4); transition:opacity .2s, transform .2s; }
  .tap.on { opacity:1; transform:scale(1); }
  .sheet { position:absolute; left:0; right:0; top:110px; bottom:0; z-index:32; border-radius:22px 22px 0 0; background:#1c1c1e; transform:translateY(105%); transition:transform .5s cubic-bezier(.3,.8,.2,1); font-family:-apple-system,"Inter",system-ui,sans-serif; color:#fff; }
  .sheet.on { transform:none; }
  .sh-top { display:flex; justify-content:space-between; padding:18px 20px 8px; font-size:17px; color:#0A84FF; } .sh-top b { color:#fff; font-weight:600; }
  .sh-search { margin:6px 16px 10px; height:36px; border-radius:10px; background:#2c2c2e; color:#8e8e93; display:flex; align-items:center; padding:0 12px; font-size:16px; }
  .sh-h { padding:12px 20px 6px; font-size:13px; color:#8e8e93; text-transform:uppercase; }
  .sh-row { display:flex; align-items:center; gap:12px; padding:0 20px; height:54px; border-bottom:1px solid #ffffff12; font-size:17px; }
  .sh-ic { width:34px; height:34px; border-radius:8px; flex:none; }
  .sh-rad { margin-left:auto; width:24px; height:24px; border-radius:50%; border:2px solid #636366; display:grid; place-items:center; color:#fff; font-size:14px; transition:all .15s; }
  .sh-row.sel .sh-rad { background:#0A84FF; border-color:#0A84FF; }
  .note { font-family:Caveat,cursive; font-weight:600; font-size:25px; color:var(--ice); position:absolute; left:200px; top:268px; transform:rotate(-5deg); }
</style>
</head>
<body>
<div class="phone" id="ph">
  <div class="island"></div><div class="sb">9:41</div>
  <div class="bars"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="scr">
    <h1>Shield<br>your apps.</h1>
    <p class="lead" id="lead">Pick the apps that pull you in.</p>
  </div>
  <div class="stage" id="stage">
    <svg width="393" height="360" viewBox="0 0 393 360" style="position:absolute;left:0;top:0;overflow:visible">
      <circle cx="196" cy="180" r="112" fill="#141619" stroke="#25282D" stroke-width="12"/>
      <circle class="ring-fill" cx="196" cy="180" r="112" fill="none" stroke="#8FD3B0" stroke-width="12" stroke-linecap="round" transform="rotate(-90 196 180)"/>
      <rect class="lockbody" x="166" y="168" width="60" height="46" rx="9" fill="#EDEBE6"/>
      <path class="shackle" d="M177 168 V156 a19 19 0 0 1 38 0 V168" fill="none" stroke="#EDEBE6" stroke-width="8"/>
    </svg>
    <div class="slot empty" id="sl0" style="left:196px;top:34px">+<div class="appic" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af);--d:.1s"></div></div>
    <div class="slot empty" id="sl1" style="left:313px;top:250px">+<div class="appic" style="background:#000;border:1px solid #444;--d:.35s"></div></div>
    <div class="slot empty" id="sl2" style="left:79px;top:250px">+<div class="appic" style="background:#e53935;--d:.6s"></div></div>
  </div>
  <div class="count" id="count"><b>3 apps blocked</b></div>
  <div class="note" id="note">tap to pick</div>
  <div class="btn" id="btn">Choose apps</div>
  <div class="sheet" id="sheet"><div class="sh-top"><span>Cancel</span><b>Select Apps</b><span id="doneBtn">Done</span></div>
    <div class="sh-search">⌕&nbsp; Search</div>
    <div class="sh-h">Social</div>
    <div class="sh-row" data-r><div class="sh-ic" style="background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)"></div>Instagram<div class="sh-rad"></div></div>
    <div class="sh-row" data-r><div class="sh-ic" style="background:#000;border:1px solid #444"></div>X<div class="sh-rad"></div></div>
    <div class="sh-h">Entertainment</div>
    <div class="sh-row" data-r><div class="sh-ic" style="background:#e53935"></div>YouTube<div class="sh-rad"></div></div>
    <div class="sh-row"><div class="sh-ic" style="background:#43a047"></div>Podcasts<div class="sh-rad"></div></div>
  </div>
  <div class="tap" id="tap"></div>
</div>
<script>
const $ = (s, r=document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const ph = $('#ph');
async function tapAt(el){ const pr = ph.getBoundingClientRect(), r = el.getBoundingClientRect(); const t = $('#tap');
  t.style.left = (r.left-pr.left+r.width/2)+'px'; t.style.top = (r.top-pr.top+r.height/2)+'px'; t.classList.add('on'); await sleep(350); el.classList.add('press'); await sleep(130); el.classList.remove('press'); await sleep(150); t.classList.remove('on'); }
function finish(){
  ['sl0','sl1','sl2'].forEach(id => { const s = $('#'+id); s.classList.remove('empty'); s.classList.add('fill'); s.firstChild.textContent = ''; });
  $('#stage').classList.add('done'); $('#count').classList.add('show'); $('#note').style.display='none';
  $('#btn').textContent = 'Next'; $('#lead').textContent = 'These will shut when your timer runs.';
}
async function play(){
  window.__done = false; await sleep(2600);
  await tapAt($('#btn')); $('#sheet').classList.add('on'); $('#note').style.display='none'; await sleep(1400);
  for (const r of ph.querySelectorAll('[data-r]')) { await tapAt(r); r.classList.add('sel'); $('.sh-rad', r).textContent = '✓'; await sleep(500); }
  await sleep(500); await tapAt($('#doneBtn')); $('#sheet').classList.remove('on'); await sleep(700);
  finish(); await sleep(3200); await tapAt($('#btn')); await sleep(600); window.__done = true;
}
window.play = play;
if (location.search.includes('final')) { finish(); $('#stage').querySelectorAll('*').forEach(e => e.style.transition='none'); $('.count').style.transition='none'; }
</script>
</body>
</html>
