<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock In study facts, custom visuals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@600&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  :root { --ink:#EDEBE6; --soft:#8D9096; --ice:#9CC9F5; }
  body { font-family:-apple-system,"Inter",system-ui,sans-serif; background:#cfcfd2; padding:22px; }
  .row { display:flex; gap:16px; }
  .cap { font:600 13px system-ui; color:#444; margin:0 0 6px 6px; }
  .wrap { zoom:.78; width:393px; height:852px; flex:none; }
  .phone { width:393px; height:852px; border-radius:52px; overflow:hidden; position:relative; background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%); color:var(--ink); }
  .island { position:absolute; top:11px; left:50%; width:120px; height:34px; margin-left:-60px; border-radius:20px; background:#000; }
  .sb { position:absolute; top:18px; left:34px; font-weight:600; font-size:16px; }
  .bars { position:absolute; left:26px; right:26px; top:54px; display:flex; gap:5px; }
  .bars i { flex:1; height:4px; border-radius:2px; background:#2B2E34; } .bars i.on { background:var(--ink); }
  .mark { position:absolute; top:66px; left:26px; font-family:Fraunces,Georgia,serif; font-weight:600; font-size:17px; }
  .skip { position:absolute; top:66px; right:26px; font-size:15px; color:var(--soft); }
  h1 { position:absolute; left:26px; right:26px; top:120px; font-family:Fraunces,Georgia,serif; font-weight:500; font-size:50px; line-height:1; letter-spacing:-1.2px; }
  .lead { position:absolute; left:26px; width:320px; top:182px; font-size:19px; line-height:1.35; }
  .big { position:absolute; font-family:Fraunces,Georgia,serif; font-weight:500; letter-spacing:-3px; line-height:.9; }
  .note { position:absolute; font-family:Caveat,"Segoe Script",cursive; font-weight:600; font-size:26px; line-height:1.05; color:var(--ice); transform:rotate(var(--r,-4deg)); }
  .note.warm { color:var(--ink); }
  .src { position:absolute; left:26px; right:40px; bottom:128px; font-size:14px; line-height:1.4; color:var(--soft); }
  .src b { color:var(--ink); font-weight:600; }
  .btn { position:absolute; left:26px; right:26px; bottom:60px; height:58px; border-radius:14px; display:grid; place-items:center; font-weight:650; font-size:17px; background:var(--ink); color:#0A0B0D; }
  svg { position:absolute; overflow:visible; }
  svg.rough { filter:url(#rough); }
  .tiny { position:absolute; font-size:12px; color:var(--soft); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>
<div class="row" id="r"></div>
<script>
const bars = n => `<div class="bars">${[0,1,2].map(i => `<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const frame = (cap, inner) => `<div><div class="cap">${cap}</div><div class="wrap"><div class="phone"><div class="island"></div><div class="sb">9:41</div>${inner}</div></div></div>`;
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* 1: 100 moments, 47 of them somewhere else */
const drift = new Set(); const idx = [...Array(100).keys()];
for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
idx.slice(0, 47).forEach(i => drift.add(i));
let dots = '';
for (let i = 0; i < 100; i++) {
  const x = 15 + (i % 10) * 30, y = 15 + Math.floor(i / 10) * 30;
  if (drift.has(i)) {
    const a = rnd() * Math.PI * 2, d = 9 + rnd() * 10, dx = x + Math.cos(a) * d, dy = y + Math.sin(a) * d;
    dots += `<circle cx="${x}" cy="${y}" r="5.5" fill="none" stroke="#3A3F47" stroke-width="1.8" stroke-dasharray="2 3"/><circle cx="${dx}" cy="${dy}" r="6.5" fill="#9CC9F5"/>`;
  } else dots += `<circle cx="${x}" cy="${y}" r="6" fill="#EDEBE6"/>`;
}
const f1 = frame('1. Minds wander', `
  ${bars(0)}<div class="mark">The facts</div><div class="skip">Skip</div>
  <h1>Minds wander.</h1>
  <p class="lead">Out of 100 moments, 47 had a mind somewhere else.</p>
  <svg class="rough" style="left:46px;top:290px" width="300" height="300" viewBox="0 0 300 300">${dots}</svg>
  <div class="note" style="left:236px;top:610px;--r:-4deg">yep. that's me.</div>
  <p class="src"><b>Killingsworth and Gilbert, 2010.</b> 2,250 adults answered a phone survey at random times. Wandering showed up 46.9% of the time.</p>
  <div class="btn">Next</div>`);

/* 2: one buzz, schematic attention line */
const f2 = frame('2. One buzz', `
  ${bars(1)}<div class="mark">The facts</div><div class="skip">Skip</div>
  <h1>One buzz.</h1>
  <p class="lead">Even a notification you never touch can pull your attention away.</p>
  <svg class="rough" style="left:30px;top:310px" width="333" height="240" viewBox="0 0 333 240" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 80 L110 80" stroke="#EDEBE6" stroke-width="4"/>
    <path d="M110 80 C122 80 126 150 140 150 C156 150 156 100 170 112 C184 126 186 96 200 106 C216 118 222 84 240 90 L333 84" stroke="#EDEBE6" stroke-width="4"/>
    <g stroke="#9CC9F5" stroke-width="3.5"><path d="M110 30 a14 14 0 0 1 0 -0.1"/><circle cx="110" cy="22" r="8" fill="#9CC9F5" stroke="none"/><path d="M92 22 a20 20 0 0 1 0 -8 M128 22 a20 20 0 0 0 0 -8" opacity="0"/><path d="M90 8 C80 16 80 30 90 38 M130 8 C140 16 140 30 130 38"/><path d="M76 0 C60 14 60 34 76 48 M144 0 C160 14 160 34 144 48" opacity=".55"/></g>
    <line x1="110" y1="52" x2="110" y2="200" stroke="#3A3F47" stroke-width="2" stroke-dasharray="3 6"/>
  </svg>
  <div class="note warm" style="left:30px;top:410px;--r:-3deg">focused</div>
  <div class="note warm" style="left:150px;top:486px;--r:3deg;width:200px">wait, what was I doing?</div>
  <div class="tiny" style="left:30px;top:566px">A drawing to show the idea. Not the study's data.</div>
  <p class="src"><b>Stothart, Mitchum and Yehnert, 2015.</b> In a lab attention test, a phone alert hurt performance, about as much as using the phone.</p>
  <div class="btn">Next</div>`);

/* 3: getting back takes a while */
const f3 = frame('3. Getting back', `
  ${bars(2)}<div class="mark">The facts</div><div class="skip">Skip</div>
  <h1>Coming back.</h1>
  <p class="lead">After an interruption, it often took over 20 minutes to get back to the work.</p>
  <svg class="rough" style="left:30px;top:340px" width="333" height="200" viewBox="0 0 333 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 70 L46 70" stroke="#EDEBE6" stroke-width="4"/>
    <circle cx="46" cy="70" r="9" fill="#9CC9F5" stroke="none"/>
    <path d="M56 70 C70 20 92 130 112 60 C130 10 140 120 160 66 C176 30 184 100 202 72 C214 54 224 84 238 70 L327 70" stroke="#EDEBE6" stroke-width="4"/>
    <path d="M6 130 L327 130" stroke="#3A3F47" stroke-width="3"/>
    <g stroke="#8D9096" stroke-width="3"><path d="M46 122 V138"/><path d="M238 122 V138"/></g>
  </svg>
  <div class="note" style="left:36px;top:488px;--r:-3deg">buzz</div>
  <div class="note warm" style="left:150px;top:492px;--r:-2deg;width:200px">20+ min. back on it.</div>
  <div class="tiny" style="left:30px;top:566px">A drawing to show the idea. Not the study's data.</div>
  <p class="src"><b>Gloria Mark, UC Irvine.</b> Workplace study, small and from 2005. The figure is "over 20 minutes", not exact.</p>
  <div class="btn">Next</div>`);

document.getElementById('r').innerHTML = f1 + f2 + f3;
</script>
</body>
</html>
