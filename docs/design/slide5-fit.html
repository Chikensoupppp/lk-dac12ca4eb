<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 5 fit</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@600;700;800;900&family=IBM+Plex+Mono:wght@600;700&display=block" rel="stylesheet">
<style>
  /* A flow-layout copy of slide 5 (DayBarSlide inside PrintScaffold) with the SwiftUI sizes,
     to check that the last row ends above CONTINUE. Old = before 2026-11-19, new = after.
     Stand-in fonts: Anton for SF compressed black, Caveat Brush for Marker Felt. */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --red:#E5484D; --card:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, system-ui, sans-serif; }
  .row { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .label { font: 700 13px/1 "IBM Plex Mono", monospace; margin: 0 0 8px 6px; color: #444; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18);
           display: flex; flex-direction: column; padding-top: 59px; padding-bottom: 34px; }
  .bars { display: flex; gap: 3px; padding: 12px 24px 0; } .bars i { flex: 1; height: 4px; border-radius: 2px; background: var(--ink); } .bars i.off { background: rgba(27,27,27,.18); }
  .backrow { height: 44px; padding-left: 12px; display: flex; align-items: center; }
  .scroll { position: relative; flex: 1; overflow: hidden; }
  .content { padding: 0 24px 20px; display: flex; flex-direction: column; }
  .tag { display: flex; gap: 7px; align-items: center; font: 700 11px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--blue); margin-bottom: 10px; }
  .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
  .slide { display: flex; flex-direction: column; gap: var(--gap); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .head h1 { font: 400 var(--h)/0.95 Anton, sans-serif; text-transform: uppercase; color: var(--ink); }
  .head img { width: var(--brain); }
  .lede { position: relative; margin-top: -10px; }
  .lede p { font: 800 var(--lede)/1.2 Inter, sans-serif; letter-spacing: -.3px; opacity: 0; }
  .bub { position: absolute; left: 0; right: 0; top: 0; background: #fff; border-radius: 18px 4px 18px 18px; padding: 9px 14px; font: 400 23px/1.1 "Caveat Brush", cursive; box-shadow: 0 6px 9px rgba(27,27,27,.14); }
  .card { background: var(--card); border: 2px solid var(--ink); border-radius: 24px; box-shadow: 0 5px 0 var(--ink); padding: var(--cp); }
  .big { font: 400 var(--big)/1.08 Anton, sans-serif; }
  .cap { font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.2px; color: rgba(27,27,27,.6); margin-top: 4px; }
  .bar { position: relative; height: 36px; margin-top: var(--bt); border: 2px solid var(--ink); border-radius: 10px; background: #fff; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 32.5%; background: var(--blue); border-right: 2px solid var(--ink); }
  .bar b { position: absolute; left: 10px; top: 10px; font: 700 12px/1 "IBM Plex Mono", monospace; color: #fff; }
  .bar span { position: absolute; right: 8px; top: 9px; font: 700 10px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.6); background: #fff; padding: 3px 4px; }
  .axis { display: flex; justify-content: space-between; font: 600 9px/1 "IBM Plex Mono", monospace; color: rgba(27,27,27,.55); margin-top: 5px; }
  .chips { display: flex; gap: 8px; margin-top: var(--ct); }
  .chip { flex: 1; min-width: 0; background: #fff; border: 1.5px solid rgba(27,27,27,.14); border-radius: 12px; padding: var(--chp) 10px; }
  .chip small { display: block; font: 700 9px/1.1 "IBM Plex Mono", monospace; letter-spacing: 1px; color: rgba(27,27,27,.6); white-space: nowrap; overflow: hidden; }
  .chip b { display: block; font: 400 19px/1.15 Anton, sans-serif; margin-top: 5px; white-space: nowrap; }
  .enough { display: flex; flex-direction: column; gap: var(--eg); }
  .enough small { font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.6px; color: rgba(27,27,27,.6); }
  .it { display: flex; align-items: center; gap: 12px; }
  .ic { width: var(--ic); height: var(--ic); border-radius: 50%; border: 2px solid var(--ink); box-shadow: 0 3px 0 var(--ink); flex: none; display: grid; place-items: center; color: #fff; font: 900 13px/1 Inter; }
  .it b { font: 400 var(--num)/1.1 Anton, sans-serif; } .it span { font: 800 16px/1.2 Inter, sans-serif; letter-spacing: -.3px; }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; background: linear-gradient(rgba(231,232,227,0), var(--page)); }
  .btns { padding: 0 24px 8px; }
  .next { height: 60px; border-radius: 30px; background: var(--ink); color: var(--page); display: grid; place-items: center; font: 800 19px/1 Inter; letter-spacing: 2px; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
  .old { --gap: 20px; --h: 46px; --brain: 104px; --lede: 17px; --cp: 16px; --big: 56px; --bt: 14px; --ct: 12px; --chp: 8px; --eg: 10px; --ic: 38px; --num: 28px; }
  .new { --gap: 12px; --h: 46px; --brain: 104px; --lede: 17px; --cp: 14px; --big: 56px; --bt: 10px; --ct: 8px; --chp: 8px; --eg: 6px; --ic: 38px; --num: 28px; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const phone = (cls, name) => `<div><div class="label">${name}</div><div class="phone ${cls}">
  <div class="bars">${Array.from({ length: 13 }, (_, i) => `<i class="${i < 5 ? "" : "off"}"></i>`).join("")}</div>
  <div class="backrow"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="scroll"><div class="content">
    <div class="tag"><i></i>WHAT THAT MEANS FOR YOUR DAY</div>
    <div class="slide">
      <div class="head"><h1>5H 12M<br>a day.</h1><img src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" alt=""></div>
      <div class="lede"><p>That’s a lot of time. How much of it is really yours to choose?</p><div class="bub">A third of your day? Oof.</div></div>
      <div class="card"><div class="big">5H 12M</div><div class="cap">ON YOUR PHONE, OUT OF 16 HOURS AWAKE</div>
        <div class="bar"><i></i><b>33%</b><span>10H 48M LEFT FOR YOU</span></div>
        <div class="axis"><span>0H</span><span>4H</span><span>8H</span><span>12H</span><span>16H</span></div>
        <div class="chips"><div class="chip"><small>EVERY WEEK</small><b>36H 24M</b></div><div class="chip"><small>A MONTH, NONSTOP</small><b>7 DAYS</b></div><div class="chip"><small>A YEAR, NONSTOP</small><b>79 DAYS</b></div></div></div>
      <div class="enough"><small>EVERY DAY, THAT’S ENOUGH TIME FOR</small>
        <div class="it"><div class="ic" style="background:#E5484D">▶</div><b>6</b><span>episodes of a show</span></div>
        <div class="it"><div class="ic" style="background:#FFB511;color:#1B1B1B">▤</div><b>210</b><span>pages of a book</span></div>
        <div class="it"><div class="ic" style="background:#3255A4">●</div><b>5</b><span>gym sessions</span></div></div>
    </div></div><div class="fade"></div></div>
  <div class="btns"><div class="next">CONTINUE</div></div><div class="home"></div></div></div>`;
document.getElementById("row").innerHTML = phone("old", "BEFORE") + phone("new", "NOW");
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.ready = true; });
window.render = () => {};
</script>
</body>
</html>
