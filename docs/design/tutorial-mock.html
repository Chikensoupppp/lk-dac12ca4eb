<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>First lock-in walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* Ideas borrowed: Duolingo (mascot guides every step, learn by doing, early win),
   Slack (do the real action, not a tour), Opal (tips on the real screen, a "first gem" reward). */
:root{--paper:#E7E8E3;--paper2:#EAEBE6;--panel:#F3F4F0;--ink:#1B1B1B;--soft:#575A55;--edge:#C4C6BD;--blue:#3255A4;--sun:#FFB511;--face:#F7F7F3;--cream:#F7F3E8;--plum:#40162A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#BFC1BA;font-family:Nunito,system-ui,sans-serif;color:var(--ink);padding:36px 28px 40px;display:flex;gap:24px;width:max-content}
.col{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{font:600 13px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#2c2e2a}
.phone{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:linear-gradient(var(--paper2),var(--paper) 50%,#E2E3DE);box-shadow:0 0 0 10px #1B1B1B,0 18px 40px rgba(0,0,0,.25)}
.phone::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(27,27,27,.06) .7px,transparent .8px);background-size:5px 5px;pointer-events:none;z-index:20}
.island{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:21}
.time{position:absolute;left:44px;top:20px;font:700 17px Nunito}
.fade{opacity:.22;filter:grayscale(1)}
.test{position:absolute;left:22px;top:66px;height:36px;padding:0 14px;border-radius:18px;border:1.5px solid var(--edge);background:var(--panel);font:800 12px Nunito;letter-spacing:.12em;display:flex;align-items:center}
.icons{position:absolute;right:20px;top:64px;display:flex;gap:11px}
.ic{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--edge);background:var(--panel);display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.brand{position:absolute;top:116px;width:100%;text-align:center;font:800 13px Nunito;letter-spacing:.32em}
.pair{position:absolute;top:142px;width:100%;text-align:center;font:800 11px Nunito;letter-spacing:.28em;color:var(--soft)}
.clock{position:absolute;left:33px;top:192px;width:324px;height:324px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,var(--face) 55%,#E9EAE4);box-shadow:inset 0 0 0 16px #DDDED7,inset 0 0 0 17px #cfd0c9,0 6px 18px rgba(0,0,0,.08)}
.ring{position:absolute;inset:6px;border-radius:50%;background:conic-gradient(from 200deg,var(--blue) 0 var(--fill,50%),transparent var(--fill,50%));-webkit-mask:radial-gradient(circle,transparent 63%,#000 63.5%,#000 67%,transparent 67.5%);mask:radial-gradient(circle,transparent 63%,#000 63.5%,#000 67%,transparent 67.5%)}
.digits{position:absolute;inset:0;display:grid;place-items:center;font:800 70px Nunito;letter-spacing:-1px}
.ready{position:absolute;top:196px;width:100%;text-align:center;font:800 12px Nunito;letter-spacing:.3em}
.working{position:absolute;left:75px;top:538px;width:240px;height:42px;border-radius:21px;border:1.5px solid var(--edge);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font:800 11px Nunito;letter-spacing:.14em}
.mlab{position:absolute;top:594px;width:100%;text-align:center;font:800 11px Nunito;letter-spacing:.28em;color:var(--soft)}
.mins{position:absolute;left:24px;top:618px;width:342px;height:50px;border-radius:14px;border:1.5px solid var(--edge);background:var(--panel);display:flex;align-items:center;justify-content:space-around;font:700 16px Nunito;color:var(--soft)}
.mins b{background:var(--ink);color:#fff;border-radius:10px;padding:10px 16px}
.locked{position:absolute;top:688px;width:100%;text-align:center;font:800 11px Nunito;letter-spacing:.2em;color:var(--soft)}
.go{position:absolute;left:24px;top:752px;width:342px;height:58px;border-radius:29px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 15px Nunito;letter-spacing:.3em;box-shadow:3px 4px 0 var(--sun);overflow:hidden}
.go .hold{position:absolute;left:0;top:0;bottom:0;width:58%;background:#24407F}
.go span{position:relative}
.home{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink)}
/* guide marks: a felt-pen loop and a tap dot, like someone circled it on the print */
.loop{position:absolute;z-index:12;overflow:visible;pointer-events:none}
.loop path{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round}
.tapdot{position:absolute;z-index:13;width:26px;height:26px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 0 0 8px rgba(255,181,17,.35),0 0 0 18px rgba(255,181,17,.15)}
/* the brain and its bubble (same cream bubble as the PC desk buddy) */
.guide{position:absolute;z-index:14;display:flex;align-items:flex-end;gap:2px}
.guide img{width:var(--bw,118px);display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.12));transform:rotate(var(--tilt,0deg)) scale(var(--sx,1),var(--sy,1));transform-origin:50% 90%}
.who{position:relative}
.who svg{position:absolute;overflow:visible;pointer-events:none}
.bubble b{display:block;font:400 30px/1 Anton,sans-serif;text-transform:uppercase;letter-spacing:.01em;color:var(--plum);margin-bottom:4px}
.cheer{position:absolute;z-index:15;font:400 34px/1 Anton,sans-serif;color:var(--ink);background:var(--sun);border:3px solid var(--ink);padding:8px 14px 6px;transform:rotate(var(--r,-8deg));box-shadow:3px 3px 0 var(--ink);clip-path:polygon(0 12%,8% 0,30% 8%,52% 0,74% 7%,94% 0,100% 30%,96% 58%,100% 88%,78% 100%,54% 92%,30% 100%,6% 92%,0 64%)}
.confetti{position:absolute;inset:0;z-index:13;pointer-events:none}
.bubble{position:relative;background:var(--cream);border:2.5px solid var(--plum);border-radius:16px;padding:12px 15px;font:800 18px/1.25 Nunito;color:var(--plum);max-width:210px;margin-bottom:var(--bm,62px)}
.bubble::after{content:"";position:absolute;left:-11px;bottom:18px;width:18px;height:18px;background:var(--cream);border-left:2.5px solid var(--plum);border-bottom:2.5px solid var(--plum);transform:rotate(45deg)}
.bubble small{display:block;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;color:#8a6d78;margin-bottom:3px}
.marker{font-family:"Permanent Marker",cursive;color:var(--blue);font-weight:400}
.skip{position:absolute;z-index:14;left:24px;top:62px;font:800 12px Nunito;letter-spacing:.22em;color:var(--soft);padding:14px 4px}
.scrim{position:absolute;inset:0;background:rgba(27,27,27,.28);z-index:10}
.sheet{position:absolute;z-index:11;left:0;right:0;bottom:0;height:420px;background:var(--panel);border-radius:28px 28px 0 0;padding:26px 22px}
.sheet h4{font:400 34px Anton,sans-serif;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{height:46px;padding:0 18px;border-radius:23px;border:2px solid var(--ink);display:flex;align-items:center;font:800 16px Nunito;background:var(--panel)}
.chip.on{background:var(--sun);box-shadow:3px 3px 0 var(--ink)}
.chip.new{border-style:dashed;color:var(--soft)}
.sticker{position:absolute;z-index:13;background:var(--sun);border:2px solid var(--ink);border-radius:6px;padding:4px 8px;font:800 12px Nunito;letter-spacing:.06em;box-shadow:2px 2px 0 var(--ink);transform:rotate(var(--r,0deg))}
.hello{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(var(--paper2),var(--paper));padding:0 30px}
.hello h1{font:400 64px/0.95 Anton,sans-serif;text-transform:uppercase;text-align:center}
.hello h1 em{font-style:normal;color:var(--blue)}
.hello p{font:700 18px/1.35 Nunito;color:var(--soft);text-align:center;margin-top:16px}
.cta{margin-top:30px;height:58px;width:100%;border-radius:29px;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 15px Nunito;letter-spacing:.3em;box-shadow:3px 4px 0 var(--sun)}
.stamp{position:absolute;z-index:16;left:50%;top:290px;transform:translateX(-50%) rotate(-8deg);border:5px solid var(--blue);border-radius:10px;padding:10px 18px 12px;color:var(--blue);text-align:center;background:rgba(243,244,240,.94)}
.stamp b{display:block;font:400 44px/1 Anton,sans-serif;letter-spacing:.02em;white-space:nowrap}
.stamp i{display:block;font:600 13px "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.14em;margin-top:4px}
</style></head><body>
<script>
const A = 'tutorial-assets/';
const icon = (d) => `<div class="ic"><svg viewBox="0 0 20 20">${d}</svg></div>`;
const icons = `<div class="icons">${icon('<circle cx="10" cy="10" r="7.5" fill="none" stroke="#1B1B1B" stroke-width="1.8"/><circle cx="10" cy="10" r="3" fill="#1B1B1B"/>')}${icon('<circle cx="10" cy="6.5" r="3.6" fill="none" stroke="#1B1B1B" stroke-width="1.8"/><path d="M10 10v8M10 14.5h3M10 17h2.4" stroke="#1B1B1B" stroke-width="1.8" stroke-linecap="round"/>')}${icon('<path d="M10 2.5l6 2.3v5c0 4-2.6 6.4-6 7.7-3.4-1.3-6-3.7-6-7.7v-5z" fill="none" stroke="#1B1B1B" stroke-width="1.8" stroke-linejoin="round"/>')}</div>`;
// focus: which part is being taught; everything else fades back
const screen = (focus, extra, o = {}) => {
  const f = (k) => focus.includes(k) ? '' : 'fade';
  return `<div class="phone"><div class="island"></div><div class="time">9:41</div>
  <div class="test ${f('top')}">TEST</div><div class="${f('tools')}">${icons}</div>
  <div class="brand ${f('top')}">LOCK IN</div><div class="pair ${f('top')}">PAIR A PC</div>
  <div class="clock ${f('clock')}" style="--fill:${o.fill ?? '50%'}"><div class="ring"></div><div class="digits">${o.digits ?? '45:00'}</div><div class="ready">${o.ready ?? 'READY'}</div></div>
  <div class="working ${f('work')}"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="10" rx="2" fill="#1B1B1B"/><rect x="7" y="3.5" width="6" height="3.5" rx="1" fill="none" stroke="#1B1B1B" stroke-width="1.8"/></svg>WORKING ON <b>${o.task ?? 'PICK ONE'}</b> ▾</div>
  <div class="mlab ${f('mins')}">MINUTES</div>
  <div class="mins ${f('mins')}">${(o.mins ?? [15,25,'*45',60,90]).map(m => String(m).startsWith('*') ? `<b>${String(m).slice(1)}</b>` : `<span>${m}</span>`).join('')}</div>
  <div class="locked ${f('go')}">LOCKED MODE</div>
  <div class="go ${f('go')}">${o.hold ? '<div class="hold"></div>' : ''}<span>${o.goText ?? 'LOCK IN'}</span></div>
  <div class="home"></div>${extra}</div>`;
};
// pose: tilt (deg), squash (sx/sy), lines (motion lines), sparks (stars around the head)
const lines = `<svg style="left:14px;top:46px" width="30" height="70"><path d="M24 6 L6 2 M26 30 L2 30 M24 54 L6 60" stroke="#1B1B1B" stroke-width="3.5" stroke-linecap="round" fill="none"/></svg>`;
const star = (x,y,s) => `<svg style="left:${x}px;top:${y}px" width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0 L12.4 7.6 L20 10 L12.4 12.4 L10 20 L7.6 12.4 L0 10 L7.6 7.6 Z" fill="#FFB511" stroke="#1B1B1B" stroke-width="1.4"/></svg>`;
const sparks = star(20,14,24) + star(160,6,18) + star(180,56,13);
const guide = (x, y, brain, small, head, text, pose = {}, bw = 205, bm = 112) =>
  `<div class="guide" style="left:${x}px;top:${y}px;--bw:${bw}px;--bm:${bm}px;--tilt:${pose.tilt ?? 0}deg;--sx:${pose.sx ?? 1};--sy:${pose.sy ?? 1}"><div class="who"><img src="${A}brain-${brain}.png">${pose.lines ? lines : ''}${pose.sparks ? sparks : ''}</div><div class="bubble">${small ? `<small>${small}</small>` : ''}${head ? `<b>${head}</b>` : ''}${text}</div></div>`;
const cheer = (x,y,t,r=-8) => `<div class="cheer" style="left:${x}px;top:${y}px;--r:${r}deg">${t}</div>`;
const confetti = () => { let h=''; const c=['#3255A4','#FFB511','#1B1B1B','#D25A44']; for(let i=0;i<46;i++){const x=(i*83)%380+5, y=(i*137)%560+60, r=(i*47)%180, k=c[i%4]; h+= i%3===0 ? `<circle cx="${x}" cy="${y}" r="${3+(i%3)}" fill="${k}"/>` : `<rect x="${x}" y="${y}" width="${5+(i%4)}" height="${11+(i%5)}" fill="${k}" transform="rotate(${r} ${x} ${y})"/>`;} return `<svg class="confetti" viewBox="0 0 390 844">${h}</svg>`; };
const loop = (x, y, w, h) => `<svg class="loop" style="left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="M${w*0.55} ${h*0.06} C ${w*0.98} ${h*0.02}, ${w*1.02} ${h*0.92}, ${w*0.5} ${h*0.96} C ${w*0.02} ${h*1.0}, ${-w*0.01} ${h*0.08}, ${w*0.46} ${h*0.04} C ${w*0.6} ${h*0.02}, ${w*0.7} ${h*0.08}, ${w*0.74} ${h*0.14}"/></svg>`;
const tap = (x, y) => `<div class="tapdot" style="left:${x}px;top:${y}px"></div>`;
const skip = `<div class="skip">SKIP</div>`;
const after = {task:'STUDYING', mins:[15,'*25',45,60,90], digits:'25:00'};

const frames = [
 ['1 · Hello', screen([], `<div class="hello"><div class="who" style="position:relative"><img src="${A}brain-excited.png" style="width:230px;transform:rotate(-6deg)">${lines}</div><h1>Hey! I'm<br>your <em>brain.</em><br>Let's train.</h1><p>One real session. I'll coach you the whole way.</p><div class="cta">LET'S GO!</div></div>`)],
 ['2 · Working on', screen(['work'], `${skip}${loop(60,522,270,74)}${tap(300,546)}${guide(0,280,'fresh','1 / 4','First up!','What are we crushing today?',{tilt:8,lines:true})}`)],
 ['3 · Pick it', screen(['work'], `<div class="scrim"></div><div class="sheet"><h4>Working on</h4><div class="chips"><div class="chip on">Studying</div><div class="chip">Homework</div><div class="chip">Coding</div><div class="chip">Reading</div><div class="chip">Art</div><div class="chip new">+ New</div></div></div>${cheer(30,160,'YES!',-10)}${guide(0,190,'excited','','Studying!',"I love it. I'll remember.",{tilt:-6,sparks:true},190,96)}`)],
 ['4 · How long', screen(['mins'], `${skip}${loop(66,604,80,78)}${tap(112,628)}${guide(0,346,'fresh','2 / 4','Try 25.','Short and strong!',{tilt:-5,sx:1.04,sy:.96})}`, {task:'STUDYING'})],
 ['5 · Your tools', screen(['tools'], `${skip}<div class="sticker" style="left:224px;top:112px;--r:-5deg">GOAL</div><div class="sticker" style="left:277px;top:114px;--r:3deg">KEYS</div><div class="sticker" style="left:326px;top:112px;--r:-4deg">APPS</div>${guide(0,150,'fresh','3 / 4','Ooh, tools!','Tap any time.',{tilt:10,lines:true})}`, after)],
 ['6 · Hold to start', screen(['go'], `${skip}${loop(16,738,358,86)}${guide(0,488,'excited','4 / 4','Hold it…','…and LOCK IN!',{tilt:-4,sx:1.06,sy:.94,sparks:true})}`, {...after, hold:true, goText:'HOLD…'})],
 ['7 · First win', screen(['clock','work'], `${confetti()}<div class="stamp"><b>FIRST LOCK-IN</b><i>DAY 1 · STUDYING</i></div>${guide(0,560,'excited','','WE DID IT!','Day 1. Same time tomorrow?',{tilt:-8,sparks:true,lines:true},190,96)}`, {...after, digits:'24:58', ready:'LOCKED', fill:'99.8%', goText:'END SESSION'})],
];
document.write(frames.map(([c, h]) => `<div class="col"><div class="cap">${c}</div>${h}</div>`).join(''));
</script>
</body></html>
