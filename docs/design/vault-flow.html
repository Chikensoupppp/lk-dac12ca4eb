<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide 3 vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat+Brush&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #E7E8E3; --ink: #1B1B1B; --blue: #3255A4; --sun: #FFB511; --red: #D25A44; --card: #F4F4F0; --white: #FBFBF7; --navy: #12203F; }
body { margin: 0; background: #cfd0cb; display: flex; gap: 40px; padding: 40px; font-family: Inter, sans-serif; color: var(--ink); }
.ph { width: 390px; height: 844px; border-radius: 44px; overflow: hidden; position: relative; background: var(--paper); box-shadow: 0 20px 40px rgba(0,0,0,.18); flex: none; }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(27,27,27,.06) 1px, transparent 1.4px); background-size: 7px 7px; }
.blob { position: absolute; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(closest-side, rgba(27,27,27,.055), rgba(27,27,27,0)); }
.a { position: absolute; }
.chrome { position: absolute; left: 24px; right: 24px; top: 70px; z-index: 2; }
.prog { display: flex; gap: 3px; } .prog i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.18); } .prog i.on { background: var(--ink); }
.back { font-size: 26px; margin-top: 12px; height: 30px; }
.tag { display: flex; gap: 7px; align-items: center; font: 700 11px/1 'IBM Plex Mono', monospace; letter-spacing: 1.4px; color: var(--blue); margin-top: 8px; }
.tag b { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
h1 { margin: 10px 0 0; font: 400 46px/.95 Anton, sans-serif; text-transform: uppercase; }
.btn { position: absolute; left: 24px; right: 24px; bottom: 72px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--paper); font: 800 19px/60px Inter, sans-serif; letter-spacing: 2px; text-align: center; box-shadow: 0 4px 0 var(--blue); }
.not { position: absolute; left: 0; right: 0; bottom: 32px; text-align: center; font: 600 15px Inter, sans-serif; color: rgba(27,27,27,.65); }
.bubble { position: absolute; background: #fff; border: 2px solid var(--ink); border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); padding: 7px 13px 8px; font: 400 20px/1.05 'Caveat Brush', cursive; white-space: nowrap; }
.bubble span { display: inline-block; }
.brain { position: absolute; width: 100px; height: 86px; object-fit: contain; }
.cap { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: 700 11px/1 'IBM Plex Mono', monospace; letter-spacing: 1.2px; color: rgba(27,27,27,.45); }
.mono { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
/* vault */
.stage { position: absolute; inset: 0; transform-origin: 195px 380px; }
.rays { position: absolute; left: -105px; top: 80px; width: 600px; height: 600px; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,181,17,.42) 0deg 7deg, rgba(255,181,17,0) 7deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 14%, transparent 60%); mask-image: radial-gradient(circle, #000 14%, transparent 60%); }
.safe { left: 50px; top: 258px; width: 290px; height: 244px; perspective: 1100px; perspective-origin: 50% 50%; }
.frame { position: absolute; inset: 0; box-sizing: border-box; background: linear-gradient(160deg, #3D62B4, #2B4C99); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 7px 0 var(--ink); }
.inside { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; border-radius: 12px; overflow: hidden; border: 3px solid var(--ink);
  background: radial-gradient(circle at 50% 48%, rgba(255,181,17,.75), rgba(255,181,17,.12) 45%, rgba(255,181,17,0) 70%), var(--navy); }
.shelf { position: absolute; left: 0; right: 0; bottom: 34px; height: 6px; background: var(--ink); }
.bar { position: absolute; bottom: 40px; width: 34px; height: 14px; background: linear-gradient(180deg, #FFD66B, #E79E00); border: 2px solid var(--ink); clip-path: polygon(14% 0, 86% 0, 100% 100%, 0 100%); }
.card { position: absolute; left: 50%; top: 46px; width: 170px; margin-left: -85px; background: var(--white); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 0 9px; text-align: center; box-shadow: 0 0 34px rgba(255,214,107,.95); }
.door { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; transform-origin: 0 50%; transform-style: preserve-3d; }
.front, .backf { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; }
.front { box-sizing: border-box; border: 3px solid var(--ink); background: linear-gradient(155deg, #5079CF, #3255A4 55%, #2A4A92); }
.front .ring { position: absolute; inset: 10px; border-radius: 8px; border: 2px solid rgba(27,27,27,.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.12); }
.backf { background: #20396F; border: 3px solid var(--ink); box-sizing: border-box; transform: translateZ(-16px) rotateY(180deg); }
.edge { position: absolute; top: 0; bottom: 0; left: 100%; width: 16px; background: linear-gradient(90deg, #233F7E, #172D5C); border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); box-sizing: border-box; transform-origin: 0 50%; transform: rotateY(90deg); }
.edge2 { position: absolute; top: 0; bottom: 0; left: 0; width: 16px; background: #172D5C; transform-origin: 0 50%; transform: rotateY(90deg); }
.rivet { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9DB2E2, #1B1B1B 70%); }
.dial { position: absolute; left: 22px; top: 48px; width: 112px; height: 112px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); box-sizing: border-box; box-shadow: 0 4px 0 rgba(27,27,27,.5); }
.dial i { position: absolute; left: 52px; top: 3px; width: 2px; background: var(--ink); transform-origin: 1px 50px; }
.dial .knob { position: absolute; left: 33px; top: 33px; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE08A, #FFB511 55%, #C98800); border: 3px solid var(--ink); box-sizing: border-box; }
.dial .grip { position: absolute; left: 51px; top: 36px; width: 4px; height: 14px; border-radius: 2px; background: var(--ink); }
.mark { position: absolute; left: 71px; top: 34px; width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 11px solid var(--sun); filter: drop-shadow(0 1px 0 #1B1B1B); }
.wheel { position: absolute; left: 136px; top: 56px; width: 96px; height: 96px; }
.wheel b { position: absolute; left: 44px; top: 0; width: 8px; height: 96px; border-radius: 4px; background: var(--ink); }
.wheel s { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE08A, #FFB511 55%, #C98800); border: 2px solid var(--ink); box-sizing: border-box; }
.wheel u { position: absolute; left: 34px; top: 34px; width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE08A, #FFB511 55%, #C98800); border: 3px solid var(--ink); box-sizing: border-box; }
.bolt { position: absolute; left: 240px; width: 30px; height: 14px; border-radius: 3px; background: linear-gradient(180deg, #E5E8EE, #A9AFBC); border: 2px solid var(--ink); box-sizing: border-box; }
.leak { position: absolute; top: 18px; bottom: 18px; width: 6px; border-radius: 3px; background: #FFE9A8; box-shadow: 0 0 14px 6px rgba(255,200,60,.9); }
.spark { position: absolute; width: 16px; height: 16px; background: var(--sun); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
.mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #FFD66B; }
.click { position: absolute; font: 400 18px/1 'Caveat Brush', cursive; }
.foot { position: absolute; top: 502px; width: 34px; height: 10px; background: var(--ink); border-radius: 0 0 4px 4px; }
.pic { position: absolute; left: 56px; width: 278px; background: #F2F2F2; border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 7px 0 var(--ink); text-align: center; overflow: hidden; transform: rotate(-2deg); }
.pic .t { padding: 12px 16px 10px; font: 600 13.5px/1.25 -apple-system, Inter, sans-serif; }
.pic .r { display: flex; border-top: 1px solid #C8C8C8; font: 400 15px/1 -apple-system, Inter, sans-serif; color: #0A62D8; }
.pic .r div { flex: 1; padding: 12px 0; } .pic .r div:first-child { font-weight: 600; } .pic .r div:last-child { border-left: 1px solid #C8C8C8; }
.real { position: absolute; left: 60px; width: 270px; top: 300px; background: rgba(242,242,242,.97); border-radius: 14px; text-align: center; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.real .t { padding: 18px 16px 4px; font: 600 16px/1.25 -apple-system, Inter, sans-serif; }
.real .d { padding: 0 16px 16px; font: 400 12.5px/1.3 -apple-system, Inter, sans-serif; color: #333; }
.real .r { display: flex; border-top: 1px solid #C8C8C8; font: 400 16px/1 -apple-system, Inter, sans-serif; color: #0A7AFF; }
.real .r div { flex: 1; padding: 13px 0; } .real .r div:first-child { font-weight: 600; border-right: 1px solid #C8C8C8; }
.finger { width: 40px; height: 40px; border-radius: 50%; background: rgba(50,85,164,.28); border: 3px solid var(--blue); box-sizing: border-box; }
.stamp { padding: 6px 12px; border: 3px solid var(--blue); border-radius: 8px; color: var(--blue); background: rgba(251,251,247,.94); font: 400 22px/1 Anton, sans-serif; letter-spacing: 1px; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const BRAIN = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";
const T = 9.5;
function bez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; } return sy(Math.min(1, Math.max(0, t))); };
}
const EO = bez(0.23, 1, 0.32, 1), EIO = bez(0.77, 0, 0.175, 1), DR = bez(0.32, 0.72, 0, 1);
const seg = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6 * p) * Math.cos(10 * p);
const lerp = (a, b, p) => a + (b - a) * p;
const bump = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));
const shake = (t, a) => { const q = t - a; return q > 0 && q < 0.35 ? Math.exp(-12 * q) * Math.sin(60 * q) : 0; };

const prog = n => Array.from({length: 13}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
const SPARKS = [[40, 250], [330, 240], [20, 420], [350, 430], [90, 220], [290, 520], [70, 530], [190, 205], [345, 330], [30, 330]];
function vault() {
  const rivets = [[12, 12], [234, 12], [12, 186], [234, 186], [123, 12], [123, 186]];
  return `<div class="stage" data-stage>
    <div class="rays" data-rays></div>
    <div class="a safe">
      <div class="frame"></div>
      <div class="inside">
        <div class="card" data-card><div class="mono" style="font-size:9.5px;letter-spacing:1.2px;color:#45473F">YOUR TIME A DAY</div><div style="font:400 44px/1 Anton,sans-serif;color:var(--blue);margin-top:4px">?H ??M</div></div>
        <div class="shelf"></div>
        <div class="bar" style="left:44px"></div><div class="bar" style="left:84px"></div><div class="bar" style="left:64px;bottom:54px"></div>
        <div class="bar" style="left:168px"></div><div class="bar" style="left:208px"></div>
      </div>
      <div class="leak" data-leak style="left:268px"></div>
      <div class="door" data-door>
        <div class="edge2"></div>
        <div class="front">
          <div class="ring"></div>
          ${rivets.map(([x, y]) => `<div class="rivet" style="left:${x}px;top:${y}px"></div>`).join('')}
          <div class="mark"></div>
          <div class="dial" data-dial>${Array.from({length: 40}, (_, i) => `<i style="transform:rotate(${i * 9}deg);height:${i % 5 ? 6 : 12}px"></i>`).join('')}<div class="knob"></div><div class="grip"></div></div>
          <div class="wheel" data-wheel><b></b><b style="transform:rotate(60deg)"></b><b style="transform:rotate(120deg)"></b>
            ${[0, 60, 120, 180, 240, 300].map(a => { const r = a * Math.PI / 180; return `<s style="left:${(48 + 46 * Math.sin(r) - 8).toFixed(1)}px;top:${(48 - 46 * Math.cos(r) - 8).toFixed(1)}px"></s>`; }).join('')}<u></u></div>
          ${[30, 98, 166].map(y => `<div class="bolt" data-bolt style="top:${y}px"></div>`).join('')}
        </div>
        <div class="edge"></div>
        <div class="backf"></div>
      </div>
      <div class="a" style="left:-9px;top:44px;width:11px;height:34px;background:var(--ink);border-radius:3px"></div>
      <div class="a" style="left:-9px;top:166px;width:11px;height:34px;background:var(--ink);border-radius:3px"></div>
    </div>
    <div class="foot" style="left:78px"></div><div class="foot" style="left:278px"></div>
    ${SPARKS.map(() => `<div class="spark" data-spark></div>`).join('')}
    ${Array.from({length: 16}, () => `<div class="mote" data-mote></div>`).join('')}
  </div>`;
}
const chrome = (n, tag, title) => `<div class="a" style="inset:-80px"><div class="blob" style="left:-40px;top:120px"></div><div class="blob" style="left:180px;top:420px"></div><div class="blob" style="left:40px;top:700px"></div></div><div class="dots"></div>
  <div class="chrome"><div class="prog">${prog(n)}</div><div class="back">‹</div><div class="tag"><b></b>${tag}</div><h1>${title}</h1></div>`;
const bubble = (a, b) => `<img class="brain" data-brain src="${BRAIN}" style="left:6px;top:500px"><div class="bubble" data-bub style="left:100px;top:526px"><span data-b1>${a}</span><span data-b2 style="position:absolute;left:13px;top:7px">${b}</span></div>`;

document.getElementById('stage').outerHTML = `
<div class="ph" id="A">
  <div class="a" data-page style="inset:0">
    ${chrome(3, 'ALLOW SCREEN TIME', 'Your number’s<br>in here.')}
    ${vault()}
    ${[0, 1, 2].map(i => `<div class="click" data-click style="left:${[20, 26, 16][i]}px;top:${[300, 340, 380][i]}px">click</div>`).join('')}
    ${bubble('Only you have the key.', 'Your number’s next!')}
    <div class="pic" style="top:600px"><div class="t">“SwipeLater” Would Like to Access Screen Time</div><div class="r"><div>Continue</div><div>Don’t Allow</div></div></div>
    <svg class="a" width="160" height="56" viewBox="0 0 160 56" style="left:44px;top:646px;overflow:visible"><path data-ring d="M18 30 C 20 10, 140 4, 150 24 C 158 44, 36 54, 14 38 C 6 31, 22 16, 46 14" fill="none" stroke="#D25A44" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray="1"/></svg>
    <div class="btn" data-btn>OPEN IT</div><div class="not">Not now</div>
  </div>
  <div class="a" data-dim style="inset:0;background:rgba(0,0,0,.32)"></div>
  <div class="real" data-real><div class="t">“SwipeLater” Would Like to Access Screen Time</div><div class="d">Providing “SwipeLater” access to Screen Time may allow it to see your activity data, restrict content, and limit the usage of apps and websites.</div><div class="r"><div data-rcont>Continue</div><div>Don’t Allow</div></div></div>
  <div class="a" data-next style="inset:0;background:var(--paper)"><div class="chrome"><div class="prog">${prog(4)}</div><div class="back">‹</div><div class="tag"><b></b>YOUR REAL NUMBER</div><h1>Here’s your<br>real week.</h1></div></div>
  <div class="a" data-ripple style="left:0;top:0;width:40px;height:40px;border-radius:50%;border:3px solid var(--blue);box-sizing:border-box"></div>
  <div class="a finger" data-finger style="left:0;top:0"></div>
  <div class="cap" data-cap></div>
</div>
<div class="ph" id="B">
  <div class="a" data-page style="inset:0">
    ${chrome(3, 'SCREEN TIME IS ON', 'Already<br>unlocked.')}
    ${vault()}
    <div class="a stamp" data-stamp style="left:178px;top:470px">ALREADY OPEN</div>
    ${bubble('Unlocking…', 'You gave me the key already.')}
    <div class="a mono" style="left:24px;right:24px;top:624px;text-align:center;font-size:12.5px;line-height:1.4;color:#45473F;font-weight:600">Your real week is ready.<br>It never leaves your iPhone.</div>
    <div class="btn" data-btn>SEE MY NUMBER</div>
  </div>
  <div class="cap">IF SCREEN TIME IS ALREADY ON</div>
</div>`;

const q = (id, s) => document.querySelector(`#${id} [${s}]`), qa = (id, s) => [...document.querySelectorAll(`#${id} [${s}]`)];

// One vault, driven by a plain state object.
function drawVault(id, t, v) {
  q(id, 'data-stage').style.transform = `translateX(${(3 * v.shake).toFixed(2)}px) scale(${v.push.toFixed(4)})`;
  q(id, 'data-dial').style.transform = `rotate(${v.dial.toFixed(1)}deg)`;
  q(id, 'data-wheel').style.transform = `rotate(${v.wheel.toFixed(1)}deg)`;
  qa(id, 'data-bolt').forEach(b => b.style.transform = `translateX(${(-22 * v.bolts).toFixed(1)}px)`);
  q(id, 'data-door').style.transform = `rotateY(${v.door.toFixed(2)}deg)`;
  const leak = q(id, 'data-leak'); leak.style.opacity = v.leak.toFixed(2); leak.style.transform = `translateX(${(-4 * v.leak).toFixed(1)}px) scaleY(${(0.6 + 0.4 * v.leak).toFixed(2)})`;
  const rays = q(id, 'data-rays'); rays.style.opacity = v.rays.toFixed(3); rays.style.transform = `rotate(${(t * 14).toFixed(1)}deg) scale(${(0.7 + 0.3 * v.rays).toFixed(3)})`;
  q(id, 'data-card').style.transform = `translateY(${(16 * (1 - v.card)).toFixed(1)}px) scale(${(0.9 + 0.1 * v.card).toFixed(3)})`;
  qa(id, 'data-spark').forEach((s, i) => {
    const a = v.sparkAt + i * 0.09, p = seg(t, a, a + 0.6);
    const [x, y] = SPARKS[i];
    s.style.opacity = p > 0 && p < 1 && v.sparkOn ? Math.sin(Math.PI * p).toFixed(2) : 0;
    s.style.transform = `translate(${x}px, ${y}px) rotate(${(p * 90).toFixed(0)}deg) scale(${(0.4 + 0.9 * Math.sin(Math.PI * p)).toFixed(2)})`;
  });
  qa(id, 'data-mote').forEach((m, i) => {
    const ang = -1.2 + (i / 15) * 2.4 + (i % 3) * 0.1, sp = 60 + (i * 37) % 70, a = v.sparkAt - 0.3 + (i % 5) * 0.08;
    const p = seg(t, a, a + 1.6);
    m.style.opacity = p > 0 && p < 1 && v.sparkOn ? (0.9 * (1 - p)).toFixed(2) : 0;
    m.style.transform = `translate(${(250 + Math.cos(ang) * sp * p * 1.6).toFixed(1)}px, ${(380 + Math.sin(ang) * sp * p * 1.6 - 30 * p).toFixed(1)}px)`;
  });
}
function idle() { return { shake: 0, push: 1, dial: 0, wheel: 0, bolts: 0, door: 0, leak: 0, rays: 0, card: 0, sparkAt: 99, sparkOn: false }; }

// The opening, from `o` seconds: wheel spins, bolts slide back, the door clunks ajar
// (light leaks out), then swings wide on the drawer curve while the camera pushes in.
function opening(v, t, o, close) {
  v.wheel = 300 * EIO(seg(t, o, o + 0.6));
  v.bolts = EO(seg(t, o + 0.5, o + 0.75));
  const ajar = -7 * spring(seg(t, o + 0.8, o + 1.2));
  const swing = DR(seg(t, o + 1.25, o + 2.2));
  v.door = lerp(ajar, -104, swing);
  v.shake += shake(t, o + 0.8) * 1.2;
  v.leak = seg(t, o + 0.8, o + 0.95) * (1 - seg(t, o + 1.4, o + 1.8));
  v.push = 1 + 0.06 * EIO(seg(t, o + 0.8, o + 1.8)) - 0.03 * EIO(seg(t, o + 1.8, o + 2.6));
  v.rays = EO(seg(t, o + 1.25, o + 2.0));
  v.card = spring(seg(t, o + 1.6, o + 2.3));
  v.sparkAt = o + 1.7; v.sparkOn = true;
  if (close != null) {
    const c = EIO(seg(t, close, close + 0.7));
    v.door = lerp(v.door, 0, c); v.rays *= 1 - c; v.card *= 1 - c; v.push = lerp(v.push, 1, c);
    v.wheel = lerp(v.wheel, 0, seg(t, close + 0.6, close + 0.9)); v.bolts *= 1 - seg(t, close + 0.6, close + 0.8);
    if (t > close) v.sparkOn = false;
  }
  return v;
}

function swapBubble(id, p) {
  const b1 = q(id, 'data-b1'), b2 = q(id, 'data-b2');
  b1.style.opacity = 1 - p; b1.style.filter = `blur(${(p * 2).toFixed(2)}px)`; b2.style.opacity = p; b2.style.filter = `blur(${((1 - p) * 2).toFixed(2)}px)`;
  q(id, 'data-bub').style.width = lerp(b1.offsetWidth, b2.offsetWidth, EIO(p)).toFixed(1) + 'px';
}
function blobs(id, t) {
  const a = 2 * Math.PI * t / T;
  document.querySelectorAll(`#${id} .blob`).forEach((b, i) => { const r = 26 + i * 8, ph = a + i * 2.1; b.style.transform = `translate(${(r * Math.cos(ph)).toFixed(1)}px, ${(r * Math.sin(ph)).toFixed(1)}px)`; });
}

const TAP1 = 1.2, ASK = 2.55, TAP2 = 3.8, OPEN = 4.25, NEXT = 7.7, RESET = 9.0;
function frameA(t) {
  blobs('A', t);
  const v = idle();
  // Combination while iPhone's box comes up: right, left, right, a click and a jolt at each stop.
  v.dial = 300 * EIO(seg(t, 1.3, 1.75)) - 200 * EIO(seg(t, 1.8, 2.15)) + 80 * EIO(seg(t, 2.2, 2.45));
  [1.75, 2.15, 2.45].forEach(c => v.shake += shake(t, c) * 0.6);
  qa('A', 'data-click').forEach((c, i) => {
    const p = seg(t, [1.75, 2.15, 2.45][i], [1.75, 2.15, 2.45][i] + 0.45);
    c.style.opacity = p > 0 && p < 1 ? (1 - p).toFixed(2) : 0;
    c.style.transform = `translateY(${(-12 * EO(p)).toFixed(1)}px) rotate(-8deg)`;
  });
  if (t >= OPEN) opening(v, t, OPEN, null);
  if (t > RESET) v.dial = 0;
  drawVault('A', t, v);

  const press = bump(t, TAP1, 0.16);
  q('A', 'data-btn').style.transform = `scale(${(1 - 0.03 * press).toFixed(3)})`;
  const rp = EO(seg(t, 0.3, 0.8));
  q('A', 'data-ring').style.strokeDashoffset = (1 - rp).toFixed(3); q('A', 'data-ring').style.opacity = rp > 0 ? 1 : 0;

  const ain = EO(seg(t, ASK, ASK + 0.3)), aout = EO(seg(t, TAP2 + 0.15, TAP2 + 0.35));
  q('A', 'data-real').style.opacity = (ain * (1 - aout)).toFixed(3);
  q('A', 'data-real').style.transform = `scale(${(1.08 - 0.08 * ain - 0.03 * aout).toFixed(3)})`;
  q('A', 'data-dim').style.opacity = (ain * (1 - aout)).toFixed(3);
  q('A', 'data-rcont').style.background = `rgba(0,0,0,${(0.08 * seg(t, TAP2, TAP2 + 0.05) * (1 - aout)).toFixed(3)})`;

  const btn = [175, 722], cont = [107, 438];
  const g1 = EIO(seg(t, 0.6, TAP1)), g2 = EIO(seg(t, TAP1 + 0.5, TAP2 - 0.05)), g3 = EIO(seg(t, TAP2 + 0.3, TAP2 + 0.9));
  const fx = lerp(lerp(lerp(260, btn[0], g1), cont[0], g2), 300, g3), fy = lerp(lerp(lerp(900, btn[1], g1), cont[1], g2), 930, g3);
  const fp = Math.max(bump(t, TAP1, 0.18), bump(t, TAP2, 0.18));
  q('A', 'data-finger').style.transform = `translate(${fx.toFixed(1)}px, ${fy.toFixed(1)}px) scale(${(1 - 0.14 * fp).toFixed(3)})`;
  const r1 = seg(t, TAP1, TAP1 + 0.5), r2 = seg(t, TAP2, TAP2 + 0.5), rr = r2 > 0 ? r2 : r1, rpos = r2 > 0 ? cont : btn;
  q('A', 'data-ripple').style.transform = `translate(${rpos[0]}px, ${rpos[1]}px) scale(${(1 + 1.4 * EO(rr)).toFixed(3)})`;
  q('A', 'data-ripple').style.opacity = rr > 0 && rr < 1 ? (0.7 * (1 - rr)).toFixed(2) : 0;

  const hop = bump(t, OPEN + 1.8, 0.4);
  q('A', 'data-brain').style.transform = `translateY(${(-3 * Math.sin(2 * Math.PI * t / 1.5) - 18 * hop).toFixed(1)}px) rotate(${(-4 + 6 * hop).toFixed(1)}deg)`;
  swapBubble('A', seg(t, OPEN + 1.8, OPEN + 1.98) * (1 - seg(t, RESET, RESET + 0.2)));

  const nx = EIO(seg(t, NEXT, NEXT + 0.45)) * (t > RESET ? 0 : 1);
  q('A', 'data-next').style.transform = `translateX(${((1 - nx) * 390).toFixed(1)}px)`;
  q('A', 'data-next').style.opacity = nx > 0 ? 1 : 0;
  q('A', 'data-page').style.transform = `translateX(${(-nx * 120).toFixed(1)}px)`;
  q('A', 'data-page').style.opacity = ((1 - nx) * (t > RESET ? EO(seg(t, RESET, T)) : 1)).toFixed(3);
  const caps = [[0, TAP1, 'SLIDE 3'], [TAP1, ASK, 'TAP OPEN IT · THE DIAL SPINS'], [ASK, TAP2 + 0.3, 'IPHONE ASKS (THE REAL BOX)'], [TAP2 + 0.3, NEXT, 'THE VAULT OPENS'], [NEXT, T, 'SLIDE 4: YOUR REAL NUMBER']];
  q('A', 'data-cap').textContent = (caps.find(c => t >= c[0] && t < c[1]) || caps[0])[2];
}

function frameB(t) {
  blobs('B', t);
  // Already allowed: the vault opens by itself as the slide arrives.
  const v = opening(idle(), t, 0.6, 8.4);
  drawVault('B', t, v);
  const st = spring(seg(t, 2.9, 3.5)) * (1 - seg(t, 8.3, 8.5));
  const s = q('B', 'data-stamp'); s.style.opacity = (seg(t, 2.9, 2.95) * (1 - seg(t, 8.3, 8.5))).toFixed(2);
  s.style.transform = `rotate(-9deg) scale(${(1.25 - 0.25 * st).toFixed(3)})`;
  const hop = bump(t, 2.4, 0.4);
  q('B', 'data-brain').style.transform = `translateY(${(-3 * Math.sin(2 * Math.PI * t / 1.5) - 18 * hop).toFixed(1)}px) rotate(${(-4 + 6 * hop).toFixed(1)}deg)`;
  swapBubble('B', seg(t, 2.4, 2.58) * (1 - seg(t, 8.6, 8.8)));
}

window.render = t => { t = ((t % T) + T) % T; frameA(t); frameB(t); };
if (!new URLSearchParams(location.search).has('still')) { const t0 = performance.now(); const loop = n => { window.render((n - t0) / 1000); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
document.fonts.ready.then(() => { window.render(0); window.ready = true; });
</script>
</body>
</html>
