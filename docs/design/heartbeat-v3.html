<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=block" rel="stylesheet">
<style>
  /* SwipeLater slide 5, "your brain over one day", v3. Paper chart, one ink line drawn across the day,
     the brain is the pen. Each app that pulls you in drops onto the line as a sticker and the beat
     speeds up after it. Ends on one "you are here" finding. Deterministic: render(t) per phone.
     Borrowed: the day-long line with event markers (Whoop / Apple Health heart rate), the count-up
     number (Opal's onboarding), EKG chart paper. */
  :root { --page:#E7E8E3; --ink:#1B1B1B; --blue:#3255A4; --sun:#FFB511; --soft:#62645E; --card:#F4F4F0; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #CFD0CA; font-family: Inter, system-ui, sans-serif; }
  .row { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .phone { position: relative; width: 393px; height: 852px; background: var(--page); overflow: hidden; border-radius: 44px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  .bars { position: absolute; top: 62px; left: 24px; right: 24px; display: flex; gap: 3px; }
  .bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(27,27,27,.16); }
  .bars i.on { background: var(--ink); }
  .back { position: absolute; top: 80px; left: 18px; width: 44px; height: 44px; display: grid; place-items: center; }
  h1 { position: absolute; left: 24px; top: 132px; font: 400 50px/.98 Anton, Impact, sans-serif; color: var(--ink); text-transform: uppercase; }
  .lede { position: absolute; left: 24px; right: 30px; top: 245px; font: 700 17px/1.3 Inter, sans-serif; font-stretch: condensed; color: rgba(27,27,27,.82); }

  .card { position: absolute; left: 20px; right: 20px; top: 300px; height: 284px; border-radius: 24px; background: var(--card);
          border: 2px solid var(--ink); box-shadow: 0 5px 0 var(--ink); overflow: visible; }
  .card canvas { position: absolute; left: 0; top: 0; }
  .hr { position: absolute; left: 18px; top: 14px; }
  .hr small, .tod small { display: block; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.6px; color: var(--soft); }
  .hr b { display: inline-block; font: 400 48px/1 Anton, Impact, sans-serif; color: var(--ink); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .hr em { font: 700 12px/1 "IBM Plex Mono", monospace; font-style: normal; color: var(--ink); margin-left: 4px; }
  .heart { position: absolute; left: 112px; top: 34px; width: 22px; height: 22px; }
  .tod { position: absolute; right: 18px; top: 14px; text-align: right; }
  .tod b { display: block; font: 700 18px/1 "IBM Plex Mono", monospace; color: var(--ink); margin-top: 8px; }
  .sticker { position: absolute; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
             box-shadow: 0 3px 0 rgba(27,27,27,.9), 0 8px 14px rgba(27,27,27,.18); border: 2px solid var(--ink); }
  .sticker svg { width: 18px; height: 18px; }
  .tag { display: none; position: absolute; font: 700 10px/1 "IBM Plex Mono", monospace; color: var(--blue); white-space: nowrap; }
  .pen { position: absolute; width: 84px; z-index: 2; }
  .pen img { width: 100%; display: block; }
  .pen svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  .status { position: absolute; left: 24px; right: 24px; top: 612px; font: 400 30px/1.02 Anton, Impact, sans-serif; text-transform: uppercase; color: var(--ink); }
  .phoneTime { position: absolute; left: 24px; top: 686px; font: 600 12px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: var(--soft); }
  .phoneTime b { color: var(--ink); }

  .find { position: absolute; left: 20px; right: 20px; top: 598px; padding: 12px 14px 10px; border-radius: 18px; background: #fff;
          box-shadow: 0 10px 24px rgba(27,27,27,.14); }
  .find .you { display: inline-flex; align-items: center; gap: 6px; font: 700 10px/1 "IBM Plex Mono", monospace; letter-spacing: 1.4px; color: #fff; background: var(--blue); padding: 6px 9px; border-radius: 999px; }
  .find p { font: 700 14.5px/1.3 Inter, sans-serif; font-stretch: condensed; color: var(--ink); margin-top: 9px; }
  .find small { display: block; font: 500 10px/1.35 "IBM Plex Mono", monospace; color: var(--soft); margin-top: 7px; }

  .next { position: absolute; left: 24px; right: 24px; bottom: 40px; height: 60px; border-radius: 30px; background: var(--ink); color: var(--page);
          display: grid; place-items: center; font: 800 19px/1 Inter, sans-serif; letter-spacing: 2px; font-stretch: condensed; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
const BANDS = [
  { title: "1–2 hours<br>a day.", lede: "A little more intentional time can go a long way.", hits: 1, stage: 1, hours: 1.5 },
  { title: "3–4 hours<br>a day.", lede: "What would you do with a little of that time back?", hits: 2, stage: 2, hours: 3.5 },
  { title: "5–6 hours<br>a day.", lede: "That’s a lot of time. How much of it is really yours to choose?", hits: 4, stage: 4, hours: 5.5 },
  { title: "7+ hours<br>a day.", lede: "You don’t have to change everything today. Start with 25 minutes.", hits: 5, stage: 5, hours: 7.5 },
];
const STATUS = ["Still in control.", "A little distracted.", "Pulled in a few directions.", "Hard to get back on track.", "Running on autopilot.", "Where did the day go?"];
const BPM = [72, 86, 101, 117, 132, 146];
const FIND = [
  { tag: "1–2H", text: "In a study of 120,000 UK teens, about 1–2 hours a day was not linked to lower well-being.", src: "Przybylski & Weinstein, Psychological Science, 2017" },
  { tag: "3H+", text: "Teens on social media more than 3 hours a day were more likely to report anxiety or depression symptoms.", src: "Riehm et al., JAMA Psychiatry, 2019" },
  { tag: "6H+", text: "In the same study, the link was stronger for teens on social media more than 6 hours a day.", src: "Riehm et al., JAMA Psychiatry, 2019" },
  { tag: "7H+", text: "Teens with 7+ hours of daily screen time were about twice as likely to have been diagnosed with anxiety or depression.", src: "Twenge & Campbell, Preventive Medicine Reports, 2018" },
];
const TILES = [
  { c: "#E5484D", g: '<path d="M7 4.5v11l9-5.5z" fill="#fff"/>' },
  { c: "#3255A4", g: '<path d="M4 6.5a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H9l-4 3v-3.2A3 3 0 0 1 4 10.5z" fill="#fff"/>' },
  { c: "#FFB511", g: '<path d="M8 15.5a2 2 0 1 1-1.6-2V5.5l8-1.8v9.8a2 2 0 1 1-1.6-2V6.8L8 8z" fill="#1B1B1B"/>' },
  { c: "#1B1B1B", g: '<rect x="3.5" y="5" width="13" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/><path d="M4 6l6 4.5L16 6" fill="none" stroke="#fff" stroke-width="2"/>' },
  { c: "#E8578E", g: '<path d="M10 16s-6-3.6-6-8a3.3 3.3 0 0 1 6-1.9A3.3 3.3 0 0 1 16 8c0 4.4-6 8-6 8z" fill="#fff"/>' },
];
const BODY = n => `../../apps/ios/BrainArt/Assets.xcassets/BrainBody${n}.imageset/BrainBody${n}.png`;
const EXACT = "../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png";

// Faces drawn over the plain bodies, in a 100x82 box (the PNG's aspect). Cute, never scary.
function face(st, t) {
  const blink = (Math.sin(t * 1.3) > 0.985) ? 0.15 : 1;
  const eye = (x) => {
    if (st <= 1) return `<ellipse cx="${x}" cy="50" rx="4.2" ry="${5.4 * blink}" fill="#3B2233"/><circle cx="${x + 1.4}" cy="48" r="1.4" fill="#fff"/>`;
    if (st === 2) return `<ellipse cx="${x}" cy="51" rx="4" ry="${4.6 * blink}" fill="#3B2233"/><circle cx="${x + 1.3}" cy="49.4" r="1.2" fill="#fff"/>`;
    if (st === 3) return `<path d="M${x - 5} 50 q5 3 10 0" stroke="#3B2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    const a = t * 6 * (x < 50 ? 1 : -1);
    return `<g transform="rotate(${a * 57} ${x} 50)"><path d="M${x} 50 m-4 0 a4 4 0 1 1 4 4 a2.4 2.4 0 1 1 -2.4 -2.4" stroke="#3B2233" stroke-width="2.2" fill="none" stroke-linecap="round"/></g>`;
  };
  const mouth = [
    '<path d="M44 59 q6 6 12 0" stroke="#3B2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    '<path d="M45 60 q5 3 10 0" stroke="#3B2233" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    '<path d="M45 61 h10" stroke="#3B2233" stroke-width="2.6" stroke-linecap="round"/>',
    '<path d="M44 62 q3 -3 6 0 q3 3 6 0" stroke="#3B2233" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
    '<ellipse cx="50" cy="61.5" rx="3.4" ry="4" fill="#3B2233"/>',
    '<path d="M43 62 q3.5 -4 7 0 q3.5 4 7 0" stroke="#3B2233" stroke-width="2.4" fill="none" stroke-linecap="round"/>',
  ][st];
  const sweat = st >= 2 ? `<path d="M78 30 q4 6 0 9 q-4 -3 0 -9z" fill="#7FB4FF" stroke="#3255A4" stroke-width="1"/>` : "";
  return `<svg viewBox="0 0 100 82">${eye(38)}${eye(62)}${mouth}${sweat}</svg>`;
}

function phoneHTML() {
  return `<div class="bars">${Array.from({ length: 13 }, (_, i) => `<i class="${i < 5 ? "on" : ""}"></i>`).join("")}</div>
  <div class="back"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2L2 10l8 8" stroke="#1B1B1B" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <h1></h1><div class="lede"></div>
  <div class="card"><canvas width="702" height="560" style="width:351px;height:280px"></canvas>
    <div class="hr"><small>HEART RATE</small><b>72</b><em>BPM</em></div>
    <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-11a4.6 4.6 0 0 1 8-2.9A4.6 4.6 0 0 1 20 10c0 6.1-8 11-8 11z" fill="#3255A4"/></svg>
    <div class="tod"><small>TIME OF DAY</small><b>8:00 AM</b></div>
    <div class="stickers"></div>
    <div class="pen"><img alt=""><div class="face"></div></div>
  </div>
  <div class="status"></div><div class="phoneTime">TIME ON PHONE · <b>0H 00M</b></div>
  <div class="find" style="opacity:0"><span class="you">YOU ARE HERE · <i></i></span><p></p><small></small></div>
  <div class="next">CONTINUE</div><div class="home"></div>`;
}

// Chart geometry inside the card (CSS px).
const CW = 351, X0 = 18, X1 = CW - 18, MID = 196, TOP = 84, BOT = 248;
const ease = x => 1 - Math.pow(1 - x, 3);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function rnd(i) { const s = Math.sin(i * 12.9898) * 43758.5453; return s - Math.floor(s); }

// The line: calm beats early; each app that lands makes the following beats faster and messier.
function lineY(x, stageAt) {
  const st = stageAt(x);
  const period = [44, 36, 29, 24, 20, 17][st];
  const amp = [30, 32, 34, 36, 38, 38][st];
  const k = Math.floor((x - X0) / period), ph = ((x - X0) / period) - k;
  const j = st >= 3 ? (rnd(k + 3) - 0.5) * 0.5 : 0;
  const skip = st >= 4 && rnd(k * 7.1) < 0.18;
  const a = skip ? amp * 0.25 : amp * (1 + j);
  let y = 0;
  if (ph > 0.12 && ph < 0.24) y -= Math.sin((ph - 0.12) / 0.12 * Math.PI) * 3;
  if (ph > 0.32 && ph < 0.37) y += (ph - 0.32) / 0.05 * 5;
  else if (ph >= 0.37 && ph < 0.42) y += 5 - (ph - 0.37) / 0.05 * (a + 5);
  else if (ph >= 0.42 && ph < 0.47) y += -a + (ph - 0.42) / 0.05 * (a * 1.35);
  else if (ph >= 0.47 && ph < 0.52) y += a * 0.35 - (ph - 0.47) / 0.05 * (a * 0.35);
  if (ph > 0.62 && ph < 0.8) y -= Math.sin((ph - 0.62) / 0.18 * Math.PI) * 6;
  const wander = st >= 3 ? Math.sin(x * 0.045) * (st - 2) * 3 : 0;
  return MID - y + wander;
}

function setup(el, band) {
  el.innerHTML = phoneHTML();
  const b = BANDS[band];
  el.querySelector("h1").innerHTML = b.title;
  el.querySelector(".lede").textContent = b.lede;
  const f = FIND[[0, 1, 2, 3][band]];
  el.querySelector(".find i").textContent = f.tag;
  el.querySelector(".find p").textContent = f.text;
  el.querySelector(".find small").textContent = f.src + ". Links, not cause and effect.";
  const st = el.querySelector(".stickers");
  // Events spread over the day, a touch uneven.
  const xs = Array.from({ length: b.hits }, (_, i) => X0 + (X1 - X0) * (0.1 + 0.7 * (b.hits === 1 ? 0.45 : i / (b.hits - 1)) + (rnd(i + band) - 0.5) * 0.05));
  xs.forEach((x, i) => {
    const s = document.createElement("div");
    s.className = "sticker";
    s.style.background = TILES[i].c;
    s.innerHTML = `<svg viewBox="0 0 20 20">${TILES[i].g}</svg>`;
    st.appendChild(s);
    const tag = document.createElement("div");
    tag.className = "tag";
    const m = Math.round(b.hours * 60 / b.hits);
    tag.textContent = `+${Math.floor(m / 60)}H ${String(m % 60).padStart(2, "0")}M`;
    st.appendChild(tag);
  });
  return { el, b, band, xs };
}

function drawPhone(p, t) {
  const { el, b, xs } = p;
  const D0 = 0.5, D1 = 6.2;            // the pen crosses the day between these seconds
  const pr = clamp((t - D0) / (D1 - D0));
  const penX = X0 + (X1 - X0) * pr;
  const finalStage = b.stage;
  const stageForHits = n => n === 0 ? 0 : Math.round(n * finalStage / b.hits);
  const stageAt = x => stageForHits(xs.filter(e => e <= x).length);
  const passed = xs.filter(e => e <= penX).length;
  const st = stageForHits(passed);

  // Canvas: EKG paper, the drawn line with a blue misprint, an unfilled dotted future.
  const cv = el.querySelector("canvas"), c = cv.getContext("2d");
  c.setTransform(2, 0, 0, 2, 0, 0);
  c.clearRect(0, 0, CW, 280);
  for (let x = X0, i = 0; x <= X1 + 0.5; x += 11.1, i++) {
    c.strokeStyle = i % 5 === 0 ? "rgba(50,85,164,.20)" : "rgba(50,85,164,.08)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, TOP); c.lineTo(x, BOT); c.stroke();
  }
  for (let y = TOP, i = 0; y <= BOT + 0.5; y += 11.33, i++) {
    c.strokeStyle = i % 5 === 0 ? "rgba(50,85,164,.20)" : "rgba(50,85,164,.08)";
    c.beginPath(); c.moveTo(X0, y); c.lineTo(X1, y); c.stroke();
  }
  c.font = "600 9.5px 'IBM Plex Mono'"; c.fillStyle = "#62645E"; c.textAlign = "center";
  ["8AM", "12PM", "4PM", "8PM", "11PM"].forEach((l, i) => c.fillText(l, X0 + (X1 - X0) * [0, 0.27, 0.53, 0.8, 1][i] + (i === 0 ? 10 : i === 4 ? -12 : 0), BOT + 18));
  c.setLineDash([2, 5]); c.strokeStyle = "rgba(27,27,27,.25)"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(penX, MID); c.lineTo(X1, MID); c.stroke(); c.setLineDash([]);
  const path = (dx, dy) => { c.beginPath(); for (let x = X0; x <= penX; x += 0.75) { const y = lineY(x, stageAt); x === X0 ? c.moveTo(x + dx, y + dy) : c.lineTo(x + dx, y + dy); } };
  c.lineJoin = "round"; c.lineCap = "round";
  path(2.5, 2); c.strokeStyle = "rgba(50,85,164,.85)"; c.lineWidth = 3; c.stroke();
  path(0, 0); c.strokeStyle = "#1B1B1B"; c.lineWidth = 3; c.stroke();

  // Numbers.
  const bpm = Math.round(BPM[st] + (st > 0 && pr < 1 ? Math.sin(t * 9) * 2 : 0));
  el.querySelector(".hr b").textContent = bpm;
  const hz = BPM[st] / 60, beat = (t * hz) % 1, pulse = 1 + 0.22 * Math.exp(-beat * 9);
  el.querySelector(".heart").style.transform = `scale(${pulse})`;
  const mins = 8 * 60 + pr * 15 * 60, hh = Math.floor(mins / 60), mm = Math.floor(mins % 60);
  el.querySelector(".tod b").textContent = `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh >= 12 ? "PM" : "AM"}`;
  const ph = b.hours * 60 * passed / b.hits;
  el.querySelector(".phoneTime b").textContent = `${Math.floor(ph / 60)}H ${String(Math.round(ph % 60)).padStart(2, "0")}M`;
  el.querySelector(".status").textContent = STATUS[st];

  // Stickers drop onto the line a moment before the pen reaches them.
  const ss = el.querySelectorAll(".sticker"), tags = el.querySelectorAll(".tag");
  xs.forEach((x, i) => {
    const arrive = D0 + (D1 - D0) * ((x - X0) / (X1 - X0));
    const k = clamp((t - (arrive - 0.45)) / 0.45);
    const land = MID - 84;
    const y = -60 + (land + 60) * ease(k) + (k >= 1 ? 0 : 0);
    const squish = k >= 1 ? 1 + 0.25 * Math.exp(-(t - arrive) * 10) * Math.cos((t - arrive) * 30) : 1;
    const s = ss[i];
    s.style.left = `${x - 19}px`; s.style.top = `${y}px`;
    s.style.opacity = k > 0 ? 1 : 0;
    s.style.transform = `rotate(${(i % 2 ? 9 : -8) * ease(k)}deg) scale(${1 / squish}, ${squish})`;
    const g = tags[i];
    g.style.left = `${x - 22}px`; g.style.top = `${land - 14}px`;
    g.style.opacity = clamp((t - arrive) / 0.3);
  });

  // The pen: the brain rides the line, face by stage, a squash when an app lands.
  const pen = el.querySelector(".pen");
  const py = lineY(Math.max(X0, penX - 1), stageAt);
  const sinceHit = Math.min(...xs.map(x => t - (D0 + (D1 - D0) * ((x - X0) / (X1 - X0)))).filter(v => v >= 0), 9);
  const sq = 0.18 * Math.exp(-sinceHit * 7) * Math.cos(sinceHit * 22);
  const bob = Math.sin(t * 5) * 1.5;
  pen.style.left = `${Math.min(penX - 42, CW - 74)}px`; pen.style.top = `${py - 70 + bob}px`;
  pen.style.transform = `scale(${1 + sq}, ${1 - sq})`; pen.style.transformOrigin = "50% 100%";
  pen.querySelector("img").src = st === 0 ? EXACT : BODY(st);
  pen.querySelector(".face").innerHTML = st === 0 ? "" : face(st, t);

  // End: status out, the one finding in.
  const e = clamp((t - (D1 + 0.6)) / 0.5);
  el.querySelector(".status").style.opacity = 1 - e;
  el.querySelector(".phoneTime").style.opacity = 1 - e;
  const fd = el.querySelector(".find");
  fd.style.opacity = e; fd.style.transform = `translateY(${(1 - ease(e)) * 40}px)`;
}

const row = document.getElementById("row");
const frames = (new URLSearchParams(location.search).get("f") || "2:2.4,2:4.4,2:9,3:9,0:9").split(",").map(s => s.split(":").map(Number));
const phones = frames.map(([band]) => { const d = document.createElement("div"); d.className = "phone"; row.appendChild(d); return setup(d, band); });
window.render = t => phones.forEach((p, i) => drawPhone(p, t ?? frames[i][1]));
window.renderAt = t => phones.forEach(p => drawPhone(p, t));
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { window.render(); window.ready = true; });
</script>
</body>
</html>
