<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Restrictions sheet matte</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Nunito",system-ui,sans-serif;background:#d9d9de;padding:20px;display:flex;gap:20px}
.cap{font:700 13px system-ui;color:#333;margin-bottom:6px}
.phone{width:393px;height:852px;border-radius:52px;overflow:hidden;position:relative;background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%);color:#F3F5F8}
.blob{position:absolute;border-radius:50%;filter:blur(55px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.45) 100%)}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000}
.sb{position:absolute;top:18px;left:34px;font-weight:600;font-size:16px}
.t{position:absolute;top:66px;width:100%;text-align:center;font-weight:700;font-size:13px;letter-spacing:4px;color:#8E97A3}
.done{position:absolute;top:60px;right:24px;font-weight:600;font-size:17px;color:#C3CAD3}
.h{position:absolute;left:24px;right:24px;top:140px;font-weight:300;font-size:26px;line-height:1.2}
.btn{position:absolute;left:24px;right:24px;height:60px;border-radius:22px;display:grid;place-items:center;font-weight:800;font-size:16px;letter-spacing:2px}
.p{background:linear-gradient(180deg,#F4F6F9,#D5DBE2);color:#0E1218;box-shadow:0 8px 12px rgba(0,0,0,.6)}
.q{background:linear-gradient(180deg,#1B1E22,#131518);color:#C3CAD3;box-shadow:inset 0 0 0 1.5px #2B2F35}
</style></head><body><div id="r" style="display:flex;gap:20px"></div>
<script>
const W=393,H=852;
function ph(cap,head,btn,prom){
 const g=[['#3A7BD8',.10,.25,.87],['#6A4FD6',.95,.50,.82],['#229BA6',.50,1.0,.92]];
 const b=g.map(([c,x,y,s])=>{const d=W*s;return `<div class="blob" style="width:${d}px;height:${d}px;left:${W*x-d/2}px;top:${H*y-d/2}px;background:${c};opacity:.8"></div>`}).join('');
 return `<div><div class="cap">${cap}</div><div class="phone">${b}<div class="vig"></div><div class="island"></div><div class="sb">9:41</div><div class="t">RESTRICTIONS</div><div class="done">Done</div><div class="h">${head}</div><div class="btn ${prom?'p':'q'}" style="top:260px">${btn}</div></div></div>`}
document.getElementById('r').innerHTML=
 ph('Access off','Screen Time access is off.','ALLOW ACCESS',true)+
 ph('Access on, apps chosen','Ready. Chosen apps are shielded during a session.','CHANGE APPS',false);
</script></body></html>
