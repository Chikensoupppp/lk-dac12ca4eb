<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plus review shot fix</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* The App Review screenshot of the Plus offer, with the member card redrawn the way the app draws it
   now (PlusOfferStep.card, 1 pt = 3.28 px here). The old capture caught a build that cut "PLUS" off. */
body { margin: 0; width: 1290px; height: 2796px; position: relative; overflow: hidden; }
.bg { position: absolute; inset: 0; background: url(plus-review-shot.png) 0 0 / 1290px 2796px; }
.patch { position: absolute; left: 30px; top: 830px; width: 1230px; height: 545px; background: #E2E3DE;
  -webkit-mask: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent),
                linear-gradient(transparent, #000 30px, #000 calc(100% - 30px), transparent);
  -webkit-mask-composite: source-in; mask-composite: intersect; }
.wrap { position: absolute; left: 101px; top: 915px; width: 1090px; height: 365px; transform: rotate(-2deg); }
.ink { position: absolute; left: 0; right: 0; top: 20px; bottom: -20px; border-radius: 72px; background: #1B1B1B; }
.card { position: absolute; inset: 0; border-radius: 72px; overflow: hidden; background: #3255A4;
  box-shadow: 0 46px 46px rgba(0,0,0,.25); }
.dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 4.6px, transparent 5px);
  background-size: 29.5px 29.5px; background-position: 0 0; }
.border { position: absolute; inset: 0; border-radius: 72px; border: 6.6px solid #1B1B1B; }
.txt { position: absolute; left: 52px; top: 52px; bottom: 52px; color: #fff; display: flex; flex-direction: column; }
.m1 { font: 700 33px/1 'IBM Plex Mono'; letter-spacing: 6px; opacity: .8; }
.plus { font: 400 112px/1 Anton; margin-top: 13px; }
.m2 { margin-top: auto; font: 500 39px/1 'IBM Plex Mono'; letter-spacing: 6.5px; opacity: .85; }
.brain { position: absolute; right: 20px; bottom: -33px; width: 289px; }
.stamp { position: absolute; left: 341px; top: 98px; font: 400 72px/1 Anton; letter-spacing: 3px; color: #FFB511;
  padding: 16px 39px; border-radius: 33px; border: 10px solid #FFB511; background: rgba(27,27,27,.18); transform: rotate(-9deg); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="patch"></div>
<div class="wrap">
  <div class="ink"></div>
  <div class="card">
    <div class="dots"></div>
    <div class="txt"><div class="m1">MEMBER CARD</div><div class="plus">PLUS</div><div class="m2">SWIPELATER · 2026</div></div>
    <img class="brain" src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png">
    <div class="stamp">LOCKED IN</div>
  </div>
  <div class="border"></div>
</div>
<script>document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => window.ready = true);</script>
</body>
</html>
