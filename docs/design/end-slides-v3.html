<!doctype html><meta charset=utf-8>
<!-- Preview of the 2026-11-20 fixes, drawn like the SwiftUI (402x874 pt, render at 3x):
     ?s=when     slide 12, Free/Plus shown, not picked (WhenSteps.ThenInfoCards)
     ?s=paywall  the Plus offer with one row per plan, price per year / per month (PlusOfferStep.planRow)
     ?s=slide    the last slide with the plan's session, the picked apps and "Not now"
     ?s=pc1 / ?s=pc2  the two new PC slides (PCSteps.swift); window.renderAt(t) plays them.
     Inter / Anton / Barlow Condensed / IBM Plex Mono stand in for SF; example prices and apps. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
:root{--paper:#E7E8E3;--ink:#1B1B1B;--blue:#3255A4;--sun:#FFB511;--red:#D25A44;--soft:#45473F;--sheet:#F4F4F0;--orange:#E85A1E}
*{margin:0;box-sizing:border-box}
body{width:402px;height:874px;overflow:hidden;background:var(--paper);font-family:Inter,system-ui;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
canvas#field{position:absolute;inset:0;width:402px;height:874px}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 6px 42px;font:600 17px Inter;z-index:2}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:2}
.bars{position:absolute;top:66px;left:24px;right:24px;display:flex;gap:3px}.bars i{flex:1;height:4px;border-radius:2px;background:rgba(27,27,27,.18)}.bars i.on{background:var(--ink)}
.back{position:absolute;top:70px;left:24px;height:44px;display:flex;align-items:center}
.content{position:absolute;top:114px;left:24px;right:24px}
.tag{display:flex;gap:7px;align-items:center;font:700 11px/13px 'IBM Plex Mono';letter-spacing:1.4px;color:var(--blue);text-transform:uppercase}
.tag b{width:7px;height:7px;border-radius:50%;background:var(--blue)}
h1{font:400 52px/0.98 Anton;text-transform:uppercase;margin-top:10px;letter-spacing:.2px}
.btn{position:absolute;left:24px;right:24px;height:60px;border-radius:30px;background:var(--ink);color:var(--paper);font:800 19px/60px 'Barlow Condensed';letter-spacing:2px;text-align:center}
.sec{position:absolute;left:24px;right:24px;height:44px;font:600 15px/44px Inter;color:rgba(27,27,27,.65);text-align:center}
.home{position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;border-radius:3px;background:var(--ink)}
.mono{font-family:'IBM Plex Mono';font-weight:700}
.badge-plus{font:700 10px 'IBM Plex Mono';letter-spacing:1px;padding:2px 8px;border-radius:20px;background:var(--sun);border:2px solid var(--ink)}
.badge-free{font:700 10px 'IBM Plex Mono';letter-spacing:1px;padding:2px 8px;border-radius:20px;border:2px solid var(--ink)}
.abs{position:absolute}
</style>
<body>
<canvas id=field></canvas>
<div class=island></div>
<div class=status><span>9:41</span><span style="letter-spacing:2px;font-size:13px">●●● ▮</span></div>
<div class=bars id=bars></div>
<div class=back><svg width=12 height=20 viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill=none stroke="#1B1B1B" stroke-width=3 stroke-linecap=round stroke-linejoin=round /></svg></div>
<div class=content id=content></div>
<div class=home></div>
<script src="../marketing/field.js"></script>
<script>
const s = new URLSearchParams(location.search).get('s') || 'pc1';
const $ = id => document.getElementById(id);
const C = $('content');
const bars = n => { $('bars').innerHTML = Array.from({length: 15}, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); };
const head = (tag, title, size = 52) => `<div class=tag><b></b>${tag}</div><h1 style="font-size:${size}px">${title}</h1>`;
const btn = (t, bottom = 42) => document.body.insertAdjacentHTML('beforeend', `<div class=btn style="bottom:${bottom}px">${t}</div>`);
const icon = (bg, glyph) => `<div style="width:44px;height:44px;border-radius:11px;background:${bg};display:grid;place-items:center;position:relative">${glyph}</div>`;
const G = {
  play: '<svg width=18 height=18 viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="#fff"/></svg>',
  chat: '<svg width=20 height=20 viewBox="0 0 24 24"><path d="M4 6.5A3 3 0 0 1 7 3.5h10a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-6l-4.5 4v-4H7a3 3 0 0 1-3-3z" fill="#fff"/></svg>',
  game: '<svg width=22 height=22 viewBox="0 0 24 24"><path d="M7 7.5h10a5 5 0 0 1 4.6 7l-.9 2.2a2.3 2.3 0 0 1-3.8.6L15 15.5H9l-1.9 1.8a2.3 2.3 0 0 1-3.8-.6l-.9-2.2A5 5 0 0 1 7 7.5z" fill="#fff"/></svg>',
  cam: '<svg width=20 height=20 viewBox="0 0 24 24"><rect x=3 y=7 width=18 height=13 rx=3.5 fill="#fff"/><rect x=8.5 y=4.5 width=7 height=4 rx=1.5 fill="#fff"/><circle cx=12 cy=13.5 r=3.4 fill="#E1306C"/></svg>',
  globe: '<svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke="#1B1B1B" stroke-width=2><circle cx=12 cy=12 r=8.6 /><path d="M3.6 12h16.8M12 3.4c3 3 3 14.2 0 17.2M12 3.4c-3 3-3 14.2 0 17.2"/></svg>',
};
const lockBadge = (on = 1) => `<div style="position:absolute;right:-7px;bottom:-7px;width:22px;height:22px;border-radius:50%;background:#1B1B1B;border:2px solid #fff;display:grid;place-items:center;transform:scale(${on})"><svg width=10 height=10 viewBox="0 0 24 24"><rect x=5 y=10.5 width=14 height=10 rx=2.5 fill="#fff"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill=none stroke="#fff" stroke-width=3 /></svg></div>`;

if (s === 'when') {
  bars(12);
  C.innerHTML = head('Your time', 'When works<br>for you?', 48) + `
   <div style="margin-top:16px;height:108px;border-radius:22px;background:var(--sheet);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 14px">
     <div style="width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 22px Inter">−</div>
     <div style="font:400 64px Anton">4:00<span style="font-size:26px;margin-left:4px">PM</span></div>
     <div style="width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 22px Inter">+</div></div>
   <div style="display:flex;gap:6px;margin-top:18px">${['9 AM','12 PM','4 PM','7 PM','9 PM'].map(t => `<div style="flex:1;height:44px;border-radius:22px;border:2px solid var(--ink);display:grid;place-items:center;font:700 16px 'Barlow Condensed';background:${t==='4 PM'?'var(--blue)':'#fff'};color:${t==='4 PM'?'#fff':'var(--ink)'}">${t}</div>`).join('')}</div>
   <div style="display:flex;justify-content:space-between;margin-top:18px">${['M','T','W','T','F','S','S'].map((d,i) => `<div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 13px Inter;background:${i<5?'var(--blue)':'#fff'};color:${i<5?'#fff':'var(--ink)'}">${d}</div>`).join('')}</div>
   <div class=mono style="font-size:11px;letter-spacing:1.4px;color:var(--soft);margin-top:18px">AND THEN?</div>
   <div style="display:flex;gap:12px;margin-top:18px">
    ${[[false,'bell','Remind me','A nudge at 4:00. You start it.'],[true,'lock','Lock by itself','Your apps lock at 4:00 on their own.']].map(([plus,ic,t,l]) => `
     <div style="flex:1;min-height:128px;border-radius:18px;background:rgba(255,255,255,.75);border:1.5px solid rgba(27,27,27,.14);padding:14px">
      <div style="display:flex;align-items:center;justify-content:space-between">
       <div style="width:34px;height:34px;border-radius:50%;background:${plus?'var(--sun)':'var(--blue)'};display:grid;place-items:center">${ic==='bell'
         ? '<svg width=15 height=15 viewBox="0 0 24 24"><path d="M6.5 16.5v-5a5.5 5.5 0 0 1 11 0v5l1.6 2H4.9z" fill="#fff"/><path d="M10 20.3a2.2 2.2 0 0 0 4 0" stroke="#fff" stroke-width=2 fill=none /></svg>'
         : '<svg width=14 height=14 viewBox="0 0 24 24"><rect x=5 y=10.5 width=14 height=10 rx=2.5 fill="#1B1B1B"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill=none stroke="#1B1B1B" stroke-width=2.6 /></svg>'}</div>
       <span class="${plus?'badge-plus':'badge-free'}">${plus?'PLUS':'FREE'}</span></div>
      <div style="font:700 17px 'Barlow Condensed';margin-top:12px">${t}</div>
      <div style="font:500 12.5px/1.3 Inter;opacity:.8;margin-top:4px">${l}</div></div>`).join('')}
   </div>`;
  btn('SET 4:00 PM');
}

if (s === 'paywall') {
  bars(14);
  C.innerHTML = head('Optional', 'Lock in<br>for real.', 40) + `
   <div style="margin:16px 6px 8px;height:100px;border-radius:22px;background:var(--blue);border:2px solid var(--ink);box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg);position:relative;color:#fff;padding:16px;overflow:hidden">
     <div class=mono style="font-size:10px;letter-spacing:1.8px;opacity:.8">MEMBER CARD</div><div style="font:400 34px Anton;margin-top:2px">PLUS</div>
     <div class=mono style="font-size:12px;letter-spacing:2px;opacity:.85;position:absolute;bottom:12px">SWIPELATER · 2026</div>
     <img src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" style="position:absolute;right:14px;top:18px;width:74px"></div>
   ${[['#3255A4','Unlimited Locked mode','No quit button. It runs to the end.'],['#FFB511','A friend holds the key','They end it early. Or 1 emergency exit a week.'],['#D25A44','Every week, saved','Your whole history, not just 3 weeks.']].map(([c,t,l]) => `
    <div style="display:flex;gap:12px;align-items:center;margin-top:6px"><div style="width:30px;height:30px;border-radius:50%;background:${c};border:2px solid var(--ink);flex:none"></div>
    <div><div style="font:700 16px 'Barlow Condensed'">${t}</div><div style="font:500 14px Inter;color:#3F413B">${l}</div></div></div>`).join('')}
   <div style="margin-top:16px;display:flex;flex-direction:column;gap:10px">
    ${[[true,'Yearly','7 DAYS FREE','$2.50 a month, billed yearly','$29.99','year'],[false,'Monthly','','Billed every month','$4.99','month']].map(([on,t,b,n,p,per]) => `
     <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;border-radius:16px;background:#fff;border:2px solid ${on?'var(--ink)':'rgba(27,27,27,.16)'};box-shadow:${on?'0 4px 0 var(--ink)':'none'}">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${on?'var(--ink)':'rgba(27,27,27,.3)'};display:grid;place-items:center">${on?'<div style="width:10px;height:10px;border-radius:50%;background:var(--ink)"></div>':''}</div>
      <div style="flex:1"><div style="display:flex;align-items:center;gap:8px"><span style="font:700 18px 'Barlow Condensed'">${t}</span>${b?`<span style="font:700 10px 'IBM Plex Mono';letter-spacing:.8px;padding:2px 7px;border-radius:20px;background:var(--sun);border:1.5px solid var(--ink)">${b}</span>`:''}</div>
       <div style="font:500 13px Inter;color:#3F413B;margin-top:3px">${n}</div></div>
      <div style="text-align:right"><div style="font:700 20px 'Barlow Condensed'">${p}</div><div style="font:600 12px Inter;color:#3F413B">/ ${per}</div></div></div>`).join('')}
   </div>
   <div style="font:500 12.5px/1.35 Inter;color:#3F413B;margin-top:12px">Free for 7 days, then $29.99 a year. Renews automatically until you cancel in Settings.</div>`;
  btn('TRY 7 DAYS FREE', 86);
  document.body.insertAdjacentHTML('beforeend', `<div class=sec style="bottom:42px;display:flex;justify-content:center;gap:20px;font-size:14px"><b style="color:var(--ink)">Not now</b><span>Restore</span><span>Terms</span><span>Privacy</span></div>`);
}

if (s === 'slide') {
  bars(15);
  C.innerHTML = head('Start', 'Slide to start<br>your first<br>session.') + `
   <div style="margin-top:22px;border-radius:24px;background:var(--sheet);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:16px">
    <div style="display:flex;justify-content:space-between">
     <div><div class=mono style="font-size:11px;letter-spacing:1.4px;color:var(--soft)">READY</div>
      <div style="font:400 64px/1.05 Anton">45:00</div><div style="font:700 17px 'Barlow Condensed'">Studying, session 1</div></div>
     <div style="width:84px;height:84px;border-radius:50%;border:9px solid rgba(27,27,27,.12)"></div></div>
    <div style="display:flex;gap:6px;margin-top:14px">${['Ends 4:45 PM','1 of 2 today'].map(t => `<span style="font:700 10.5px Inter;padding:5px 8px;border-radius:20px;background:#fff;border:1.5px solid rgba(27,27,27,.18)">${t}</span>`).join('')}</div>
    <div class=mono style="font-size:11px;letter-spacing:1.4px;color:var(--soft);margin-top:14px">THESE WAIT TILL YOU’RE DONE</div>
    <div style="display:flex;gap:14px;margin-top:10px;padding-bottom:6px">
     ${icon('#E03B3B', G.play)}${icon('linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)', G.cam)}${icon('#6C4BD1', G.game)}${icon('#2FB65A', G.chat)}
     <div style="width:44px;height:44px;border-radius:11px;background:#fff;border:1.5px solid rgba(27,27,27,.2);display:grid;place-items:center">${G.globe}</div></div>
   </div>`;
  document.body.insertAdjacentHTML('beforeend', `
   <div style="position:absolute;left:24px;right:24px;bottom:94px;height:76px;border-radius:38px;background:var(--ink);box-shadow:0 14px 15px rgba(27,27,27,.22);display:flex;align-items:center">
    <div style="width:64px;height:64px;margin-left:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ECEDE8);display:grid;place-items:center"><img src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" style="width:70px"></div>
    <div style="flex:1;text-align:center;font:700 15px Inter;letter-spacing:3px;color:rgba(231,232,227,.75);padding-right:20px">SLIDE TO LOCK IN</div></div>
   <div class=sec style="bottom:42px">Not now</div>`);
}

// ---------- PC slides ----------
const brain = (w) => `<img src="../../apps/ios/BrainArt/Assets.xcassets/BrainExact.imageset/BrainExact.png" style="width:${w}px;display:block">`;
const win = (title, fill, inner, w, h) => `<div style="width:${w}px;height:${h}px;border-radius:6px;background:${fill};border:1.3px solid var(--ink);overflow:hidden">
  <div style="height:15px;display:flex;align-items:center;gap:3px;padding:0 7px"><i style="width:4px;height:4px;border-radius:50%;background:rgba(69,71,63,.45)"></i><i style="width:4px;height:4px;border-radius:50%;background:rgba(69,71,63,.45)"></i><i style="width:4px;height:4px;border-radius:50%;background:rgba(69,71,63,.45)"></i><span style="font:700 7.5px 'IBM Plex Mono';color:var(--soft);margin-left:4px">${title}</span></div>${inner}</div>`;
const doc = (ws) => `<div style="padding:8px;display:flex;flex-direction:column;gap:6px">${ws.map(w => `<i style="display:block;height:4px;border-radius:2px;background:rgba(27,27,27,.13);width:${w * 100}%"></i>`).join('')}</div>`;
const thumb = `<div style="position:absolute;inset:21px 6px 6px;border-radius:4px;background:var(--blue);display:grid;place-items:center"><div style="width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center"><svg width=10 height=10 viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="#3255A4"/></svg></div></div>`;
const pill = (t, f) => `<span style="font:700 10.5px Inter;padding:5px 8px;border-radius:20px;white-space:nowrap;background:${f ? 'var(--ink)' : '#fff'};color:${f ? '#fff' : 'var(--ink)'};border:1.3px solid var(--ink)">${t}</span>`;
const bubble = (t, pills) => `<div style="background:#fff;border:1.5px solid var(--ink);border-radius:11px;padding:9px;box-shadow:0 4px 6px rgba(27,27,27,.18)"><div style="font:700 12px Inter;white-space:nowrap">${t}</div>${pills ? `<div style="display:flex;gap:5px;margin-top:7px">${pills}</div>` : ''}</div>`;
const laptop = (w, screen) => { const h = Math.round(w * .64); return `<div style="display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 14px 16px rgba(27,27,27,.22))">
  <div style="width:${w}px;height:${h}px;border-radius:15px;background:var(--ink);padding:8px"><div style="position:relative;width:100%;height:100%;border-radius:8px;background:var(--sheet);overflow:hidden">${screen}</div></div>
  <div style="width:${w + 36}px;height:13px;background:var(--ink);border-radius:2px 2px 12px 12px;position:relative"><i style="position:absolute;left:50%;top:2px;width:60px;height:4px;margin-left:-30px;border-radius:2px;background:#55554F"></i></div></div>`; };
function spring(t, response, damping) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI / response, z = damping;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = p => Math.min(Math.max(p, 0), 1), lerp = (a, b, p) => a + (b - a) * p;
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : (p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2);
let ripples = [];
const field = $('field');

if (s === 'pc1') {
  bars(7);
  C.innerHTML = head('Your PC too', 'Your PC<br>locks in too.') + `<div id=stage style="position:relative;height:217px;margin-top:46px"></div>
   <div id=cap class=mono style="font-size:11px;letter-spacing:1px;color:var(--soft);text-align:center;margin-top:66px">FREE FOR WINDOWS · PAIR ONCE WITH A QR CODE</div>`;
  btn('NEXT');
  const W = 318, w = W - 16, h = Math.round(W * .64) - 16;
  window.renderAt = (t) => {
    const pIn = spring(t - .3, .55, .8), pPh = spring(t - .75, .5, .75), pLink = spring(t - 1.25, .35, .6),
      pDis = spring(t - 2.05, .4, .72), pAsk = spring(t - 2.55, .45, .62), pBack = spring(t - 4.95, .45, .8);
    const back = t >= 4.95, asking = t >= 2.55, offTask = asking && !back;
    const screen = `
      <div class=abs style="left:12px;top:12px">${win('Essay draft', '#fff', doc([.92,.84,.95,.6,.88,.72]), w * .66, h * .66)}</div>
      <div class=abs style="left:0;top:${h - 16}px;width:${w}px;height:16px;background:rgba(27,27,27,.06);display:flex;justify-content:center;align-items:center;gap:6px">${[0,1,2,3].map(i => `<i style="width:10px;height:10px;border-radius:2px;background:${i===2&&back?'var(--blue)':'rgba(27,27,27,.18)'}"></i>`).join('')}</div>
      ${t >= 1.25 ? `<div class=abs style="right:5px;top:8px;transform:scale(${lerp(.6,1,pLink)});opacity:${clamp(pLink)};font:700 7.5px 'IBM Plex Mono';letter-spacing:.6px;color:#fff;background:var(--blue);padding:3px 7px;border-radius:20px">LOCKED IN · 24:59</div>` : ''}
      <div class=abs style="left:${w * .3}px;top:${lerp(26, h * .5, pBack)}px;transform-origin:50% 100%;transform:scale(${back ? lerp(1, .06, pBack) : lerp(.9, 1, pDis)});opacity:${t < 2.05 ? 0 : back ? clamp(1 - pBack * 1.4) : clamp(pDis)}">${win('Video site', '#DCE3F2', thumb, w * .58, h * .6)}</div>
      ${asking ? `<div class=abs style="right:50px;bottom:30px;transform-origin:100% 100%;transform:scale(${lerp(.7,1,pAsk)});opacity:${clamp(pAsk)}">${bubble(back ? 'Nice. Back to it!' : 'Is this for your work?', back ? '' : pill('It’s for work', 0) + `<span style="display:inline-block;transform:scale(${t > 4.85 && t < 5.05 ? .93 : 1})">${pill('Back to work', 1)}</span>`)}</div>` : ''}
      <div class=abs style="right:4px;bottom:18px;transform-origin:50% 100%;transform:scale(${lerp(.6,1,pAsk)});opacity:${clamp(pAsk)}">${brain(50)}</div>`;
    const phone = `<div style="width:80px;height:154px;border-radius:17px;background:var(--sheet);border:4px solid var(--ink);padding:16px 5px 8px;position:relative;box-shadow:0 8px 10px rgba(27,27,27,.25)">
       <i style="position:absolute;left:50%;top:4px;width:24px;height:6px;margin-left:-12px;border-radius:3px;background:var(--ink)"></i>
       <div style="font:700 7px 'IBM Plex Mono';letter-spacing:.7px;color:${t >= 1.25 ? 'var(--blue)' : 'var(--soft)'}">${t >= 1.25 ? 'LOCKED IN' : 'READY'}</div>
       <div style="font:400 27px/1.1 Anton">24:59</div><div style="font:600 9px Inter">Studying</div>
       <div style="position:absolute;left:5px;bottom:8px;font:700 7px 'IBM Plex Mono';letter-spacing:.4px;color:${offTask ? 'var(--orange)' : 'var(--soft)'};opacity:${t >= 1.25 ? 1 : 0}">${offTask ? 'PC: VIDEO SITE' : 'PC: DOCS'}</div></div>`;
    $('stage').innerHTML = `<div class=abs style="left:0;right:0;bottom:0;display:flex;justify-content:center;transform:translateY(${lerp(36,0,pIn)}px);opacity:${clamp(pIn)}">${laptop(W, screen)}</div>
      <div class=abs style="left:0;bottom:0;transform:translate(${lerp(-70,-2,pPh)}px,28px) rotate(-6deg);opacity:${clamp(pPh)}">${phone}</div>`;
    $('cap').style.opacity = clamp(pIn);
    ripples = [{ x: 201, y: 874 * .6, start: 1.25, amp: .8 }, { x: 402 * .62, y: 874 * .5, start: 4.95, amp: 1.0 }];
    drawField(field, t + 2, t, .62, ripples);
  };
}

if (s === 'pc2') {
  bars(8);
  C.innerHTML = head('Your PC too', 'Save it<br>for later.') + `<div id=stage style="position:relative;height:360px;margin-top:42px"></div>
   <div id=cap class=mono style="font-size:11px;letter-spacing:1px;color:var(--soft);text-align:center;margin-top:8px">VIDEOS AND THREADS · SAVED ON YOUR PC</div>`;
  btn('NEXT');
  const W = 280, w = W - 16, h = Math.round(W * .64) - 16;
  const links = [['play', 'Video · 12 min'], ['text', 'Thread'], ['play', 'Video · 8 min']];
  const sv = { play: '<svg width=8 height=8 viewBox="0 0 24 24"><path d="M6 3v18l15-9z" fill="CLR"/></svg>', text: '<svg width=9 height=9 viewBox="0 0 24 24" fill=none stroke="CLR" stroke-width=4 stroke-linecap=round><path d="M4 6h16M4 12h11M4 18h14"/></svg>' };
  const from = [120, 78], to = [270, 208];
  // Beats from PCLaterStep.sendAll(): save at 3.1 s, three links, then SESSION DONE.
  const T = { in: .3, ask: .9, save: 3.1 };
  const shownAt = [3.1, 4.0, 4.82], sentAt = [3.3, 4.12, 4.94], savedAt = [3.75, 4.57, 5.39];
  window.renderAt = (t) => {
    const pIn = spring(t - T.in, .55, .8), pAsk = spring(t - T.ask, .45, .62), saving = clamp((t - T.save) / .25);
    const saved = savedAt.filter(x => t >= x).length;
    let prog = 0; savedAt.forEach((x, i) => { if (t >= x) prog = lerp(i / 4, (i + 1) / 4, clamp((t - x) / .5)); });
    if (t >= 5.64) prog = lerp(.75, 1, ease(clamp((t - 5.64) / .8)));
    const doneP = spring(t - 6.49, .45, .72), done = t >= 6.49;
    const bump = savedAt.reduce((m, x) => t >= x && t < x + .4 ? 1 + .06 * Math.sin(Math.PI * clamp((t - x) / .4)) : m, 1);
    const screen = `
      <div class=abs style="left:12px;top:20px">${win('Essay draft', '#fff', doc([.9,.8,.94,.55]), w - 24, h - 34)}</div>
      <div class=abs style="left:12px;top:8px;width:${w - 24}px;height:5px;border-radius:3px;background:rgba(27,27,27,.1)"><i style="display:block;height:5px;border-radius:3px;background:var(--blue);width:${prog * 100}%"></i></div>
      ${done ? `<div class=abs style="left:0;top:0;width:${w}px;height:${h}px;display:grid;place-items:center"><div style="font:400 20px Anton;letter-spacing:.5px;color:var(--red);background:rgba(255,255,255,.92);border:2.5px solid var(--red);border-radius:6px;padding:2px 8px;transform:rotate(-8deg) scale(${lerp(1.8,1,doneP)});opacity:${clamp(doneP)}">SESSION DONE</div></div>` : ''}
      <div class=abs style="left:12px;top:20px;transform:scale(${lerp(1,.3,saving)});opacity:${1 - saving}">${win('Video site', '#DCE3F2', thumb, w - 24, h - 34)}</div>
      ${t >= T.ask && saving < 1 ? `<div class=abs style="right:46px;bottom:14px;transform-origin:100% 100%;transform:scale(${lerp(.7,1,pAsk)});opacity:${clamp(pAsk) * (1 - saving)}">${bubble('Save it for later?', `<span style="display:inline-block;transform:scale(${t > 3.0 && t < 3.15 ? .93 : 1})">${pill('Save for later', 1)}</span>`)}</div>` : ''}
      <div class=abs style="right:2px;bottom:2px;transform-origin:50% 100%;transform:scale(${lerp(.6,1,pAsk)});opacity:${clamp(pAsk)}">${brain(46)}</div>`;
    const rows = done ? links.slice(0, saved).map(([k, tt], i) => `<div style="display:flex;align-items:center;gap:6px;background:#fff;border-radius:7px;padding:5px 6px;margin-top:6px;opacity:${clamp(doneP * 1.5 - i * .2)}">
        <span style="width:18px;height:18px;border-radius:4px;background:${i === 1 ? 'var(--ink)' : 'var(--blue)'};display:grid;place-items:center">${sv[k].replace('CLR', '#fff')}</span>
        <span style="font:600 11px Inter;flex:1">${tt}</span><span style="font:700 10px Inter;color:var(--blue)">Open</span></div>`).join('')
      : `<div style="font:600 10.5px Inter;opacity:.7;margin-top:6px">${saved ? 'Waits till you’re done' : 'Nothing yet'}</div>`;
    const card = `<div style="width:168px;border-radius:14px;background:var(--sun);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:10px;transform:scale(${bump})">
       <div style="display:flex;justify-content:space-between;align-items:center"><span class=mono style="font-size:11px;letter-spacing:1.2px">LATER</span><span style="font:400 22px Anton">${saved}</span></div>${rows}</div>`;
    const chips = links.map(([k, tt], i) => {
      if (t < shownAt[i]) return '';
      const p = spring(t - sentAt[i], .55, .8), sent = t >= sentAt[i];
      const x = sent ? lerp(from[0], to[0], p) : from[0], y = sent ? lerp(from[1], to[1], p) : from[1];
      const op = sent ? clamp(1 - (t - sentAt[i]) / .5) : clamp((t - shownAt[i]) / .12);
      return `<div class=abs style="left:${x}px;top:${y}px;transform:translate(-50%,-50%) scale(${sent ? lerp(1,.5,p) : 1});opacity:${op};display:flex;align-items:center;gap:5px;padding:6px 9px;border-radius:20px;background:#fff;border:1.5px solid var(--ink);white-space:nowrap;z-index:5">
        ${sv[k].replace('CLR', '#3255A4')}<span style="font:700 11px Inter">${tt}</span></div>`;
    }).join('');
    $('stage').innerHTML = `<div class=abs style="left:2px;top:0;transform:translateY(${lerp(36,0,pIn)}px);opacity:${clamp(pIn)}">${laptop(W, screen)}</div>
      <div class=abs style="left:186px;top:186px;transform:rotate(3deg);opacity:${clamp(pIn)}">${card}</div>${chips}`;
    $('cap').style.opacity = clamp(pIn);
    ripples = [...savedAt.map(x => ({ x: 402 * .78, y: 874 * .6, start: x, amp: .55, speed: 420 })), { x: 201, y: 437, start: 6.49, amp: 1 }];
    drawField(field, t + 2, t, .62, ripples);
  };
}

if (!window.renderAt) { window.renderAt = (t) => drawField(field, 2, 0, s === 'slide' ? .55 : 2, []); }
document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.complete ? 1 : new Promise(r => i.onload = i.onerror = r)))).then(() => { renderAt(9); window.ready = true; });
</script>
</body>
