<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shield C fun</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;user-select:none}
body{background:#cfcfd2;display:grid;place-items:center;min-height:100vh;font-family:Onest,system-ui,sans-serif}
.phone{width:393px;height:852px;border-radius:52px;overflow:hidden;position:relative;color:#fff;background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%)}
.island{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:80}
.sb{position:absolute;top:18px;left:34px;font-weight:600;font-size:16px;z-index:80}
h1{position:absolute;left:28px;top:100px;font:800 40px/1.03 Onest;letter-spacing:-1.3px;width:345px}
h1 span{display:inline-block;transform:translateY(30px);opacity:0}
.p{position:absolute;left:28px;top:208px;font-size:17px;color:#b9c0d4;width:330px}
.grid{position:absolute;left:30px;right:30px;top:290px;display:grid;grid-template-columns:repeat(4,1fr);gap:28px 18px}
.cell{display:grid;justify-items:center;gap:7px;font-size:12px;color:#e5e8f2;position:relative;transform:scale(0);transition:color .4s}
.cell i{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;position:relative;overflow:hidden}
.cell i svg{width:30px;height:30px}
.cell i::after{content:"";position:absolute;inset:0;background:rgba(18,22,36,.72);backdrop-filter:blur(5px);opacity:0;transition:opacity .25s}
.cell b{position:absolute;top:19px;width:26px;height:26px;z-index:2;opacity:0}
.cell.lk i::after{opacity:1}.cell.lk b{opacity:1}.cell.lk{color:#8d94aa}
.wig{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-2.2deg) scale(1)}to{transform:rotate(2.2deg) scale(1)}}
.bub{position:absolute;top:-30px;left:50%;transform:translateX(-50%) scale(0);background:#fff;color:#0f1320;font-weight:700;font-size:13px;padding:4px 10px;border-radius:12px;white-space:nowrap;z-index:6}
.bub::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff;border-bottom:0}
.pill{position:absolute;left:50%;top:650px;transform:translate(-50%,20px) scale(.6);opacity:0;background:#fff;color:#0f1320;font-weight:800;font-size:20px;padding:11px 22px;border-radius:30px;white-space:nowrap}
.btn{position:absolute;left:26px;right:26px;bottom:60px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:700;font-size:17px;background:#fff;color:#0f1320}
.sheet{position:absolute;left:0;right:0;top:120px;bottom:0;z-index:40;border-radius:22px 22px 0 0;background:#1c1c1e;transform:translateY(105%);font-family:-apple-system,Inter,system-ui,sans-serif}
.sh-top{display:flex;justify-content:space-between;padding:18px 20px 8px;font-size:17px;color:#0A84FF}.sh-top b{color:#fff;font-weight:600}
.sh-s{margin:6px 16px 8px;height:36px;border-radius:10px;background:#2c2c2e;color:#8e8e93;display:flex;align-items:center;padding:0 12px;font-size:16px}
.sh-h{padding:10px 20px 6px;font-size:13px;color:#8e8e93;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:0 20px;height:54px;border-bottom:1px solid #ffffff12;font-size:17px;opacity:0;transform:translateX(30px)}
.row u{width:34px;height:34px;border-radius:8px;flex:none;display:block}
.rad{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid #636366;display:grid;place-items:center;color:#fff;font-size:15px;position:relative}
.row.sel .rad{background:#34C759;border-color:#34C759}
.cnt{position:absolute;left:0;right:0;bottom:34px;text-align:center;color:#8e8e93;font-size:14px}
.dim{position:absolute;inset:0;background:#0008;z-index:30;opacity:0;pointer-events:none}
.tap{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #fff;background:#ffffff33;z-index:90;pointer-events:none;opacity:0}
.fly{position:absolute;z-index:70;border-radius:15px;pointer-events:none}
.dot{position:absolute;width:9px;height:9px;border-radius:50%;z-index:75;pointer-events:none}
.ring{position:absolute;left:50%;top:32px;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:3px solid #fff;z-index:7;pointer-events:none;opacity:0}
</style></head><body>
<div class="phone" id="ph"><div class="island"></div><div class="sb">9:41</div>
<h1 id="h"></h1>
<p class="p" id="p"></p>
<div class="grid" id="g"></div>
<div class="pill" id="pill">3 apps locked</div>
<div class="btn" id="btn">Choose apps</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet">
 <div class="sh-top"><span>Cancel</span><b>Select Apps</b><span id="done">Done</span></div>
 <div class="sh-s">&#8981;&nbsp; Search</div>
 <div class="sh-h">Social</div>
 <div class="row" data-i="0"><u style="background:#E4573D"></u>Instagram<div class="rad"></div></div>
 <div class="row" data-i="1"><u style="background:#17181B;box-shadow:0 0 0 1px #444 inset"></u>X<div class="rad"></div></div>
 <div class="row"><u style="background:#3E7BD6"></u>Messages<div class="rad"></div></div>
 <div class="sh-h">Entertainment</div>
 <div class="row" data-i="2"><u style="background:#D93636"></u>YouTube<div class="rad"></div></div>
 <div class="row"><u style="background:#3E9A4E"></u>Podcasts<div class="rad"></div></div>
 <div class="cnt" id="cnt">0 selected</div>
</div>
<div class="tap" id="tap"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),ph=$('#ph');
const spring='cubic-bezier(.3,1.7,.5,1)';
const cols=['#E4573D','#17181B','#D93636','#3E7BD6','#3E9A4E','#E2B53A','#8A3FA0','#1F8C7E','#C46A2B','#4B5563','#D6407A','#2D7FE0'];
const names=['Instagram','X','YouTube','Messages','Podcasts','Reddit','Camera','Maps','Mail','Notes','Photos','Music'];
const g=(p)=>`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const glyph=[g('<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>'),g('<path d="M5 5l14 14M19 5L5 19"/>'),g('<path d="M8 5l11 7-11 7z" fill="#fff"/>'),g('<path d="M4 6h16v10H10l-4 3v-3H4z"/>'),g('<circle cx="12" cy="11" r="3"/><path d="M6 11a6 6 0 0 1 12 0M12 14v6"/>'),g('<circle cx="12" cy="12" r="8"/><circle cx="9" cy="11" r="1"/><circle cx="15" cy="11" r="1"/>'),g('<rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3"/>'),g('<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/>'),g('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 8l9 6 9-6"/>'),g('<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M9 8h6M9 12h6"/>'),g('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'),g('<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>')];
const lk=`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2" fill="#fff4"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
$('#g').innerHTML=names.map((n,i)=>`<div class="cell" id="c${i}"><i style="background:${cols[i]}">${glyph[i]}</i><b>${lk}</b>${n}<div class="bub">nope.</div><div class="ring"></div></div>`).join('');
const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:'forwards'},o)).finished;
function words(el,t){el.innerHTML=t.split(' ').map(w=>`<span>${w}</span>`).join(' ');return Promise.all([...el.children].map((s,i)=>A(s,[{transform:'translateY(30px)',opacity:0},{transform:'translateY(-6px)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:520,delay:i*90,easing:'ease-out'})))}
function say(t){const p=$('#p');p.textContent=t;return A(p,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:400})}
async function tapAt(el,sc=1){const pr=ph.getBoundingClientRect(),r=el.getBoundingClientRect(),t=$('#tap');
 t.style.left=(r.left-pr.left+r.width/2)+'px';t.style.top=(r.top-pr.top+r.height/2)+'px';
 await A(t,[{opacity:0,transform:'scale(1.5)'},{opacity:1,transform:'scale(1)'}],{duration:220});
 await A(el,[{transform:'scale(1)'},{transform:`scale(${.94*sc})`},{transform:'scale(1)'}],{duration:220,fill:'none'});
 await A(t,[{opacity:1},{opacity:0}],{duration:160})}
function burst(el){const pr=ph.getBoundingClientRect(),r=el.getBoundingClientRect(),x=r.left-pr.left+r.width/2,y=r.top-pr.top+32;
 const c=['#fff','#9CC9F5','#8FD3B0','#EDEBE6','#9CC9F5'];
 for(let k=0;k<12;k++){const d=document.createElement('div');d.className='dot';d.style.background=c[k%5];d.style.left=x-4+'px';d.style.top=y-4+'px';ph.appendChild(d);
  const a=k/12*6.28,dist=55+Math.random()*30;A(d,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist-10}px) scale(.3)`,opacity:0}],{duration:700,easing:'cubic-bezier(.2,.8,.3,1)'}).then(()=>d.remove())}}
async function lock(i){const c=$('#c'+i);c.classList.remove('wig');
 const ic=$('i',c);A(ic,[{transform:'scale(1)'},{transform:'scale(1.25) rotate(-6deg)'},{transform:'scale(.9) rotate(3deg)'},{transform:'scale(1)'}],{duration:460,fill:'none',easing:'ease-out'});
 c.classList.add('lk');const b=$('b',c);A(b,[{transform:'scale(3.4)',opacity:0},{transform:'scale(.8)',opacity:1,offset:.55},{transform:'scale(1)',opacity:1}],{duration:420,easing:'ease-out'});
 const ring=$('.ring',c);A(ring,[{transform:'scale(.8)',opacity:.9},{transform:'scale(2.4)',opacity:0}],{duration:600,easing:'ease-out'});
 burst(c);const bub=$('.bub',c);A(bub,[{transform:'translateX(-50%) scale(0)',opacity:1},{transform:'translateX(-50%) scale(1.15)',opacity:1,offset:.3},{transform:'translateX(-50%) scale(1)',opacity:1,offset:.4},{transform:'translateX(-50%) scale(1)',opacity:1,offset:.8},{transform:'translateX(-50%) scale(0)',opacity:0}],{duration:1500});
 await sleep(520)}
async function play(){
 window.__done=false;
 await words($('#h'),'Lock the apps that pull you in.');say('Pick them once. They stay locked while your timer runs.');
 const cells=[...document.querySelectorAll('.cell')];
 await Promise.all(cells.map((c,i)=>A(c,[{transform:'scale(0) rotate(-20deg)'},{transform:'scale(1) rotate(0)'}],{duration:520,delay:i*55,easing:spring}).then(()=>{c.style.transform='none';c.classList.add('wig');c.style.animationDelay=(-i*.11)+'s'})));
 await sleep(900);
 await tapAt($('#btn'));
 $('#dim').animate([{opacity:0},{opacity:1}],{duration:350,fill:'forwards'});
 for(const e of [$('#h'),$('#p')])A(e,[{opacity:1},{opacity:0}],{duration:250});
 await A($('#sheet'),[{transform:'translateY(105%)'},{transform:'translateY(-14px)',offset:.8},{transform:'none'}],{duration:620,easing:'cubic-bezier(.2,.8,.2,1)'});
 await Promise.all([...ph.querySelectorAll('.row')].map((r,i)=>A(r,[{opacity:0,transform:'translateX(30px)'},{opacity:1,transform:'none'}],{duration:350,delay:i*70,easing:'ease-out'})));
 await sleep(700);
 let n=0;const picked=[];
 for(const r of ph.querySelectorAll('.row[data-i]')){const rad=$('.rad',r);await tapAt(rad);r.classList.add('sel');rad.textContent='✓';
  A(rad,[{transform:'scale(.5)'},{transform:'scale(1.35)',offset:.5},{transform:'scale(1)'}],{duration:380,easing:'ease-out',fill:'none'});
  n++;const cn=$('#cnt');cn.textContent=n+' selected';A(cn,[{transform:'scale(1)'},{transform:'scale(1.3)',color:'#fff'},{transform:'scale(1)'}],{duration:300,fill:'none'});picked.push(r);await sleep(500)}
 await sleep(400);await tapAt($('#done'));
 // icons fly from the list into the grid
 const pr=ph.getBoundingClientRect();
 const flyers=picked.map(r=>{const u=$('u',r),ur=u.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.style.cssText+=`background:${u.style.background};left:${ur.left-pr.left}px;top:${ur.top-pr.top}px;width:34px;height:34px`;ph.appendChild(f);return f});
 await Promise.all([A($('#sheet'),[{transform:'none'},{transform:'translateY(105%)'}],{duration:450,easing:'ease-in'}),A($('#dim'),[{opacity:1},{opacity:0}],{duration:450})]);
 await Promise.all(flyers.map((f,i)=>{const cr=$('#c'+i+' i').getBoundingClientRect(),fr=f.getBoundingClientRect();
  const dx=cr.left-fr.left,dy=cr.top-fr.top;return A(f,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx/2}px,${dy/2-90}px) scale(2.2) rotate(${i%2?12:-12}deg)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${64/34})`}],{duration:700,delay:i*140,easing:'cubic-bezier(.4,0,.2,1)'}).then(()=>f.remove())}));
 for(const e of [$('#h'),$('#p')])e.getAnimations().forEach(a=>a.cancel());
 for(const i of [0,1,2]){await lock(i)}
 ph.classList.add('won');
 await words($('#h'),'Your phone, minus the junk.');say('Locked apps go dim. Nothing opens until the timer ends.');
 await A($('#pill'),[{transform:'translate(-50%,20px) scale(.6)',opacity:0},{transform:'translate(-50%,-6px) scale(1.12)',opacity:1,offset:.6},{transform:'translate(-50%,0) scale(1)',opacity:1}],{duration:600,easing:'ease-out'});
 $('#btn').textContent='Looks right';A($('#btn'),[{transform:'scale(1)'},{transform:'scale(1.05)'},{transform:'scale(1)'}],{duration:500,fill:'none'});
 await sleep(2600);window.__done=true}
window.play=play;
if(location.search.includes('final')){const cs=[...document.querySelectorAll('.cell')];cs.forEach(c=>c.style.transform='none');[0,1,2].forEach(i=>$('#c'+i).classList.add('lk'));[0,1,2].forEach(i=>$('b',$('#c'+i)).style.opacity=1);$('#h').innerHTML='Your phone, minus the junk.';$('#p').textContent='Locked apps go dim. Nothing opens until the timer ends.';$('#pill').style.cssText='opacity:1;transform:translate(-50%,0)';ph.classList.add('won');[...$('#h').children].forEach(s=>{s.style.opacity=1;s.style.transform='none'})}
</script></body></html>
