<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock In your week, phone and PC</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@600&display=swap">
<style>
  * { box-sizing:border-box; margin:0; }
  :root { --ink:#EDEBE6; --soft:#8D9096; --ice:#9CC9F5; --panel:#1A1C20; }
  body { font-family:-apple-system,"Inter",system-ui,sans-serif; background:#cfcfd2; padding:22px; }
  .row { display:flex; gap:16px; }
  .cap { font:600 13px system-ui; color:#444; margin:0 0 6px 6px; }
  .wrap { zoom:.78; width:393px; height:852px; flex:none; }
  .phone { width:393px; height:852px; border-radius:52px; overflow:hidden; position:relative; background:linear-gradient(180deg,#121417 0%,#0A0B0D 60%,#08090A 100%); color:var(--ink); }
  .island { position:absolute; top:11px; left:50%; width:120px; height:34px; margin-left:-60px; border-radius:20px; background:#000; }
  .sb { position:absolute; top:18px; left:34px; font-weight:600; font-size:16px; }
  .mark { position:absolute; top:66px; left:26px; font-family:Fraunces,Georgia,serif; font-weight:600; font-size:17px; }
  .skip { position:absolute; top:66px; right:26px; font-size:15px; color:var(--soft); }
  h1 { position:absolute; left:26px; right:26px; top:106px; font-family:Fraunces,Georgia,serif; font-weight:500; font-size:44px; line-height:1; letter-spacing:-1px; }
  .lead { position:absolute; left:26px; width:330px; top:158px; font-size:17px; line-height:1.3; color:#C9CBD0; }
  .card { position:absolute; left:26px; right:26px; border-radius:18px; background:var(--panel); padding:14px 16px; }
  .card h3 { font-family:Fraunces,Georgia,serif; font-weight:500; font-size:20px; letter-spacing:-.2px; }
  .card .by { position:absolute; right:16px; top:17px; font-size:12px; color:var(--soft); }
  .app { display:flex; align-items:center; gap:10px; font-size:15px; margin-top:9px; }
  .app i { width:22px; height:22px; border-radius:7px; background:#2A2D33; display:block; }
  .app span { margin-left:auto; color:var(--soft); font-variant-numeric:tabular-nums; }
  .bar { height:12px; border-radius:6px; }
  .lbl { font-size:14px; display:flex; justify-content:space-between; margin:12px 0 5px; }
  .lbl span { color:var(--soft); font-variant-numeric:tabular-nums; }
  .note { position:absolute; font-family:Caveat,"Segoe Script",cursive; font-weight:600; font-size:26px; line-height:1.05; color:var(--ice); transform:rotate(var(--r,-4deg)); }
  .note.warm { color:var(--ink); }
  .btn { position:absolute; left:26px; right:26px; bottom:60px; height:58px; border-radius:14px; display:grid; place-items:center; font-weight:650; font-size:17px; background:var(--ink); color:#0A0B0D; }
  .fine { position:absolute; left:26px; right:26px; bottom:128px; font-size:13px; color:var(--soft); }
  svg { position:absolute; overflow:visible; } svg.rough { filter:url(#rough); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3"/></filter></svg>
<div class="row" id="r"></div>
<script>
const days = ['M','T','W','T','F','S','S'], h = [4.1, 3.4, 5.2, 3.8, 4.6, 6.1, 5.4];
const chart = days.map((d, i) => { const x = 8 + i * 40, hh = h[i] / 6.2 * 70, y = 80 - hh; return `<rect x="${x}" y="${y}" width="26" height="${hh}" rx="5" fill="${i===5?'#9CC9F5':'#3A3F47'}"/><text x="${x+13}" y="98" text-anchor="middle" font-size="11" fill="#8D9096">${d}</text>`; }).join('');
const phone = `<div><div class="cap">Your week (sample numbers)</div><div class="wrap"><div class="phone"><div class="island"></div><div class="sb">9:41</div>
  <div class="mark">Lock In</div><div class="skip">Done</div>
  <h1>Where your<br>week went.</h1>
  <p class="lead" style="top:204px">Your phone and your PC, side by side.</p>

  <div class="card" style="top:246px;height:196px">
    <h3>Phone</h3><div class="by">report by Apple</div>
    <svg style="left:16px;top:44px" width="290" height="104" viewBox="0 0 290 104">${chart}</svg>
    <div style="position:absolute;left:16px;right:16px;top:150px;font-size:14px;color:#C9CBD0;display:flex;justify-content:space-between"><span>Photo feed</span><span>Short posts</span><span>Videos</span></div>
  </div>

  <div class="card" style="top:458px;height:196px">
    <h3>PC</h3><div class="by">scanned on your PC</div>
    <div class="lbl" style="margin-top:14px">Work apps<span>9 h</span></div><div class="bar" style="width:46%;background:#8FD3B0"></div>
    <div class="lbl">Browser<span>6 h</span></div><div class="bar" style="width:31%;background:#9CC9F5"></div>
    <div class="lbl">Games<span>11 h</span></div><div class="bar" style="width:100%;background:#3A3F47"></div>
  </div>

  <div class="note" style="left:34px;top:668px;--r:-2deg">same week. two screens.<br>one place to fix it.</div>
  <p class="fine" style="bottom:134px;text-align:right;right:60px"></p>
  <div class="btn">Start 45 minutes on your work</div>
  <div style="position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:13px;color:var(--soft)">Your numbers stay on your devices.</div>
</div></div></div>`;
document.getElementById('r').innerHTML = phone;
</script>
</body>
</html>
